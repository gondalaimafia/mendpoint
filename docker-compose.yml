# Production-style local stack for Warden GA
# Usage:
#   docker compose run --rm api npm run auth:bootstrap
#   Set the printed key as MENDPOINT_API_KEY in .env
#   docker compose up --build
#   open http://localhost:3000  (web)  http://localhost:3001/status (API)
# Ports bind to loopback because the web proxy holds an operator API key.
# Remote exposure requires an external access gate in front of the web service.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      API_AUTH: required
      WEB_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GITHUB_MODE: mock
      RATE_LIMIT_MAX: "300"
      RATE_LIMIT_WINDOW_MS: "60000"
      MENDPOINT_DATA_DIR: /app/data
    volumes:
      - mendpoint-data:/app/data
      - mendpoint-runs:/app/runs
      - mendpoint-github:/app/.mendpoint
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      MENDPOINT_API_URL: http://api:3001
      MENDPOINT_API_KEY: ${MENDPOINT_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  mendpoint-data:
  mendpoint-runs:
  mendpoint-github:
