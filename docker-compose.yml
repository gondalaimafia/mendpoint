# Production-style local stack for Warden GA
# Usage:
#   docker compose up --build
#   open http://localhost:3000  (web)  http://localhost:3001/status (API)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      API_AUTH: required
      WEB_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GITHUB_MODE: mock
      RATE_LIMIT_MAX: "300"
      RATE_LIMIT_WINDOW_MS: "60000"
      MENDPOINT_DATA_DIR: /app/data
    volumes:
      - mendpoint-data:/app/data
      - mendpoint-runs:/app/runs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run build -w @mendpoint/web && npm run start -w @mendpoint/web"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./apps/web:/app/apps/web
      - ./tsconfig.base.json:/app/tsconfig.base.json
    depends_on:
      api:
        condition: service_healthy

volumes:
  mendpoint-data:
  mendpoint-runs:
