# Production-style local stack for Warden GA
# Usage:
#   Set GITHUB_MODE and MENDPOINT_WEB_ACCESS_TOKEN in .env
#   Bootstrap an API key into the mendpoint-data volume, then set MENDPOINT_API_KEY
#   docker compose up --build
#   open http://localhost:3000  (web)  http://localhost:3001/status (API)
# Ports bind to loopback because the web proxy holds an operator API key.
# Remote exposure requires an external access gate in front of the web service.
# The default mount exposes fixtures to the configured pilot account.
# Set MENDPOINT_REPOS_HOST_DIR to that tenant's repository directory.
# Register repository keys below that tenant directory in /workspace/repos.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      API_AUTH: required
      MENDPOINT_DEPLOYMENT_PROFILE: ${MENDPOINT_DEPLOYMENT_PROFILE:-demo}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GITHUB_MODE: ${GITHUB_MODE:?Set GITHUB_MODE to mock or real}
      MENDPOINT_DEPLOYMENT_CLASS: ${MENDPOINT_DEPLOYMENT_CLASS:-customer}
      MENDPOINT_FEED_POLLING_ENABLED: ${MENDPOINT_FEED_POLLING_ENABLED:-0}
      POLL_LOCAL_ONLY: ${POLL_LOCAL_ONLY:-1}
      MENDPOINT_PILOT_SEED: ${MENDPOINT_PILOT_SEED:-0}
      MENDPOINT_PROCESS_ROLE: api
      MENDPOINT_SANDBOX_KIND: ${MENDPOINT_SANDBOX_KIND:-local}
      MENDPOINT_SANDBOX_FLY_APP: ${MENDPOINT_SANDBOX_FLY_APP:-}
      MENDPOINT_SANDBOX_FLY_IMAGE: ${MENDPOINT_SANDBOX_FLY_IMAGE:-}
      MENDPOINT_SANDBOX_FLY_TOKEN: ${MENDPOINT_SANDBOX_FLY_TOKEN:-}
      MENDPOINT_SANDBOX_EGRESS_ATTESTATION_BASE64: ${MENDPOINT_SANDBOX_EGRESS_ATTESTATION_BASE64:-}
      MENDPOINT_SANDBOX_EGRESS_ATTESTATION_PUBLIC_KEY_SPKI_BASE64: ${MENDPOINT_SANDBOX_EGRESS_ATTESTATION_PUBLIC_KEY_SPKI_BASE64:-}
      MENDPOINT_SANDBOX_EGRESS_ATTESTATION_KEY_ID: ${MENDPOINT_SANDBOX_EGRESS_ATTESTATION_KEY_ID:-}
      MENDPOINT_SANDBOX_EGRESS_POLICY_DIGEST: ${MENDPOINT_SANDBOX_EGRESS_POLICY_DIGEST:-}
      MENDPOINT_SANDBOX_EGRESS_ATTESTATION_MIN_SCHEMA: ${MENDPOINT_SANDBOX_EGRESS_ATTESTATION_MIN_SCHEMA:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_APP_ACCOUNT_TENANT_BINDINGS: ${GITHUB_APP_ACCOUNT_TENANT_BINDINGS:-}
      RATE_LIMIT_MAX: "300"
      RATE_LIMIT_WINDOW_MS: "60000"
      MENDPOINT_DATA_DIR: /app/data
      MENDPOINT_REPOS_DIR: /workspace/repos
      MENDPOINT_APPLICATION_DATA_KEY: ${MENDPOINT_APPLICATION_DATA_KEY:?Set a distinct application data key}
      MENDPOINT_BACKUP_SOURCE_ROOT: ${MENDPOINT_BACKUP_SOURCE_ROOT:-/app/data}
      MENDPOINT_BACKUP_OUTPUT_ROOT: ${MENDPOINT_BACKUP_OUTPUT_ROOT:-/backup/mendpoint}
      MENDPOINT_BACKUP_FENCE_ROOT: ${MENDPOINT_BACKUP_FENCE_ROOT:-/app/data/.backup-fence}
      MENDPOINT_BACKUP_EVIDENCE_PATH: ${MENDPOINT_BACKUP_EVIDENCE_PATH:-/app/data/.backup-state/last-verified.json}
      MENDPOINT_BACKUP_STORAGE_CLASS: ${MENDPOINT_BACKUP_STORAGE_CLASS:-durable_isolated_mount}
      MENDPOINT_BACKUP_KEY: ${MENDPOINT_BACKUP_KEY:-}
      MENDPOINT_BACKUP_KEY_ID: ${MENDPOINT_BACKUP_KEY_ID:-}
      MENDPOINT_BACKUP_DATABASE_PATH: ${MENDPOINT_BACKUP_DATABASE_PATH:-mendpoint.sqlite}
      MENDPOINT_BACKUP_GRAPH_PATH: ${MENDPOINT_BACKUP_GRAPH_PATH:-graph-learn.sqlite}
      MENDPOINT_BACKUP_CHANGE_SOURCES_PATH: ${MENDPOINT_BACKUP_CHANGE_SOURCES_PATH:-change-sources.sqlite}
      MENDPOINT_BACKUP_RELEASE_INGESTION_PATH: ${MENDPOINT_BACKUP_RELEASE_INGESTION_PATH:-release-ingestion.sqlite}
      MENDPOINT_BACKUP_REGAUGE_CONTROL_PLANE_PATH: ${MENDPOINT_BACKUP_REGAUGE_CONTROL_PLANE_PATH:-transformer-control-plane.sqlite}
      MENDPOINT_BACKUP_REGAUGE_PILOT_PATH: ${MENDPOINT_BACKUP_REGAUGE_PILOT_PATH:-transformer-pilot.sqlite}
      MENDPOINT_BACKUP_ARTIFACTS_PATH: ${MENDPOINT_BACKUP_ARTIFACTS_PATH:-.}
      MENDPOINT_BACKUP_CONFIGURATION_PATH: ${MENDPOINT_BACKUP_CONFIGURATION_PATH:-recovery-config.json}
      MENDPOINT_BACKUP_WAIT_TIMEOUT_MS: ${MENDPOINT_BACKUP_WAIT_TIMEOUT_MS:-30000}
      MENDPOINT_RESTORE_BACKUP_ROOT: ${MENDPOINT_RESTORE_BACKUP_ROOT:-}
      MENDPOINT_RESTORE_TARGET_ROOT: ${MENDPOINT_RESTORE_TARGET_ROOT:-/restore/mendpoint}
    volumes:
      - mendpoint-data:/app/data
      - mendpoint-runs:/app/runs
      - mendpoint-github:/app/.mendpoint
      - mendpoint-backups:/backup
      - mendpoint-restore:/restore
      - ${MENDPOINT_REPOS_HOST_DIR:-./fixtures/consumers}:/workspace/repos/${MENDPOINT_TENANT_ID:-tenant_default}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      MENDPOINT_DEPLOYMENT_PROFILE: ${MENDPOINT_DEPLOYMENT_PROFILE:-demo}
      MENDPOINT_API_URL: http://api:3001
      MENDPOINT_API_KEY: ${MENDPOINT_API_KEY:-}
      MENDPOINT_WEB_ACCESS_TOKEN: ${MENDPOINT_WEB_ACCESS_TOKEN:?Set MENDPOINT_WEB_ACCESS_TOKEN}
      MENDPOINT_WEB_ALLOWED_ORIGINS: ${MENDPOINT_WEB_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MENDPOINT_WORKER_HEARTBEAT_PATH: /app/data/worker-heartbeat.json
    volumes:
      - mendpoint-data:/app/data:ro
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      MENDPOINT_DEPLOYMENT_PROFILE: ${MENDPOINT_DEPLOYMENT_PROFILE:-demo}
      GITHUB_MODE: ${GITHUB_MODE:?Set GITHUB_MODE to mock or real}
      MENDPOINT_DEPLOYMENT_CLASS: ${MENDPOINT_DEPLOYMENT_CLASS:-customer}
      MENDPOINT_FEED_POLLING_ENABLED: ${MENDPOINT_FEED_POLLING_ENABLED:-0}
      POLL_LOCAL_ONLY: ${POLL_LOCAL_ONLY:-1}
      MENDPOINT_PILOT_SEED: ${MENDPOINT_PILOT_SEED:-0}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_APP_ACCOUNT_TENANT_BINDINGS: ${GITHUB_APP_ACCOUNT_TENANT_BINDINGS:-}
      MENDPOINT_DATA_DIR: /app/data
      MENDPOINT_REPOS_DIR: /workspace/repos
      MENDPOINT_TENANT_ID: ${MENDPOINT_TENANT_ID:-tenant_default}
      MENDPOINT_BACKUP_FENCE_ROOT: ${MENDPOINT_BACKUP_FENCE_ROOT:-/app/data/.backup-fence}
      MENDPOINT_WORKER_HEARTBEAT_PATH: /app/data/worker-heartbeat.json
      # Verification sandbox backend. Defaults to `local` (host execFile) because
      # this compose stack has no Fly infrastructure. To route verification
      # through ephemeral Fly Machines, set these in .env. MENDPOINT_SANDBOX_KIND
      # =fly_machines fails closed without the app + pinned image + token. See
      # docs/SANDBOX_VERIFIER.md.
      MENDPOINT_SANDBOX_KIND: ${MENDPOINT_SANDBOX_KIND:-local}
      MENDPOINT_SANDBOX_FLY_APP: ${MENDPOINT_SANDBOX_FLY_APP:-}
      MENDPOINT_SANDBOX_FLY_IMAGE: ${MENDPOINT_SANDBOX_FLY_IMAGE:-}
      MENDPOINT_SANDBOX_FLY_TOKEN: ${MENDPOINT_SANDBOX_FLY_TOKEN:-}
      MENDPOINT_SANDBOX_EGRESS_ATTESTATION_BASE64: ${MENDPOINT_SANDBOX_EGRESS_ATTESTATION_BASE64:-}
      MENDPOINT_SANDBOX_EGRESS_ATTESTATION_PUBLIC_KEY_SPKI_BASE64: ${MENDPOINT_SANDBOX_EGRESS_ATTESTATION_PUBLIC_KEY_SPKI_BASE64:-}
      MENDPOINT_SANDBOX_EGRESS_ATTESTATION_KEY_ID: ${MENDPOINT_SANDBOX_EGRESS_ATTESTATION_KEY_ID:-}
      MENDPOINT_SANDBOX_EGRESS_POLICY_DIGEST: ${MENDPOINT_SANDBOX_EGRESS_POLICY_DIGEST:-}
      MENDPOINT_SANDBOX_EGRESS_ATTESTATION_MIN_SCHEMA: ${MENDPOINT_SANDBOX_EGRESS_ATTESTATION_MIN_SCHEMA:-}
      POLL_INTERVAL_MS: "5000"
      JOB_LEASE_MS: "900000"
    command: ["node", "--import", "tsx", "apps/worker/src/cli.ts", "run-service", "--interval", "5000"]
    volumes:
      - mendpoint-data:/app/data
      - mendpoint-runs:/app/runs
      - mendpoint-github:/app/.mendpoint
      - ${MENDPOINT_REPOS_HOST_DIR:-./fixtures/consumers}:/workspace/repos/${MENDPOINT_TENANT_ID:-tenant_default}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mendpoint-data:
  mendpoint-runs:
  mendpoint-github:
  mendpoint-backups:
  mendpoint-restore:
