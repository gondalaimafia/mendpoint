name: Production Closure Authority Reactive

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened, assigned, unassigned, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  branch_protection_rule:
    types: [created, edited, deleted]
  schedule:
    # */5 -> */30: event triggers cover the reactive cases; the cron is only drift repair.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

# A pushed-main observation is immutable evidence and cannot share a cancellation
# group with cron or manual sweeps. Reactive events coalesce by the exact PR head
# or tracked issue while the per-PR job lock below preserves publication order.
concurrency:
  group: closure-authority-${{ github.event_name == 'push' && format('push-{0}', github.sha) || (github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review') && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_run' && format('pr-head-{0}', github.event.workflow_run.head_sha) || (github.event_name == 'issues' || github.event_name == 'issue_comment') && format('issue-{0}', github.event.issue.number) || github.event_name == 'branch_protection_rule' && 'branch-protection' || 'sweep' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  discover:
    environment: production-closure-authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      main_sha: ${{ steps.state.outputs.main_sha }}
      pull_requests: ${{ steps.state.outputs.pull_requests }}
      observation_scope: ${{ steps.state.outputs.observation_scope }}
      provider_validation_issues: ${{ steps.state.outputs.provider_validation_issues }}
    steps:
      - name: Create dedicated authority App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MENDPOINT_CLOSURE_GITHUB_APP_ID }}
          private-key: ${{ secrets.MENDPOINT_CLOSURE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Discover the current protected release set
        id: state
        shell: bash
        run: |
          set -euo pipefail
          # Cheap early guard (1 call): if the installation budget is nearly gone, fail with a
          # named cause instead of a cryptic mid-call rate-limit error. This must still FAIL (red):
          # an unevaluated authority must never read as evaluated.
          remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
          if [ "${remaining:-0}" -lt 200 ]; then
            echo "::error::closure-authority skipped: installation API budget exhausted (${remaining} remaining)"
            exit 1
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          list_open_pull_requests() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
              --jq '.[].number' | jq --compact-output --slurp 'unique | sort'
          }
          issue_is_tracked() {
            gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/docs/PRODUCTION_CLOSURE_MATRIX.json?ref=${main_sha}" \
              | jq -e --argjson number "$1" \
                'any(.issueAuthority.issues[]?; .number == $number)' > /dev/null
          }

          observation_scope=full_release_train
          provider_validation_issues='[]'
          case "$GITHUB_EVENT_NAME" in
            pull_request_target|pull_request_review)
              observation_scope=current_pull_request
              if [ "$EVENT_PR_BASE_REF" = main ]; then
                pull_requests="$(jq --compact-output --null-input --argjson number "$EVENT_PR_NUMBER" '[$number]')"
              else
                pull_requests='[]'
              fi
              ;;
            workflow_run)
              observation_scope=current_pull_request
              if jq -e \
                '.workflow_run.path == ".github/workflows/ci.yml" and .workflow_run.event == "pull_request" and .workflow_run.status == "completed"' \
                "$GITHUB_EVENT_PATH" > /dev/null; then
                workflow_head="$(jq -er '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
                pull_requests="$(jq --compact-output --arg head "$workflow_head" \
                  '[.workflow_run.pull_requests[]? | select(.base.ref == "main" and .head.sha == $head) | .number] | unique | sort' \
                  "$GITHUB_EVENT_PATH")"
                if [ "$pull_requests" = '[]' ]; then
                  pull_requests="$(gh api --paginate \
                    "repos/${GITHUB_REPOSITORY}/commits/${workflow_head}/pulls?per_page=100" \
                    | jq --raw-output --arg head "$workflow_head" \
                      '.[] | select(.state == "open" and .base.ref == "main" and .head.sha == $head) | .number' \
                    | jq --compact-output --slurp 'unique | sort')"
                fi
              else
                pull_requests='[]'
              fi
              ;;
            issues|issue_comment)
              issue_number="$(jq -er '.issue.number' "$GITHUB_EVENT_PATH")"
              if [ "$GITHUB_EVENT_NAME" = issue_comment ] && \
                jq -e '.issue.pull_request != null' "$GITHUB_EVENT_PATH" > /dev/null; then
                pull_requests='[]'
              elif issue_is_tracked "$issue_number"; then
                pull_requests="$(list_open_pull_requests)"
                provider_validation_issues="$(jq --compact-output --null-input --argjson number "$issue_number" '[$number]')"
              else
                pull_requests='[]'
              fi
              ;;
            *)
              pull_requests="$(list_open_pull_requests)"
              ;;
          esac
          echo "main_sha=${main_sha}" >> "$GITHUB_OUTPUT"
          echo "pull_requests=${pull_requests}" >> "$GITHUB_OUTPUT"
          echo "observation_scope=${observation_scope}" >> "$GITHUB_OUTPUT"
          echo "provider_validation_issues=${provider_validation_issues}" >> "$GITHUB_OUTPUT"
        env:
          # Reads ride the closure App pool (5,000/hr) so a sweep cannot starve the
          # 1,000/hr Actions GITHUB_TOKEN pool. This job performs only reads.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}

  invalidate-authority:
    environment: production-closure-authority
    needs: discover
    if: needs.discover.outputs.pull_requests != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pull_request: ${{ fromJSON(needs.discover.outputs.pull_requests) }}
    concurrency:
      # Invalidation and evaluation share one generation lock. A newer run cannot
      # invalidate this PR while an older run is verifying or publishing.
      group: production-closure-authority-${{ matrix.pull_request }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create dedicated authority App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MENDPOINT_CLOSURE_GITHUB_APP_ID }}
          private-key: ${{ secrets.MENDPOINT_CLOSURE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Read the pull request head sha
        id: head
        shell: bash
        run: |
          set -euo pipefail
          echo "head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')" >> "$GITHUB_OUTPUT"
        env:
          # Read rides the closure App pool (5,000/hr) so a sweep cannot starve the
          # 1,000/hr Actions GITHUB_TOKEN pool.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ matrix.pull_request }}
      - name: Invalidate controller authority before protected credentials
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context=mendpoint-production-closure-controller-reactive \
            -f description="Protected closure authority is being reevaluated" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          # Write keeps its pinned controller identity (app id 15368) on GITHUB_TOKEN;
          # switching this token would break the branch-protection binding. Do not change.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.head.outputs.head_sha }}

  closure-authority:
    needs: [discover, invalidate-authority]
    if: needs.discover.outputs.pull_requests != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pull_request: ${{ fromJSON(needs.discover.outputs.pull_requests) }}
    concurrency:
      group: production-closure-authority-${{ matrix.pull_request }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production-closure-authority
    timeout-minutes: 15
    steps:
      - name: Read exact live pull request identity
        id: pull-request
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pull-request.json"
          echo "head_sha=$(jq --raw-output '.head.sha' "$RUNNER_TEMP/pull-request.json")" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq --raw-output '.head.ref' "$RUNNER_TEMP/pull-request.json")" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq --raw-output '.base.sha' "$RUNNER_TEMP/pull-request.json")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq --raw-output '.base.ref' "$RUNNER_TEMP/pull-request.json")" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ matrix.pull_request }}
      - name: Create dedicated authority App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MENDPOINT_CLOSURE_GITHUB_APP_ID }}
          private-key: ${{ secrets.MENDPOINT_CLOSURE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Invalidate prior external authority result
        id: external-check
        shell: bash
        run: |
          set -euo pipefail
          check_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="$CHECK_NAME" \
            -f head_sha="$PR_HEAD_SHA" \
            -f status=in_progress \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '.id')"
          echo "check_id=${check_id}" >> "$GITHUB_OUTPUT"
          echo "check_name=${CHECK_NAME}" >> "$GITHUB_OUTPUT"
        env:
          CHECK_NAME: mendpoint-production-closure-authority-reactive
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
      - name: Checkout exact immutable main authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.discover.outputs.main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install immutable authority dependencies
        run: npm ci
      - name: Validate exact proposal bytes with immutable authority
        id: proposal
        continue-on-error: true
        run: npm run closure:proposal:check
        env:
          # closure:proposal:check performs only reads (git trees/blobs/commits/compare),
          # so it rides the closure App pool (5,000/hr) instead of the 1,000/hr GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MENDPOINT_AUTHORITY_BASE_SHA: ${{ needs.discover.outputs.main_sha }}
          MENDPOINT_PROPOSAL_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          MENDPOINT_PROPOSAL_OBSERVATION_PATH: ${{ runner.temp }}/production-closure-proposal-authority.json
      - name: Verify dedicated authority App identity
        id: app-identity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          expected_app_id="$(gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/config/production-closure-authority.json?ref=${PR_HEAD_SHA}" \
            | jq -er '.externalCheckAppId | select(type == "number" and . > 0)')"
          observed_app_id="$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_ID}" --jq '.app.id')"
          test "$observed_app_id" = "$expected_app_id"
        env:
          CHECK_ID: ${{ steps.external-check.outputs.check_id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
      - name: Verify live protected branch authority bindings
        id: branch-protection
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/config/production-closure-authority.json?ref=${PR_HEAD_SHA}" \
            > "$RUNNER_TEMP/proposed-closure-authority-policy.json"
          external_name="$(jq -er '.externalCheckName' "$RUNNER_TEMP/proposed-closure-authority-policy.json")"
          external_app_id="$(jq -er '.externalCheckAppId | select(type == "number" and . > 0)' "$RUNNER_TEMP/proposed-closure-authority-policy.json")"
          controller_name="$(jq -er '.controllerCheckName' "$RUNNER_TEMP/proposed-closure-authority-policy.json")"
          controller_app_id="$(jq -er '.controllerCheckAppId | select(type == "number" and . > 0)' "$RUNNER_TEMP/proposed-closure-authority-policy.json")"
          test "$(jq -er '.protectionMode' "$RUNNER_TEMP/proposed-closure-authority-policy.json")" = classic_branch
          branch="$(jq -er '.protectionBranch' "$RUNNER_TEMP/proposed-closure-authority-policy.json")"
          gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}/protection/required_status_checks" \
            > "$RUNNER_TEMP/required-status-checks.json"
          jq -e '.strict == true' "$RUNNER_TEMP/required-status-checks.json"
          jq -e --arg context "$external_name" --argjson app_id "$external_app_id" \
            '[.checks[] | select(.context == $context and .app_id == $app_id)] | length == 1' \
            "$RUNNER_TEMP/required-status-checks.json"
          jq -e --arg context "$controller_name" --argjson app_id "$controller_app_id" \
            '[.checks[] | select(.context == $context and .app_id == $app_id)] | length == 1' \
            "$RUNNER_TEMP/required-status-checks.json"
          rotation_kind="$(gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/docs/PRODUCTION_CLOSURE_MATRIX.json?ref=${PR_HEAD_SHA}" \
            | jq -r '.releaseTrain.currentPullRequestBootstrap.authorityRotation.kind // "runtime"')"
          if [ "$rotation_kind" = activate_successor ]; then
            predecessor_external_name="$(jq -er '.externalCheckName' config/production-closure-authority.json)"
            predecessor_external_app_id="$(jq -er '.externalCheckAppId | select(type == "number" and . > 0)' config/production-closure-authority.json)"
            predecessor_controller_name="$(jq -er '.controllerCheckName' config/production-closure-authority.json)"
            predecessor_controller_app_id="$(jq -er '.controllerCheckAppId | select(type == "number" and . > 0)' config/production-closure-authority.json)"
            jq -e --arg context "$predecessor_external_name" --argjson app_id "$predecessor_external_app_id" \
              '[.checks[] | select(.context == $context and .app_id == $app_id)] | length == 1' \
              "$RUNNER_TEMP/required-status-checks.json"
            jq -e --arg context "$predecessor_controller_name" --argjson app_id "$predecessor_controller_app_id" \
              '[.checks[] | select(.context == $context and .app_id == $app_id)] | length == 1' \
              "$RUNNER_TEMP/required-status-checks.json"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
      - name: Read proposed matrix as exact immutable data
        id: matrix
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/docs/PRODUCTION_CLOSURE_MATRIX.json?ref=${PR_HEAD_SHA}" \
            > "$RUNNER_TEMP/proposed-production-closure-matrix.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
      - name: Wait for declared successor activation result
        id: successor-readiness
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          matrix="$RUNNER_TEMP/proposed-production-closure-matrix.json"
          if [ "$(jq -r '.releaseTrain.currentPullRequestBootstrap.authorityRotation.kind // "runtime"' "$matrix")" != activate_successor ]; then
            exit 0
          fi
          successor_name="$(jq -er '.releaseTrain.currentPullRequestBootstrap.authorityRotation.successor.externalCheckName' "$matrix")"
          if [ "$successor_name" = "$CURRENT_CHECK_NAME" ]; then
            # This is the declared successor. Its exact authenticated in-progress
            # run is verified by closure:github:check and must not wait on itself.
            exit 0
          fi
          successor_app_id="$(jq -er '.releaseTrain.currentPullRequestBootstrap.authorityRotation.successor.externalCheckAppId' "$matrix")"
          controller_name="$(jq -er '.releaseTrain.currentPullRequestBootstrap.authorityRotation.successor.controllerCheckName' "$matrix")"
          controller_login="$(jq -er '.releaseTrain.currentPullRequestBootstrap.authorityRotation.successor.controllerStatusCreatorLogin' "$matrix")"
          controller_user_id="$(jq -er '.releaseTrain.currentPullRequestBootstrap.authorityRotation.successor.controllerStatusCreatorUserId' "$matrix")"
          for attempt in $(seq 1 24); do
            check_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?filter=latest&per_page=100" \
              | jq --raw-output --arg name "$successor_name" --argjson app_id "$successor_app_id" \
                '[.check_runs[] | select(.name == $name and .app.id == $app_id)] | sort_by(.id) | last | select(.status == "completed" and .conclusion == "success") | .details_url // empty' \
              | sed -nE 's#^.*/actions/runs/([0-9]+)(/.*)?$#\1#p')"
            status_run_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/statuses?per_page=100" \
              | jq --raw-output --slurp --arg context "$controller_name" --arg login "$controller_login" --argjson user_id "$controller_user_id" \
                'map(.[]) | map(select(.context == $context and .state == "success" and (.creator.login | ascii_downcase) == ($login | ascii_downcase) and .creator.id == $user_id)) | sort_by(.id) | last | .target_url // empty' \
              | sed -nE 's#^.*/actions/runs/([0-9]+)(/.*)?$#\1#p')"
            if [ -n "$check_run_id" ] && [ "$check_run_id" = "$status_run_id" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 24 ]; then sleep 5; fi
          done
          echo "::error::declared successor did not publish one exact successful App/controller run within 120 seconds"
          exit 1
        env:
          CURRENT_CHECK_NAME: ${{ steps.external-check.outputs.check_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
      - name: Verify live GitHub release authority
        id: github
        continue-on-error: true
        run: npm run closure:github:check
        env:
          # closure:github:check performs only reads (git ref, pulls, check-runs, workflow
          # runs, jobs, issues), so it rides the closure App pool (5,000/hr) not GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MENDPOINT_CLOSURE_AUTHORITY_SHA: ${{ needs.discover.outputs.main_sha }}
          MENDPOINT_CLOSURE_EVENT_NAME: pull_request
          MENDPOINT_CLOSURE_MATRIX_PATH: ${{ runner.temp }}/proposed-production-closure-matrix.json
          MENDPOINT_CLOSURE_OBSERVATION_PATH: ${{ runner.temp }}/production-closure-github-authority.json
          MENDPOINT_CLOSURE_OBSERVATION_SCOPE: ${{ needs.discover.outputs.observation_scope }}
          MENDPOINT_CLOSURE_PROVIDER_VALIDATION_ISSUES: ${{ needs.discover.outputs.provider_validation_issues }}
          MENDPOINT_CLOSURE_PR_NUMBER: ${{ matrix.pull_request }}
          MENDPOINT_CLOSURE_PR_BASE_REF: ${{ steps.pull-request.outputs.base_ref }}
          MENDPOINT_CLOSURE_PR_BASE_SHA: ${{ steps.pull-request.outputs.base_sha }}
          MENDPOINT_CLOSURE_PR_HEAD_REF: ${{ steps.pull-request.outputs.head_ref }}
          MENDPOINT_CLOSURE_PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
      - name: Upload secret-free authority evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: production-closure-authority-${{ matrix.pull_request }}
          path: |
            ${{ runner.temp }}/production-closure-proposal-authority.json
            ${{ runner.temp }}/production-closure-github-authority.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify publication generation ownership
        id: publication-generation
        if: always() && steps.external-check.outputs.check_id != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$live_head" = "$PR_HEAD_SHA"

          expected_path="$(jq -er '.workflowPath' "$RUNNER_TEMP/proposed-closure-authority-policy.json")"
          expected_app_id="$(jq -er '.externalCheckAppId | select(type == "number" and . > 0)' "$RUNNER_TEMP/proposed-closure-authority-policy.json")"
          expected_controller="$(jq -er '.controllerCheckName' "$RUNNER_TEMP/proposed-closure-authority-policy.json")"

          gh api "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_ID}" > "$RUNNER_TEMP/publication-check.json"
          jq -e \
            --argjson check_id "$CHECK_ID" \
            --arg name "$CHECK_NAME" \
            --arg head "$PR_HEAD_SHA" \
            --argjson app_id "$expected_app_id" \
            --arg run_url "$run_url" \
            '.id == $check_id and .name == $name and .head_sha == $head and .app.id == $app_id and .status == "in_progress" and .conclusion == null and .details_url == $run_url' \
            "$RUNNER_TEMP/publication-check.json"

          latest_check_id="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?filter=latest&per_page=100" \
            | jq -er --arg name "$CHECK_NAME" --argjson app_id "$expected_app_id" \
              '[.check_runs[] | select(.name == $name and .app.id == $app_id)] | sort_by(.id) | last | .id')"
          test "$latest_check_id" = "$CHECK_ID"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/statuses?per_page=100" \
            | jq --slurp --arg context "$expected_controller" --arg login "$CONTROLLER_CREATOR_LOGIN" --argjson user_id "$CONTROLLER_CREATOR_USER_ID" \
              'map(.[]) | map(select(.context == $context and (.creator.login | ascii_downcase) == ($login | ascii_downcase) and .creator.id == $user_id)) | sort_by(.id) | last' \
            > "$RUNNER_TEMP/publication-controller-status.json"
          jq -e --arg run_url "$run_url" \
            '.state == "pending" and .target_url == $run_url' \
            "$RUNNER_TEMP/publication-controller-status.json"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "$RUNNER_TEMP/publication-workflow-run.json"
          jq -e \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg path "$expected_path" \
            --arg event "$GITHUB_EVENT_NAME" \
            '.id == $run_id and (.path | split("@")[0]) == $path and .event == $event and .status == "in_progress" and .conclusion == null' \
            "$RUNNER_TEMP/publication-workflow-run.json"
        env:
          CHECK_ID: ${{ steps.external-check.outputs.check_id }}
          CHECK_NAME: ${{ steps.external-check.outputs.check_name }}
          CONTROLLER_CREATOR_LOGIN: github-actions[bot]
          CONTROLLER_CREATOR_USER_ID: 41898282
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          PR_NUMBER: ${{ matrix.pull_request }}
      - name: Close superseded dedicated authority App check
        if: always() && steps.external-check.outputs.check_id != '' && steps.publication-generation.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_ID}" \
            -f status=completed \
            -f conclusion=failure \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          CHECK_ID: ${{ steps.external-check.outputs.check_id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Publish dedicated authority App verdict
        id: publish-external
        if: always() && steps.external-check.outputs.check_id != '' && steps.publication-generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          conclusion=failure
          if [ "$APP_IDENTITY_OUTCOME" = success ] && [ "$BRANCH_PROTECTION_OUTCOME" = success ] && [ "$PROPOSAL_OUTCOME" = success ] && [ "$MATRIX_OUTCOME" = success ] && [ "$SUCCESSOR_READINESS_OUTCOME" = success ] && [ "$GITHUB_OUTCOME" = success ]; then
            conclusion=success
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_ID}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          CHECK_ID: ${{ steps.external-check.outputs.check_id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_IDENTITY_OUTCOME: ${{ steps.app-identity.outcome }}
          BRANCH_PROTECTION_OUTCOME: ${{ steps.branch-protection.outcome }}
          GITHUB_OUTCOME: ${{ steps.github.outcome }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
          PROPOSAL_OUTCOME: ${{ steps.proposal.outcome }}
          SUCCESSOR_READINESS_OUTCOME: ${{ steps.successor-readiness.outcome }}
      - name: Publish controller authority verdict
        id: publish-controller
        if: always() && steps.publication-generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          if [ "$APP_IDENTITY_OUTCOME" = success ] && [ "$BRANCH_PROTECTION_OUTCOME" = success ] && [ "$PROPOSAL_OUTCOME" = success ] && [ "$MATRIX_OUTCOME" = success ] && [ "$SUCCESSOR_READINESS_OUTCOME" = success ] && [ "$GITHUB_OUTCOME" = success ]; then
            state=success
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            -f state="$state" \
            -f context=mendpoint-production-closure-controller-reactive \
            -f description="Protected closure authority verdict" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          APP_IDENTITY_OUTCOME: ${{ steps.app-identity.outcome }}
          BRANCH_PROTECTION_OUTCOME: ${{ steps.branch-protection.outcome }}
          # Controller status write keeps its pinned identity (app id 15368) on GITHUB_TOKEN;
          # switching this token would break the branch-protection binding. Do not change.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OUTCOME: ${{ steps.github.outcome }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
          PROPOSAL_OUTCOME: ${{ steps.proposal.outcome }}
          SUCCESSOR_READINESS_OUTCOME: ${{ steps.successor-readiness.outcome }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
      - name: Enforce protected authority verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # The two publish steps above are what record the per-PR verdict onto the
          # pull request's own check-run (dedicated App) and commit status (controller).
          # If either did not run to success the verdict was NOT recorded, and a
          # missing verdict must never read as success in any event type.
          if [ "$PUBLISH_EXTERNAL_OUTCOME" != success ] || [ "$PUBLISH_CONTROLLER_OUTCOME" != success ]; then
            echo "::error::closure-authority could not record the verdict for PR #${PR_NUMBER} (external publish: ${PUBLISH_EXTERNAL_OUTCOME}, controller publish: ${PUBLISH_CONTROLLER_OUTCOME})"
            exit 1
          fi
          # The verdict was recorded on the PR check-run. Recompute the recorded
          # conclusion from the same gate outcomes the publish steps used.
          conclusion=failure
          if [ "$APP_IDENTITY_OUTCOME" = success ] && [ "$BRANCH_PROTECTION_OUTCOME" = success ] && [ "$PROPOSAL_OUTCOME" = success ] && [ "$MATRIX_OUTCOME" = success ] && [ "$SUCCESSOR_READINESS_OUTCOME" = success ] && [ "$GITHUB_OUTCOME" = success ]; then
            conclusion=success
          fi
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::notice::closure-authority verdict for PR #${PR_NUMBER} is ${conclusion}; recorded on the PR check-run (sweep (push/schedule) does not fail the run for per-PR verdicts)"
            exit 0
          fi
          # Every non-schedule event keeps the original hard-fail behavior: the run
          # is red unless the recorded verdict is a pass.
          if [ "$conclusion" != success ]; then
            echo "::error::closure-authority verdict for PR #${PR_NUMBER} is ${conclusion}"
            exit 1
          fi
        env:
          APP_IDENTITY_OUTCOME: ${{ steps.app-identity.outcome }}
          BRANCH_PROTECTION_OUTCOME: ${{ steps.branch-protection.outcome }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_OUTCOME: ${{ steps.github.outcome }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
          PR_NUMBER: ${{ matrix.pull_request }}
          PROPOSAL_OUTCOME: ${{ steps.proposal.outcome }}
          PUBLISH_CONTROLLER_OUTCOME: ${{ steps.publish-controller.outcome }}
          PUBLISH_EXTERNAL_OUTCOME: ${{ steps.publish-external.outcome }}
          SUCCESSOR_READINESS_OUTCOME: ${{ steps.successor-readiness.outcome }}

  main-authority-observation:
    environment: production-closure-authority
    needs: discover
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create dedicated authority App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MENDPOINT_CLOSURE_GITHUB_APP_ID }}
          private-key: ${{ secrets.MENDPOINT_CLOSURE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Checkout exact pushed main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install immutable authority dependencies
        run: npm ci
      - name: Verify merged main authority
        run: npm run closure:github:check
        env:
          # closure:github:check performs only reads, so it rides the closure App pool
          # (5,000/hr) instead of the 1,000/hr Actions GITHUB_TOKEN pool.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MENDPOINT_CLOSURE_AUTHORITY_SHA: ${{ github.sha }}
          MENDPOINT_CLOSURE_EVENT_NAME: push
          MENDPOINT_CLOSURE_OBSERVATION_PATH: ${{ runner.temp }}/production-closure-main-authority.json
      - name: Upload secret-free merged authority evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: production-closure-main-authority-${{ github.sha }}
          path: ${{ runner.temp }}/production-closure-main-authority.json
          if-no-files-found: warn
          retention-days: 30
