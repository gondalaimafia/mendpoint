name: Graphify process smoke

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/graphify-process-smoke.yml"
      - "package-lock.json"
      - "package.json"
      - "packages/structural-graph/**"
      - "scripts/graphify-process-smoke.ts"
  workflow_dispatch: {}

jobs:
  isolated-process-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install pinned Graphify evaluator
        shell: bash
        run: |
          python -m venv .graphify-venv
          .graphify-venv/bin/python -m pip install --disable-pip-version-check --requirement packages/structural-graph/python/requirements.lock
          test "$(.graphify-venv/bin/python -c 'import importlib.metadata; print(importlib.metadata.version("graphifyy"))')" = "0.9.46"
      - name: Run namespace isolated process smoke
        run: npm run graphify:process:smoke
        env:
          GRAPHIFY_PYTHON: ${{ github.workspace }}/.graphify-venv/bin/python
          GRAPHIFY_SMOKE_OUTPUT: ${{ runner.temp }}/graphify-process-smoke.json
      - name: Upload process evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: graphify-process-smoke
          path: ${{ runner.temp }}/graphify-process-smoke.json
          if-no-files-found: error
          retention-days: 30
