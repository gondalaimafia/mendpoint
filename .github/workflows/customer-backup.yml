name: Customer production backup

permissions:
  contents: read

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: customer-production-backup
  cancel-in-progress: false

jobs:
  # The backup runs ON the customer machine and its producer fail-closed-refuses
  # unless MENDPOINT_DEPLOYMENT_PROFILE == "customer" (customer_backup_profile_required).
  # The repository variable records operator intent. The live app profile is read
  # through the app-scoped Fly authority on every run; the two must agree. A deliberate
  # non-customer state is retained as NOT CONFIGURED, never as backup success. Drift or
  # an indeterminate live profile fails closed.
  profile-gate:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: customer-production-backup
    outputs:
      active: ${{ steps.check.outputs.active }}
      result: ${{ steps.check.outputs.result }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Initialize backup preflight evidence
        shell: bash
        env:
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          mkdir -p test-results/customer-backup-preflight
          evidence="test-results/customer-backup-preflight/preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          jq -n \
            --arg app "$CUSTOMER_APP" \
            --arg workflowRevision "$GITHUB_SHA" \
            --arg liveReleaseRevision "unknown" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg result "authority_unavailable" \
            --arg reason "preflight_not_completed" \
            --argjson backupTaken false \
            --argjson operatorActionRequired true \
            --argjson releaseRevisionMatchesWorkflow false \
            '{schemaVersion:1,kind:"customer_backup_preflight",app:$app,workflowRevision:$workflowRevision,liveReleaseRevision:$liveReleaseRevision,releaseRevisionMatchesWorkflow:$releaseRevisionMatchesWorkflow,runId:$runId,runAttempt:$runAttempt,observedAt:$observedAt,result:$result,reason:$reason,backupTaken:$backupTaken,operatorActionRequired:$operatorActionRequired}' \
            > "$evidence"

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Inspect live customer profile authority
        id: check
        shell: bash
        env:
          EXPECTED_ACTIVE: ${{ vars.MENDPOINT_CUSTOMER_PROFILE_ACTIVE }}
          FLY_API_TOKEN: ${{ secrets.MENDPOINT_CUSTOMER_BACKUP_FLY_TOKEN }}
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
          RELEASE_MAP: ${{ vars.MENDPOINT_CUSTOMER_BACKUP_RELEASE_MAP }}
        run: |
          set -euo pipefail

          evidence="test-results/customer-backup-preflight/preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          active=false
          result="authority_unavailable"
          reason="preflight_not_completed"
          live_profile="unknown"
          live_release_revision="unknown"
          release_revision_matches_workflow=false
          expected_active=null
          operator_action_required=true

          write_evidence_and_exit() {
            status=$?
            trap - EXIT
            jq -n \
              --arg app "$CUSTOMER_APP" \
              --arg workflowRevision "$GITHUB_SHA" \
              --arg liveReleaseRevision "$live_release_revision" \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg result "$result" \
              --arg reason "$reason" \
              --arg liveProfile "$live_profile" \
              --argjson expectedCustomerProfile "$expected_active" \
              --argjson releaseRevisionMatchesWorkflow "$release_revision_matches_workflow" \
              --argjson backupTaken false \
              --argjson operatorActionRequired "$operator_action_required" \
              '{schemaVersion:1,kind:"customer_backup_preflight",app:$app,workflowRevision:$workflowRevision,liveReleaseRevision:$liveReleaseRevision,releaseRevisionMatchesWorkflow:$releaseRevisionMatchesWorkflow,runId:$runId,runAttempt:$runAttempt,observedAt:$observedAt,result:$result,reason:$reason,liveProfile:$liveProfile,expectedCustomerProfile:$expectedCustomerProfile,backupTaken:$backupTaken,operatorActionRequired:$operatorActionRequired}' \
              > "$evidence"
            echo "active=$active" >> "$GITHUB_OUTPUT"
            echo "result=$result" >> "$GITHUB_OUTPUT"
            echo "release=$live_release_revision" >> "$GITHUB_OUTPUT"
            printf '### Customer production backup\n\nResult: `%s`  \nLive profile: `%s`  \nWorkflow revision: `%s`  \nLive release revision: `%s`  \nBackup taken: `false`\n' \
              "$result" "$live_profile" "$GITHUB_SHA" "$live_release_revision" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          }
          trap write_evidence_and_exit EXIT

          case "$EXPECTED_ACTIVE" in
            true) expected_active=true ;;
            false) expected_active=false ;;
            "")
              result="authority_invalid"
              reason="customer_profile_intent_missing"
              echo customer_profile_intent_missing >&2
              exit 1
              ;;
            *)
              result="authority_invalid"
              reason="customer_profile_intent_invalid"
              echo customer_backup_profile_intent_invalid >&2
              exit 1
              ;;
          esac

          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            result="authority_invalid"
            reason="customer_backup_workflow_revision_invalid"
            echo customer_backup_workflow_revision_invalid >&2
            exit 1
          }

          test -n "$FLY_API_TOKEN" || {
            reason="customer_backup_fly_token_missing"
            echo customer_backup_fly_token_missing >&2
            exit 1
          }
          [[ "$CUSTOMER_APP" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || {
            reason="customer_backup_app_binding_invalid"
            echo customer_backup_app_binding_invalid >&2
            exit 1
          }
          reason="customer_backup_live_runtime_unavailable"
          app_status_json="$(flyctl status --app "$CUSTOMER_APP" --json)"
          app_id="$(jq -er '(.ID // .id // .App.ID // .app.id) | tostring | select(test("^[1-9][0-9]*$"))' <<< "$app_status_json")" || {
            echo customer_backup_app_id_unavailable >&2
            exit 1
          }
          reason="customer_backup_token_scope_unavailable"
          token_debug_json="$(flyctl tokens debug)" || {
            echo customer_backup_token_scope_unavailable >&2
            exit 1
          }
          if ! TOKEN_DEBUG_JSON="$token_debug_json" EXPECTED_APP_ID="$app_id" node -e '
            const decoded = JSON.parse(process.env.TOKEN_DEBUG_JSON ?? "null");
            const permissions = Array.isArray(decoded)
              ? decoded.filter((token) => /api\.fly\.io/.test(token?.location ?? "")) : [];
            const valid = permissions.length > 0 && permissions.every((token) => {
              const apps = (token.caveats ?? []).filter((caveat) =>
                String(caveat.type ?? caveat.name ?? caveat.kind ?? "").toLowerCase() === "apps"
              ).map((caveat) => caveat.value ?? caveat.values ?? caveat.args ?? caveat.apps ?? []);
              return apps.length === 1 && Array.isArray(apps[0]) && apps[0].length === 1 &&
                String(apps[0][0]) === process.env.EXPECTED_APP_ID && /^[1-9][0-9]*$/.test(String(apps[0][0]));
            });
            process.exit(valid ? 0 : 1);
          ' >/dev/null 2>&1; then
            reason="customer_backup_token_not_app_scoped"
            echo customer_backup_token_not_app_scoped >&2
            exit 1
          fi
          unset token_debug_json
          reason="customer_backup_live_runtime_unavailable"
          runtime_json="$(flyctl ssh console --app "$CUSTOMER_APP" --pty=false \
            --command "node -e 'process.stdout.write(JSON.stringify({deploymentProfile:process.env.MENDPOINT_DEPLOYMENT_PROFILE ?? null,releaseRevision:process.env.MENDPOINT_RELEASE_REVISION ?? null}))'")"
          reason="customer_backup_live_runtime_invalid"
          parsed_live_profile="$(jq -er '.deploymentProfile | strings' <<< "$runtime_json")" || {
            echo customer_backup_live_runtime_invalid >&2
            exit 1
          }
          live_profile="$parsed_live_profile"
          parsed_live_release_revision="$(jq -er '.releaseRevision | strings | select(test("^([a-f0-9]{40}|[a-f0-9]{64})$"))' <<< "$runtime_json")" || {
            echo customer_backup_live_runtime_invalid >&2
            exit 1
          }
          live_release_revision="$parsed_live_release_revision"
          expected_release="$GITHUB_SHA"
          if [ "${#live_release_revision}" -eq 64 ]; then
            expected_release="$(RELEASE_MAP_JSON="${RELEASE_MAP:-}" SOURCE_REVISION="$GITHUB_SHA" node -e '
              const map = JSON.parse(process.env.RELEASE_MAP_JSON ?? "null");
              const value = map?.[process.env.SOURCE_REVISION ?? ""];
              if (typeof value !== "string" || !/^[a-f0-9]{64}$/.test(value)) process.exit(1);
              process.stdout.write(value);
            ' 2>/dev/null)" || {
              result="operator_action_required"
              reason="customer_backup_release_mapping_missing"
              echo customer_backup_release_mapping_missing >&2
              exit 1
            }
          fi
          if [ "$live_release_revision" = "$expected_release" ]; then
            release_revision_matches_workflow=true
          fi
          case "$live_profile" in
            customer|demo|pilot) ;;
            *)
              result="authority_invalid"
              reason="customer_backup_live_profile_invalid"
              echo customer_backup_live_profile_invalid >&2
              exit 1
              ;;
          esac

          if [ "$expected_active" = "true" ] && [ "$live_profile" = "customer" ]; then
            if [ "$live_release_revision" != "$expected_release" ]; then
              result="operator_action_required"
              reason="customer_backup_release_revision_mismatch"
              echo customer_backup_release_revision_mismatch >&2
              exit 1
            fi
            active=true
            result="eligible"
            reason="live_customer_profile_verified"
            operator_action_required=false
            echo "Customer profile authority verified. Backup will run."
          elif [ "$expected_active" = "false" ] && [ "$live_profile" != "customer" ]; then
            result="not_configured"
            reason="customer_profile_inactive"
            operator_action_required=false
            echo "::notice title=Customer backup not configured::The live app profile is $live_profile and operator intent is inactive. No backup was taken."
          else
            result="operator_action_required"
            reason="customer_backup_profile_authority_mismatch"
            echo customer_backup_profile_authority_mismatch >&2
            exit 1
          fi

      - name: Retain backup preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: customer-production-backup-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/customer-backup-preflight/
          if-no-files-found: error
          retention-days: 90

  backup:
    needs: profile-gate
    if: ${{ needs.profile-gate.outputs.active == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    # The app's authenticated object-store operation is bounded at four hours.
    # Keep the runner alive through that fail-closed timeout so it does not sever
    # the SSH session while the remote process still owns the backup fence.
    timeout-minutes: 270
    environment: customer-production-backup
    permissions:
      contents: read
    steps:
      - name: Check out verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Initialize backup evidence
        shell: bash
        env:
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          mkdir -p test-results/customer-backup
          evidence="test-results/customer-backup/backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          printf 'run=%s attempt=%s app=%s workflow_revision=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CUSTOMER_APP" "$GITHUB_SHA" > "$evidence"

      - name: Validate app-scoped backup authority
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.MENDPOINT_CUSTOMER_BACKUP_FLY_TOKEN }}
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo customer_backup_fly_token_missing >&2; exit 1; }
          [[ "$CUSTOMER_APP" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || {
            echo customer_backup_app_binding_invalid >&2
            exit 1
          }
          app_status_json="$(flyctl status --app "$CUSTOMER_APP" --json)"
          app_id="$(jq -er '(.ID // .id // .App.ID // .app.id) | tostring | select(test("^[1-9][0-9]*$"))' <<< "$app_status_json")"
          token_debug_json="$(flyctl tokens debug)" || { echo customer_backup_token_debug_invalid >&2; exit 1; }
          if ! TOKEN_DEBUG_JSON="$token_debug_json" EXPECTED_APP_ID="$app_id" node -e 'const decoded=JSON.parse(process.env.TOKEN_DEBUG_JSON??"null");const permissions=Array.isArray(decoded)?decoded.filter((token)=>/api\.fly\.io/.test(token?.location??"")):[];const valid=permissions.length>0&&permissions.every((token)=>{const apps=(token.caveats??[]).filter((caveat)=>String(caveat.type??caveat.name??caveat.kind??"").toLowerCase()==="apps").map((caveat)=>caveat.value??caveat.values??caveat.args??caveat.apps??[]);return apps.length===1&&Array.isArray(apps[0])&&apps[0].length===1&&String(apps[0][0])===process.env.EXPECTED_APP_ID&&/^[1-9][0-9]*$/.test(String(apps[0][0]));});process.exit(valid?0:1)' >/dev/null 2>&1; then
            echo customer_backup_token_not_app_scoped >&2
            exit 1
          fi
          unset token_debug_json

      - name: Run authenticated customer backup
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.MENDPOINT_CUSTOMER_BACKUP_FLY_TOKEN }}
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
          EXPECTED_RELEASE: ${{ needs.profile-gate.outputs.release }}
        run: |
          set -euo pipefail
          evidence="test-results/customer-backup/backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          flyctl ssh console --app "$CUSTOMER_APP" --pty=false \
            --command "node --import tsx scripts/customer-backup.ts --expected-release $EXPECTED_RELEASE" 2>&1 | tee -a "$evidence"
          bash scripts/verify-customer-backup-result.sh "$evidence" "$EXPECTED_RELEASE" >/dev/null
          printf 'result=success backupTaken=true\n' >> "$evidence"

      - name: Retain backup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: customer-production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/customer-backup/
          if-no-files-found: error
          retention-days: 90

  backup-incident:
    needs: [profile-gate, backup]
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Reconcile customer backup incident
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROFILE_JOB_RESULT: ${{ needs.profile-gate.result }}
          PROFILE_AUTHORITY_RESULT: ${{ needs.profile-gate.outputs.result }}
          PROFILE_ACTIVE: ${{ needs.profile-gate.outputs.active }}
          BACKUP_JOB_RESULT: ${{ needs.backup.result }}
        run: |
          set -euo pipefail
          label="customer-production-backup-failure"
          preflight_artifact="customer-production-backup-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backup_artifact="customer-production-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # Deliberate non-customer operation is durable evidence, not an incident
          # and not recovery. Preserve any earlier backup incident until a real
          # eligible backup passes its authenticated terminal-result verifier.
          if [ "$PROFILE_JOB_RESULT" = "success" ] && \
             [ "$PROFILE_AUTHORITY_RESULT" = "not_configured" ] && \
             [ "$PROFILE_ACTIVE" != "true" ] && \
             [ "$BACKUP_JOB_RESULT" = "skipped" ]; then
            echo "::notice title=Customer backup not configured::No incident state changes are permitted for intentional not_configured operation."
            exit 0
          fi

          if [ "$PROFILE_JOB_RESULT" = "success" ] && \
             [ "$PROFILE_AUTHORITY_RESULT" = "eligible" ] && \
             [ "$PROFILE_ACTIVE" = "true" ] && \
             [ "$BACKUP_JOB_RESULT" = "success" ]; then
            for number in $(gh issue list --repo "$GH_REPO" --state open --label "$label" \
              --json number --jq '.[].number'); do
              gh issue close "$number" --repo "$GH_REPO" --reason completed \
                --comment "Customer profile authority and authenticated backup succeeded: $RUN_URL. Evidence artifact: $backup_artifact at $RUN_URL#artifacts. Closing automatically."
            done
            exit 0
          fi

          incident_reason=""
          evidence_artifact="$preflight_artifact"
          if [ "$PROFILE_JOB_RESULT" != "success" ]; then
            incident_reason="Customer backup profile authority failed before backup execution."
          elif [ "$PROFILE_AUTHORITY_RESULT" != "eligible" ] || [ "$PROFILE_ACTIVE" != "true" ]; then
            incident_reason="Customer backup profile authority returned an unexpected incomplete state."
          else
            incident_reason="Customer backup execution or authenticated result verification failed."
            evidence_artifact="$backup_artifact"
          fi

          gh label create "$label" --repo "$GH_REPO" --color b60205 \
            --description "Automated: customer production backup failed" >/dev/null 2>&1 || true
          existing="$(gh issue list --repo "$GH_REPO" --state open --label "$label" \
            --json number --jq '.[0].number // empty')"
          body="$incident_reason Run: $RUN_URL. Evidence artifact: $evidence_artifact at $RUN_URL#artifacts. Runbook: docs/CUSTOMER_INCIDENT_RUNBOOK.md"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --label "$label" \
              --title "Customer production backup FAILED" --body "$body"
          fi
