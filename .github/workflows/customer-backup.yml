name: Customer production backup

permissions:
  contents: read

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: customer-production-backup
  cancel-in-progress: false

jobs:
  # The backup runs ON the customer machine and its producer fail-closed-refuses
  # unless MENDPOINT_DEPLOYMENT_PROFILE == "customer" (customer_backup_profile_required).
  # The repository variable records operator intent. The live app profile is read
  # through the app-scoped Fly authority on every run; the two must agree. A deliberate
  # non-customer state is retained as NOT CONFIGURED, never as backup success. Drift or
  # an indeterminate live profile fails closed.
  profile-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: customer-production-backup
    outputs:
      active: ${{ steps.check.outputs.active }}
      result: ${{ steps.check.outputs.result }}
    steps:
      - name: Initialize backup preflight evidence
        shell: bash
        env:
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          mkdir -p test-results/customer-backup-preflight
          evidence="test-results/customer-backup-preflight/preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          jq -n \
            --arg app "$CUSTOMER_APP" \
            --arg revision "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg result "authority_unavailable" \
            --arg reason "preflight_not_completed" \
            --argjson backupTaken false \
            --argjson operatorActionRequired true \
            '{schemaVersion:1,kind:"customer_backup_preflight",app:$app,revision:$revision,runId:$runId,runAttempt:$runAttempt,observedAt:$observedAt,result:$result,reason:$reason,backupTaken:$backupTaken,operatorActionRequired:$operatorActionRequired}' \
            > "$evidence"

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Inspect live customer profile authority
        id: check
        shell: bash
        env:
          EXPECTED_ACTIVE: ${{ vars.MENDPOINT_CUSTOMER_PROFILE_ACTIVE }}
          FLY_API_TOKEN: ${{ secrets.MENDPOINT_CUSTOMER_BACKUP_FLY_TOKEN }}
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail

          evidence="test-results/customer-backup-preflight/preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          active=false
          result="authority_unavailable"
          reason="preflight_not_completed"
          live_profile="unknown"
          expected_active=false
          operator_action_required=true

          write_evidence_and_exit() {
            status=$?
            trap - EXIT
            jq -n \
              --arg app "$CUSTOMER_APP" \
              --arg revision "$GITHUB_SHA" \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg result "$result" \
              --arg reason "$reason" \
              --arg liveProfile "$live_profile" \
              --argjson expectedCustomerProfile "$expected_active" \
              --argjson backupTaken false \
              --argjson operatorActionRequired "$operator_action_required" \
              '{schemaVersion:1,kind:"customer_backup_preflight",app:$app,revision:$revision,runId:$runId,runAttempt:$runAttempt,observedAt:$observedAt,result:$result,reason:$reason,liveProfile:$liveProfile,expectedCustomerProfile:$expectedCustomerProfile,backupTaken:$backupTaken,operatorActionRequired:$operatorActionRequired}' \
              > "$evidence"
            echo "active=$active" >> "$GITHUB_OUTPUT"
            echo "result=$result" >> "$GITHUB_OUTPUT"
            printf '### Customer production backup\n\nResult: `%s`  \nLive profile: `%s`  \nBackup taken: `false`\n' \
              "$result" "$live_profile" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          }
          trap write_evidence_and_exit EXIT

          case "$EXPECTED_ACTIVE" in
            true) expected_active=true ;;
            false|"") expected_active=false ;;
            *)
              result="authority_invalid"
              reason="customer_profile_intent_invalid"
              echo customer_backup_profile_intent_invalid >&2
              exit 1
              ;;
          esac

          test -n "$FLY_API_TOKEN" || {
            reason="customer_backup_fly_token_missing"
            echo customer_backup_fly_token_missing >&2
            exit 1
          }
          [[ "$CUSTOMER_APP" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || {
            reason="customer_backup_app_binding_invalid"
            echo customer_backup_app_binding_invalid >&2
            exit 1
          }
          apps_json="$(flyctl apps list --json)"
          visible_apps_json="$(jq -ce '[.[] | (.Name // .name)] | unique' <<< "$apps_json")"
          visible_app_count="$(jq -r 'length' <<< "$visible_apps_json")"
          visible_app="$(jq -r '.[0] // ""' <<< "$visible_apps_json")"
          if [ "$visible_app_count" -ne 1 ] || [ "$visible_app" != "$CUSTOMER_APP" ]; then
            reason="customer_backup_token_not_app_scoped"
            echo customer_backup_token_not_app_scoped >&2
            exit 1
          fi
          flyctl status --app "$CUSTOMER_APP" >/dev/null
          live_profile="$(flyctl ssh console --app "$CUSTOMER_APP" --pty=false \
            --command "printenv MENDPOINT_DEPLOYMENT_PROFILE")"
          live_profile="${live_profile//$'\r'/}"
          live_profile="${live_profile//$'\n'/}"
          case "$live_profile" in
            customer|demo|pilot) ;;
            *)
              result="authority_invalid"
              reason="customer_backup_live_profile_invalid"
              echo customer_backup_live_profile_invalid >&2
              exit 1
              ;;
          esac

          if [ "$expected_active" = "true" ] && [ "$live_profile" = "customer" ]; then
            active=true
            result="eligible"
            reason="live_customer_profile_verified"
            operator_action_required=false
            echo "Customer profile authority verified. Backup will run."
          elif [ "$expected_active" = "false" ] && [ "$live_profile" != "customer" ]; then
            result="not_configured"
            reason="customer_profile_inactive"
            operator_action_required=false
            echo "::notice title=Customer backup not configured::The live app profile is $live_profile and operator intent is inactive. No backup was taken."
          else
            result="operator_action_required"
            reason="customer_backup_profile_authority_mismatch"
            echo customer_backup_profile_authority_mismatch >&2
            exit 1
          fi

      - name: Retain backup preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: customer-production-backup-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/customer-backup-preflight/
          if-no-files-found: error
          retention-days: 90

  backup:
    needs: profile-gate
    if: ${{ needs.profile-gate.outputs.active == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    # The app's authenticated object-store operation is bounded at four hours.
    # Keep the runner alive through that fail-closed timeout so it does not sever
    # the SSH session while the remote process still owns the backup fence.
    timeout-minutes: 270
    environment: customer-production-backup
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Initialize backup evidence
        shell: bash
        env:
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          mkdir -p test-results/customer-backup
          evidence="test-results/customer-backup/backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          printf 'run=%s attempt=%s app=%s revision=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CUSTOMER_APP" "$GITHUB_SHA" > "$evidence"

      - name: Validate app-scoped backup authority
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.MENDPOINT_CUSTOMER_BACKUP_FLY_TOKEN }}
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo customer_backup_fly_token_missing >&2; exit 1; }
          [[ "$CUSTOMER_APP" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || {
            echo customer_backup_app_binding_invalid >&2
            exit 1
          }
          apps_json="$(flyctl apps list --json)"
          visible_apps_json="$(jq -ce '[.[] | (.Name // .name)] | unique' <<< "$apps_json")"
          visible_app_count="$(jq -r 'length' <<< "$visible_apps_json")"
          visible_app="$(jq -r '.[0] // ""' <<< "$visible_apps_json")"
          if [ "$visible_app_count" -ne 1 ] || [ "$visible_app" != "$CUSTOMER_APP" ]; then
            echo customer_backup_token_not_app_scoped >&2
            exit 1
          fi
          flyctl status --app "$CUSTOMER_APP" >/dev/null

      - name: Run authenticated customer backup
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.MENDPOINT_CUSTOMER_BACKUP_FLY_TOKEN }}
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          evidence="test-results/customer-backup/backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          flyctl ssh console --app "$CUSTOMER_APP" --pty=false \
            --command "node --import tsx scripts/customer-backup.ts" 2>&1 | tee -a "$evidence"
          grep -q '"backupId"' "$evidence"
          grep -q '"manifestAuthentication"' "$evidence"
          grep -q '"publication"' "$evidence"
          printf 'result=success backupTaken=true\n' >> "$evidence"

      - name: Retain backup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: customer-production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/customer-backup/
          if-no-files-found: error
          retention-days: 90

      - name: Alert on backup failure
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="customer-production-backup-failure"
          gh label create "$label" --repo "$GH_REPO" --color b60205 \
            --description "Automated: customer production backup failed" >/dev/null 2>&1 || true
          existing="$(gh issue list --repo "$GH_REPO" --state open --label "$label" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" \
              --body "Customer backup failed again. Failed run: $RUN_URL"
          else
            gh issue create --repo "$GH_REPO" --label "$label" \
              --title "Customer production backup FAILED" \
              --body "The recurring authenticated customer backup failed. Failed run: $RUN_URL. Runbook: docs/CUSTOMER_INCIDENT_RUNBOOK.md"
          fi

      - name: Resolve backup failure alert
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="customer-production-backup-failure"
          for number in $(gh issue list --repo "$GH_REPO" --state open --label "$label" \
            --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GH_REPO" --reason completed \
              --comment "Customer backup succeeded: $RUN_URL. Closing automatically."
          done
