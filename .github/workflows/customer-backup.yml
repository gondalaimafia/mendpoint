name: Customer production backup

permissions:
  contents: read

# This is NO LONGER the primary trigger. The backup is now triggered on the
# customer machine itself by scripts/customer-backup-scheduler.ts, running as the
# supervised `backup` child, at a cadence DERIVED from the recovery policy's RPO
# rather than declared beside it.
#
# The cron here asked for every 30 minutes against a 3600s RPO. GitHub delivered
# it 2h13m to 8h23m apart -- every gap wider than the RPO -- so
# `last_verified_backup` went `overdue` between runs and Fly's /ready poll sat red
# while every run that fired succeeded.
#
# What this cron is now, honestly
# -------------------------------
# A DEAD-PROCESS FALLBACK, and nothing more. The in-process trigger dies with the
# machine, and a dead machine is the one case an external trigger still covers.
#
# It is NOT a second line of defence for the RPO, and lengthening it to hourly
# does not make it one: this repo's own hourly cron (the watchdog's `29 * * * *`)
# is delivered at gaps of 2h42m, 4h42m, 6h01m and 5h56m. GitHub drops hourly
# schedules about as badly as it drops half-hourly ones. Delivery here is measured
# in HOURS, not minutes, and cannot meet a 3600s RPO on its own. Anything that
# needs to hold the RPO must live on the machine.
#
# The minute is offset from the watchdog's :29 only to avoid the two firing
# together. Concurrent runs are safe regardless: the backup takes an exclusive
# fence marker with `flag: "wx"`, so the loser of the race exits without writing.
#
# workflow_dispatch remains the manual path, and the failure-alerting steps below
# are unchanged.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch: {}

concurrency:
  group: customer-production-backup
  cancel-in-progress: false

jobs:
  # The backup runs ON the customer machine and its producer fail-closed-refuses
  # unless MENDPOINT_DEPLOYMENT_PROFILE == "customer" (customer_backup_profile_required).
  # The gate below reads vars.MENDPOINT_CUSTOMER_PROFILE_ACTIVE so a deployment that
  # does not run the customer profile reports "no backup taken" out loud instead of
  # either alarming permanently or skipping silently: the explicit third state, run
  # green with the reason printed every run. (mendpoint-fettler-production does run
  # the customer profile; this gate stays for deployments that do not.)
  profile-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - name: Report whether the customer profile is active
        id: check
        shell: bash
        env:
          ACTIVE: ${{ vars.MENDPOINT_CUSTOMER_PROFILE_ACTIVE }}
        run: |
          set -euo pipefail
          if [ "$ACTIVE" = "true" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "customer profile active — backup will run"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Customer backup not applicable::NOT-CONFIGURED — mendpoint-talal still runs the demo profile; the customer-profile activation (discarded #337 headline) has not been proposed. No backup was taken. Flip repo variable MENDPOINT_CUSTOMER_PROFILE_ACTIVE=true when activating."
          fi
  backup:
    needs: profile-gate
    if: ${{ needs.profile-gate.outputs.active == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    # The app's authenticated object-store operation is bounded at four hours.
    # Keep the runner alive through that fail-closed timeout so it does not sever
    # the SSH session while the remote process still owns the backup fence.
    timeout-minutes: 270
    environment: customer-production-backup
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Initialize backup evidence
        shell: bash
        env:
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          mkdir -p test-results/customer-backup
          evidence="test-results/customer-backup/backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          printf 'run=%s attempt=%s app=%s revision=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CUSTOMER_APP" "$GITHUB_SHA" > "$evidence"

      - name: Validate app-scoped backup authority
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.MENDPOINT_CUSTOMER_BACKUP_FLY_TOKEN }}
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo customer_backup_fly_token_missing >&2; exit 1; }
          [[ "$CUSTOMER_APP" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || {
            echo customer_backup_app_binding_invalid >&2
            exit 1
          }
          mapfile -t visible_apps < <(flyctl apps list --json | jq -r '.[] | (.Name // .name)' | sort -u)
          if [ "${#visible_apps[@]}" -ne 1 ] || [ "${visible_apps[0]:-}" != "$CUSTOMER_APP" ]; then
            echo customer_backup_token_not_app_scoped >&2
            exit 1
          fi
          flyctl status --app "$CUSTOMER_APP" >/dev/null

      - name: Run authenticated customer backup
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.MENDPOINT_CUSTOMER_BACKUP_FLY_TOKEN }}
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          # `|| status=$?` because the exit of THIS command is data, not a fatal
          # error: losing the fence race is an expected outcome now that the machine
          # schedules its own backups.
          status=0
          evidence="test-results/customer-backup/backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          flyctl ssh console --app "$CUSTOMER_APP" --pty=false \
            --command "node --import tsx scripts/customer-backup.ts" 2>&1 | tee -a "$evidence" \
            || status=$?
          # The on-machine scheduler holds the exclusive fence roughly every 30 minutes,
          # and the watchdog can dispatch this workflow at the same time. The loser of
          # that race exits non-zero having written nothing, which is correct behaviour,
          # not a backup failure -- paging on it would fire an incident precisely when
          # backups are working. The winner refreshes the evidence, and /ready's
          # last_verified_backup remains the authority on whether one actually happened.
          if grep -q 'backup_fence_already_active' "$evidence"; then
            echo "::notice title=Backup already running::Another backup held the exclusive fence, so this run took none. The holder refreshes the evidence; /ready last_verified_backup is the authority."
            exit 0
          fi
          test "$status" -eq 0 || exit "$status"
          grep -q '"backupId"' "$evidence"
          grep -q '"manifestAuthentication"' "$evidence"
          grep -q '"publication"' "$evidence"

      - name: Retain backup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: customer-production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/customer-backup/
          if-no-files-found: error
          retention-days: 90

      - name: Alert on backup failure
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="customer-production-backup-failure"
          gh label create "$label" --repo "$GH_REPO" --color b60205 \
            --description "Automated: customer production backup failed" >/dev/null 2>&1 || true
          existing="$(gh issue list --repo "$GH_REPO" --state open --label "$label" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" \
              --body "Customer backup failed again. Failed run: $RUN_URL"
          else
            gh issue create --repo "$GH_REPO" --label "$label" \
              --title "Customer production backup FAILED" \
              --body "The recurring authenticated customer backup failed. Failed run: $RUN_URL. Runbook: docs/CUSTOMER_INCIDENT_RUNBOOK.md"
          fi

      - name: Resolve backup failure alert
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="customer-production-backup-failure"
          for number in $(gh issue list --repo "$GH_REPO" --state open --label "$label" \
            --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GH_REPO" --reason completed \
              --comment "Customer backup succeeded: $RUN_URL. Closing automatically."
          done
