name: Customer production backup

run-name: >-
  ${{ inputs.delivery_id && format('Customer production backup [{0}]', inputs.delivery_id)
      || 'Customer production backup' }}

permissions:
  contents: read

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      delivery_id:
        description: >-
          Exact dispatcher identity (backup-delivery controller or backup
          watchdog). Required for any dispatch the delivery controller must
          recognise; a dispatch without it is reported as an invalid active
          backup and pages the owner.
        required: false
        type: string

concurrency:
  group: customer-production-backup
  cancel-in-progress: false

jobs:
  # The backup runs ON the customer machine and its producer fail-closed-refuses
  # unless MENDPOINT_DEPLOYMENT_PROFILE == "customer" (customer_backup_profile_required).
  # mendpoint-talal deliberately still runs the demo profile: the customer-profile
  # activation was the discarded #337 headline, to be proposed on its own. Until the
  # owner flips vars.MENDPOINT_CUSTOMER_PROFILE_ACTIVE to 'true' alongside that
  # activation, a red cron here would be a permanent false alarm — and a silent skip
  # would fake "we have backups". This gate is the explicit third state: run green,
  # backup visibly NOT taken, reason printed every run.
  profile-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - name: Report whether the customer profile is active
        id: check
        shell: bash
        env:
          ACTIVE: ${{ vars.MENDPOINT_CUSTOMER_PROFILE_ACTIVE }}
        run: |
          set -euo pipefail
          if [ "$ACTIVE" = "true" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "customer profile active — backup will run"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Customer backup not applicable::NOT-CONFIGURED — mendpoint-talal still runs the demo profile; the customer-profile activation (discarded #337 headline) has not been proposed. No backup was taken. Flip repo variable MENDPOINT_CUSTOMER_PROFILE_ACTIVE=true when activating."
          fi
  execution-gate:
    needs: profile-gate
    if: ${{ needs.profile-gate.outputs.active == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    outputs:
      execute: ${{ steps.check.outputs.execute }}
    steps:
      - name: Recheck serialized backup freshness
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BACKUP_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          current_created_at="$(gh run view "$CURRENT_RUN_ID" --repo "$GH_REPO" \
            --json createdAt --jq '.createdAt')"
          superseding_run_id=""
          while IFS= read -r candidate_run_id; do
            if [ -z "$candidate_run_id" ] || [ "$candidate_run_id" = "$CURRENT_RUN_ID" ]; then continue; fi
            completed_after_creation="$(gh run view "$candidate_run_id" --repo "$GH_REPO" \
              --json jobs \
              --jq "[.jobs[] | select(.name == \"backup\" and .conclusion == \"success\" and .completedAt >= \"$current_created_at\")] | length")"
            if [ "$completed_after_creation" = "1" ]; then
              superseding_run_id="$candidate_run_id"
              break
            fi
          done < <(gh run list --repo "$GH_REPO" --workflow customer-backup.yml \
            --branch "$BACKUP_REF" --status success --limit 50 \
            --json databaseId --jq '.[].databaseId')
          if [ -n "$superseding_run_id" ]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "duplicate_backup_execution_fenced superseding_run_id=$superseding_run_id"
          else
            echo "execute=true" >> "$GITHUB_OUTPUT"
          fi
  backup:
    needs: [profile-gate, execution-gate]
    if: ${{ needs.profile-gate.outputs.active == 'true' && needs.execution-gate.outputs.execute == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    # The app's authenticated object-store operation is bounded at four hours.
    # Keep the runner alive through that fail-closed timeout so it does not sever
    # the SSH session while the remote process still owns the backup fence.
    timeout-minutes: 270
    environment: customer-production-backup
    permissions:
      contents: read
      issues: write
    steps:
      # FIRST, so the evidence directory (and a file) always exist: run 35842783709
      # failed at "Install Fly CLI" (a download blip), the job died before this
      # step ran, and "Retain backup evidence" then errored with "No files were
      # found" (if-no-files-found: error). Creating the evidence up front means the
      # upload always has something to retain even when a later step fails.
      - name: Initialize backup evidence
        shell: bash
        env:
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          mkdir -p test-results/customer-backup
          evidence="test-results/customer-backup/backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          printf 'run=%s attempt=%s app=%s revision=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CUSTOMER_APP" "$GITHUB_SHA" > "$evidence"

      - name: Install Fly CLI
        id: install_flyctl
        # The setup action cannot retry its own download, and a transient CDN blip
        # (run 35842783709) killed the whole backup. Allow this first attempt to
        # fail without failing the job, then retry once below with the SAME pinned
        # SHA and version. Only if BOTH fail does the job fail.
        continue-on-error: true
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        # Pinned: flyctl 0.4.101 and later answer "Error: unauthorized" to
        # `flyctl apps list --json` for an app-scoped token, which breaks the
        # next step's proof that MENDPOINT_CUSTOMER_BACKUP_FLY_TOKEN is app
        # scoped. Last green backup run 34213697564 acquired 0.4.100; the first
        # failure run 34305549375 acquired 0.4.101 and died at that step with
        # customer_backup_token_not_app_scoped. Bumping this pin requires first
        # re-proving `flyctl apps list --json` returns exactly one app with a
        # freshly minted app-scoped token.
        with:
          version: "0.4.100"

      - name: Install Fly CLI (retry once)
        # Same pinned SHA and version; runs only when the first install failed, so
        # a single download blip no longer fails the backup. A second failure here
        # is NOT continue-on-error, so a genuinely broken install still fails loudly.
        if: ${{ steps.install_flyctl.outcome == 'failure' }}
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: "0.4.100"

      - name: Validate app-scoped backup authority
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.MENDPOINT_CUSTOMER_BACKUP_FLY_TOKEN }}
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo customer_backup_fly_token_missing >&2; exit 1; }
          [[ "$CUSTOMER_APP" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || {
            echo customer_backup_app_binding_invalid >&2
            exit 1
          }
          # Capture the listing with its own exit status. Process substitution
          # runs in a subshell whose failure does NOT trip the runner's -e, so
          # the old `mapfile < <(flyctl apps list ... )` reported an unauthorized
          # or network error as an EMPTY app list -> customer_backup_token_not_app_scoped.
          # That third state (flyctl could not answer) masquerading as a scope
          # violation is exactly what hid the 0.4.101 apps-list regression. A
          # failed call, or output that is not the JSON array we expect, is
          # scope-UNDETERMINED, distinct from a proven scope violation.
          if ! apps_json="$(flyctl apps list --json)"; then
            echo customer_backup_scope_undetermined >&2
            exit 1
          fi
          if ! printf '%s' "$apps_json" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo customer_backup_scope_undetermined >&2
            exit 1
          fi
          mapfile -t visible_apps < <(printf '%s' "$apps_json" | jq -r '.[] | (.Name // .name)' | sort -u)
          if [ "${#visible_apps[@]}" -ne 1 ] || [ "${visible_apps[0]:-}" != "$CUSTOMER_APP" ]; then
            echo customer_backup_token_not_app_scoped >&2
            exit 1
          fi
          flyctl status --app "$CUSTOMER_APP" >/dev/null

      - name: Run authenticated customer backup
        id: backup_run
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.MENDPOINT_CUSTOMER_BACKUP_FLY_TOKEN }}
          CUSTOMER_APP: ${{ vars.MENDPOINT_CUSTOMER_FLY_APP }}
        run: |
          set -euo pipefail
          evidence="test-results/customer-backup/backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          # There is NO "deferred" outcome. A backup during a deploy window cannot
          # run over ssh (run 35935775978 died with "has no started VMs", run
          # 35933404692 with a severed ssh session), so instead of faking a green
          # neutral state -- which the delivery controller and the execution-gate
          # fence both read as "a backup was taken" -- we WAIT for the deploy to
          # settle and then back up for real. Every path ends in exactly one honest
          # state: a real verified backup (success) or a failure that alerts.
          #
          # The settle window is kept below the delivery controller's
          # DELIVERY_MAX_ACTIVE_AGE_SECONDS (1200s) and well under the 3600s RPO, so
          # a backup that waits out a deploy is never reported as a stalled active
          # run, and a deploy that does not finish inside the window is genuinely
          # stuck (deploy_did_not_settle) and must alert.
          : "${SETTLE_MAX_SECONDS:=720}"
          : "${SETTLE_POLL_SECONDS:=30}"
          : "${SETTLE_RECENT_SECONDS:=300}"
          # Per-read wall-clock bound for EVERY flyctl call in the settle wait
          # (`releases` and `machine list`). flyctl sets NO client timeout of its
          # own (fly-go uses http.DefaultTransport with no deadline), and the step
          # wraps nothing, so without this a single hung read runs to the
          # 270-minute job timeout. A read that exceeds this bound is treated as
          # `unknown` (release_readable/machines_readable=false) and the step falls
          # open, exactly like any other unreadable read. 30s is far above the
          # 1-2s realistic latency, so it never trips a healthy read; it only
          # catches a genuinely hung one.
          : "${SETTLE_READ_TIMEOUT_SECONDS:=30}"

          # ONE deadline for BOTH settle windows (the pre-backup settle and the
          # retry settle). Computed once here and shared by every settle_wait
          # call, so the retry path cannot spend a SECOND fresh SETTLE_MAX_SECONDS
          # window and double the wait.
          #
          # Budget arithmetic against the delivery controller's
          # DELIVERY_MAX_ACTIVE_AGE_SECONDS=1200 (measured production maxima):
          #     preamble, the steps before this one          up to 107s
          #   + total settle across BOTH windows (this cap)       720s
          #   + two backup attempts at up to 51s each             102s
          #   -----------------------------------------------------------
          #   = 929s of active age with INSTANT flyctl reads, 271s under 1200.
          # Slow-but-succeeding settle reads stretch that worst SUCCESSFUL path:
          # the reviewer measured 929s at 0s per read, 969s at 2s, 1109s at 30s
          # and 1199s at 45s. The SETTLE_READ_TIMEOUT_SECONDS=30 bound above caps a
          # read at 30s, so the worst path a slow-but-readable flyctl can produce
          # is about 1109s, still 91s under the 1200s ceiling; a read that would
          # take longer (the 1199s/45s row) times out to `unknown` instead of
          # lengthening the run. This worst case is what the backup-freshness
          # watchdog's remediation observe window is tied to:
          #   BACKUP_WORST_CASE_ACTIVE_AGE_SECONDS = 1109
          # (see customer-backup-watchdog.yml, whose observe window must clear this
          # plus margin, or a still-settling backup would be reported as failed).
          # A single deploy's release phase is 34-81s (247s outlier), so the 720s
          # total absorbs even the outlier and still leaves the run under 1200s.
          settle_deadline="$(( $(date -u +%s) + SETTLE_MAX_SECONDS ))"

          read_deploy_state() {
            # Reads the NEWEST release only (sorted by version descending -- never
            # `any` over all releases, so one old stuck `running` release cannot
            # wedge every backup forever) and the machine state. Both reads are
            # bounded by SETTLE_READ_TIMEOUT_SECONDS; a read that hangs past it, or
            # errors, is `unknown`. Sets:
            #   release_readable / machines_readable  (false when flyctl errored,
            #     timed out, OR answered 0 with no well-formed non-empty release
            #     list -- see below)
            #   newest_status (lowercased)
            #   newest_version  "unknown" when the release read could not be
            #     trusted, else the newest release's version. There is NO separate
            #     "no releases" value: this app always has releases, so flyctl
            #     exiting 0 with a non-array, an empty list, or non-JSON is a read
            #     we could not trust, NOT proof of "none". Collapsing that into
            #     `unknown` (not -1) is deliberate (FAILURE_MODES §1): a failed or
            #     empty read must never later read as "a newer release appeared",
            #     which is exactly how an unreadable/empty baseline used to let a
            #     crash retry into a green run.
            #   newest_age_seconds (age of newest release; large when unknown)
            #   machine_started (true when at least one machine is started)
            release_readable=true
            local releases_json=""
            if ! releases_json="$(timeout "$SETTLE_READ_TIMEOUT_SECONDS" \
              flyctl releases --app "$CUSTOMER_APP" --json 2>/dev/null)"; then
              release_readable=false
            fi
            newest_status=""
            newest_version=unknown
            local newest_created_at=""
            if [ "$release_readable" = true ]; then
              local newest_line=""
              newest_line="$(printf '%s' "$releases_json" | jq -r '
                if (type == "array" and length > 0) then
                  (sort_by(.Version // .version // 0) | last) as $r
                  | ((($r.Status // $r.status // "") | ascii_downcase)
                     + "\u0001" + (($r.Version // $r.version // -1) | tostring)
                     + "\u0001" + ($r.CreatedAt // $r.created_at // ""))
                else "" end' 2>/dev/null || true)"
              if [ -n "$newest_line" ]; then
                newest_status="${newest_line%%$'\x01'*}"
                local rest="${newest_line#*$'\x01'}"
                newest_version="${rest%%$'\x01'*}"
                newest_created_at="${rest#*$'\x01'}"
              fi
            fi
            newest_age_seconds=999999
            if [ -n "$newest_created_at" ]; then
              local created_epoch=0
              created_epoch="$(date -u -d "$newest_created_at" +%s 2>/dev/null || echo 0)"
              if [ "$created_epoch" -gt 0 ]; then
                newest_age_seconds="$(( $(date -u +%s) - created_epoch ))"
              fi
            fi
            machines_readable=true
            local machines_json=""
            if ! machines_json="$(timeout "$SETTLE_READ_TIMEOUT_SECONDS" \
              flyctl machine list --app "$CUSTOMER_APP" --json 2>/dev/null)"; then
              machines_readable=false
            fi
            machine_started=false
            if [ "$machines_readable" = true ]; then
              if printf '%s' "$machines_json" \
                | jq -e 'type == "array" and any(.[]; (.state // "") == "started")' >/dev/null 2>&1; then
                machine_started=true
              fi
            fi
          }

          release_in_progress() {
            case "$newest_status" in
              running|pending|replacing|deploying) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Wait out any in-progress customer deploy. Returns 0 when the app is
          # settled (newest release complete AND a machine started) or when flyctl
          # cannot answer (fall open, attempt the backup -- unchanged from before).
          # Exits the whole step non-zero -- failing loudly for the alert -- when a
          # machine is stopped with NO deploy in progress (the #659 shape) or when a
          # deploy never settles inside the window.
          settle_wait() {
            while true; do
              read_deploy_state
              if [ "$release_readable" != true ] || [ "$machines_readable" != true ]; then
                echo "customer_backup_settle_flyctl_unreadable release_readable=$release_readable machines_readable=$machines_readable -- attempting the backup (fail open)"
                return 0
              fi
              if [ "$machine_started" = true ] && ! release_in_progress; then
                return 0
              fi
              if ! release_in_progress && [ "$machine_started" != true ]; then
                # No deploy in progress and no started machine. A just-finished
                # deploy may still be booting (newest release is recent) -- wait for
                # it. Otherwise this is the #659 stopped-machine shape: fail loudly,
                # exactly as main did; never wait and never defer.
                if [ "$newest_age_seconds" -ge "$SETTLE_RECENT_SECONDS" ]; then
                  echo "customer_backup_machine_stopped_no_deploy newest_status=${newest_status:-none} newest_age_seconds=$newest_age_seconds" >&2
                  exit 1
                fi
              fi
              if [ "$(date -u +%s)" -ge "$settle_deadline" ]; then
                echo "customer_backup_deploy_did_not_settle newest_status=${newest_status:-none} machine_started=$machine_started settle_seconds=$SETTLE_MAX_SECONDS" >&2
                exit 1
              fi
              echo "customer_backup_waiting_for_deploy newest_status=${newest_status:-none} machine_started=$machine_started"
              sleep "$SETTLE_POLL_SECONDS"
            done
          }

          run_backup_once() {
            # $1 receives ONLY this attempt's output. The evidence check below
            # greps THAT file, never the shared "$evidence" log: appending both
            # attempts to one file let a partial first attempt satisfy the second
            # attempt's evidence check, so a second run that exits 0 while
            # printing only part of the manifest wrongly passed. The shared
            # "$evidence" still gets every attempt (tee -a) for the retained
            # artifact; the per-attempt file is what the run is judged on.
            #
            # `set +e` (then restore) so the ssh exit is captured, not fatal under
            # -e; PIPESTATUS[0] is the ssh status, not tee's.
            set +e
            flyctl ssh console --app "$CUSTOMER_APP" --pty=false \
              --command "node --import tsx scripts/customer-backup.ts" 2>&1 \
              | tee "$1" | tee -a "$evidence"
            local status=${PIPESTATUS[0]}
            set -e
            return "$status"
          }

          # Settle, then back up. On an ssh failure, re-read the deploy state and
          # retry EXACTLY ONCE (after settling) ONLY if a deploy is confirmed -- a
          # release newer than the one seen before the backup, or the newest release
          # now in progress. A crash or OOM (no deploy) fails loudly; it is never
          # retried into a green run and never masked as a deferral.
          #
          # The baseline version is taken from settle_wait's OWN final read -- no
          # second read afterwards. A second read could observe a deploy that
          # started in the gap and record its version as the baseline, so the
          # post-failure read would see the SAME version and miss the deploy that
          # dropped the backup.
          settle_wait
          pre_backup_version="$newest_version"

          attempt_output="$(mktemp)"
          attempt=1
          while true; do
            ssh_status=0
            run_backup_once "$attempt_output" || ssh_status=$?
            if [ "$ssh_status" -eq 0 ]; then
              grep -q '"backupId"' "$attempt_output"
              grep -q '"manifestAuthentication"' "$attempt_output"
              grep -q '"publication"' "$attempt_output"
              break
            fi
            if [ "$attempt" -ge 2 ]; then
              echo "customer_backup_run_failed status=$ssh_status attempts=$attempt" >&2
              exit "$ssh_status"
            fi
            read_deploy_state || true
            deploy_confirmed=false
            # A deploy is confirmed ONLY when BOTH the baseline (from settle's final
            # read) and this post-failure read are KNOWN. "unknown" on either side
            # -- flyctl could not answer, timed out, or returned an empty/garbage
            # list -- is NOT a deploy: a crash or OOM with an unreadable baseline
            # must fail loudly, never retry into a green run (FAILURE_MODES §1).
            #
            # This explicit known-value guard is LOAD-BEARING and not redundant
            # with the `unknown` sentinel making `-gt` false: it also blocks the
            # `release_in_progress` branch below, so an unknown baseline paired
            # with a post-failure read that shows a deploy VISIBLY in progress is
            # still failed loudly rather than retried. Deleting this `if` fails a
            # test (an unknown baseline plus an in-progress post-failure read).
            if [ "$pre_backup_version" != unknown ] && [ "$newest_version" != unknown ]; then
              if [ "$newest_version" -gt "$pre_backup_version" ] 2>/dev/null; then
                deploy_confirmed=true
              elif release_in_progress; then
                deploy_confirmed=true
              fi
            fi
            if [ "$deploy_confirmed" != true ]; then
              echo "customer_backup_run_failed status=$ssh_status reason=no_deploy_confirmed" >&2
              exit "$ssh_status"
            fi
            echo "customer_backup_retry_after_confirmed_deploy pre_version=$pre_backup_version newest_version=$newest_version newest_status=${newest_status:-none}"
            settle_wait
            pre_backup_version="$newest_version"
            attempt=$((attempt + 1))
          done

      - name: Retain backup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: customer-production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/customer-backup/
          if-no-files-found: error
          retention-days: 90

      - name: Alert on backup failure
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="customer-production-backup-failure"
          gh label create "$label" --repo "$GH_REPO" --color b60205 \
            --description "Automated: customer production backup failed" >/dev/null 2>&1 || true
          existing="$(gh issue list --repo "$GH_REPO" --state open --label "$label" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" \
              --body "Customer backup failed again. Failed run: $RUN_URL"
          else
            gh issue create --repo "$GH_REPO" --label "$label" \
              --title "Customer production backup FAILED" \
              --body "The recurring authenticated customer backup failed. Failed run: $RUN_URL. Runbook: docs/CUSTOMER_INCIDENT_RUNBOOK.md"
          fi

      - name: Resolve backup failure alert
        # Only a real, completed backup resolves the failure alert. There is no
        # longer any deferred-but-green outcome: the job reaches success only after
        # a verified backup, so a green run always means the backup actually
        # recovered.
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="customer-production-backup-failure"
          for number in $(gh issue list --repo "$GH_REPO" --state open --label "$label" \
            --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GH_REPO" --reason completed \
              --comment "Customer backup succeeded: $RUN_URL. Closing automatically."
          done
