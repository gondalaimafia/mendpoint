name: Regauge production proof

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run read only Fly authority discovery or the protected activation
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - activate
      confirmation:
        description: Type REGAUGE_DRAFT_ONLY to authorize one draft only production delivery
        required: true
        type: string
      live_eval_repetitions:
        description: Bounded live model repetitions
        required: true
        default: "3"
        type: string
      readiness_soak_seconds:
        description: Read only production readiness soak duration
        required: true
        default: "300"
        type: string

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: "0.4.79"
      - name: Prove Fly authority without mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/regauge-production/preflight
          test -n "$FLY_API_TOKEN"
          flyctl auth whoami >/dev/null
          flyctl orgs list --json \
            | tee test-results/regauge-production/preflight/fly-orgs.json
          if flyctl status --app mendpoint-regauge-production --json \
            >test-results/regauge-production/preflight/fly-status-raw.json 2>/dev/null; then
            jq '{exists: true, status: .}' \
              test-results/regauge-production/preflight/fly-status-raw.json \
              >test-results/regauge-production/preflight/dedicated-app.json
          else
            jq -n '{exists: false}' \
              >test-results/regauge-production/preflight/dedicated-app.json
          fi
          rm -f test-results/regauge-production/preflight/fly-status-raw.json
      - name: Upload read only Fly preflight evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: regauge-fly-preflight-${{ github.sha }}
          path: test-results/regauge-production/preflight/
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: preflight
    if: ${{ inputs.phase == 'activate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: regauge-production
    concurrency:
      group: regauge-production
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ vars.FLY_ORG }}
      MENDPOINT_REGAUGE_TENANT_ID: ${{ secrets.MENDPOINT_REGAUGE_TENANT_ID }}
      MENDPOINT_REGAUGE_CAMPAIGN_ID: ${{ secrets.MENDPOINT_REGAUGE_CAMPAIGN_ID }}
      MENDPOINT_REGAUGE_CANARY_OWNER: ${{ vars.REGAUGE_CANARY_OWNER }}
      MENDPOINT_REGAUGE_CANARY_REPOSITORY: ${{ vars.REGAUGE_CANARY_REPOSITORY }}
      MENDPOINT_REGAUGE_CANARY_REPOSITORY_ID: ${{ vars.REGAUGE_CANARY_REPOSITORY_ID }}
      MENDPOINT_REGAUGE_CANARY_DEFAULT_BRANCH: ${{ vars.REGAUGE_CANARY_DEFAULT_BRANCH }}
      MENDPOINT_REGAUGE_CANARY_BRANCH: ${{ vars.REGAUGE_CANARY_BRANCH }}
      MENDPOINT_REGAUGE_CANARY_REVISION: ${{ vars.REGAUGE_CANARY_REVISION }}
      MENDPOINT_REGAUGE_GITHUB_INSTALLATION_ID: ${{ vars.REGAUGE_GITHUB_INSTALLATION_ID }}
      MENDPOINT_REGAUGE_REVIEWER_ISSUER: ${{ vars.REGAUGE_REVIEWER_ISSUER }}
      MENDPOINT_REGAUGE_REVIEWER_SUBJECT: ${{ vars.REGAUGE_REVIEWER_SUBJECT }}
      MENDPOINT_REGAUGE_REVIEWER_DISPLAY_NAME: ${{ vars.REGAUGE_REVIEWER_DISPLAY_NAME }}
      MENDPOINT_REGAUGE_COORDINATOR_TOKEN: ${{ secrets.MENDPOINT_REGAUGE_COORDINATOR_TOKEN }}
      MENDPOINT_REGAUGE_CHECKPOINT_KEY: ${{ secrets.MENDPOINT_REGAUGE_CHECKPOINT_KEY }}
      MENDPOINT_REGAUGE_OPERATION_SECRET: ${{ secrets.MENDPOINT_REGAUGE_OPERATION_SECRET }}
      MENDPOINT_APPLICATION_DATA_KEY: ${{ secrets.MENDPOINT_APPLICATION_DATA_KEY }}
      GITHUB_APP_ID: ${{ secrets.REGAUGE_GITHUB_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.REGAUGE_GITHUB_APP_PRIVATE_KEY }}
      GITHUB_WEBHOOK_SECRET: ${{ secrets.REGAUGE_GITHUB_WEBHOOK_SECRET }}
      GITHUB_APP_ACCOUNT_TENANT_BINDINGS: ${{ secrets.REGAUGE_GITHUB_APP_ACCOUNT_TENANT_BINDINGS }}
      OPENAI_API_KEY: ${{ secrets.REGAUGE_MODEL_API_KEY }}
      LLM_AGENT_URL: ${{ secrets.REGAUGE_MODEL_URL }}
      LLM_AGENT_MODEL: ${{ secrets.REGAUGE_MODEL_ID }}
      MENDPOINT_REGAUGE_ADAPTIVE_MODEL_PROVIDER: ${{ vars.REGAUGE_MODEL_PROVIDER }}
      MENDPOINT_REGAUGE_ADAPTIVE_MODEL_DEPLOYMENT: ${{ vars.REGAUGE_MODEL_DEPLOYMENT }}
      MENDPOINT_REGAUGE_ADAPTIVE_EXECUTION_REGION: ${{ vars.REGAUGE_MODEL_REGION }}
      MENDPOINT_REGAUGE_ADAPTIVE_MAX_DATA_CLASSIFICATION: ${{ vars.REGAUGE_MAX_DATA_CLASSIFICATION }}
      MENDPOINT_REGAUGE_LIVE_EVAL_MAX_USD: ${{ vars.REGAUGE_LIVE_EVAL_MAX_USD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MENDPOINT_AGENT_VERIFIER_GOVERNANCE_JSON: ${{ vars.REGAUGE_DEEPSEEK_GOVERNANCE_JSON }}
      MENDPOINT_AGENT_VERIFIER_PRICING_JSON: ${{ vars.REGAUGE_DEEPSEEK_PRICING_JSON }}
      MENDPOINT_REGAUGE_COORDINATOR_URL: https://mendpoint-regauge-production.fly.dev/
      MENDPOINT_RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: "0.4.79"
      - name: Install
        run: npm ci
      - name: Derive one-run production authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MENDPOINT_REGAUGE_TENANT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$ ]]
          [[ "$MENDPOINT_REGAUGE_CAMPAIGN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$ ]]
          [[ "$MENDPOINT_REGAUGE_CANARY_REPOSITORY_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$MENDPOINT_REGAUGE_CANARY_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          approval_ref="approval:regauge:${MENDPOINT_REGAUGE_TENANT_ID}:${MENDPOINT_REGAUGE_CAMPAIGN_ID}:repository:${MENDPOINT_REGAUGE_CANARY_REPOSITORY_ID}:revision:${MENDPOINT_REGAUGE_CANARY_REVISION}:draft:1:run:${GITHUB_RUN_ID}:attempt:${GITHUB_RUN_ATTEMPT}"
          evidence_ref="evidence:github:run:${GITHUB_RUN_ID}:attempt:${GITHUB_RUN_ATTEMPT}:revision:${GITHUB_SHA}"
          activation_expires_at="$(date -u -d '+70 minutes' '+%Y-%m-%dT%H:%M:%S.000Z')"
          gate="$(
            REGAUGE_RUN_APPROVAL="$approval_ref" \
            REGAUGE_RUN_EVIDENCE="$evidence_ref" \
            node --import tsx --input-type=module -e '
              import { serializePilotTransformerGateConfig } from "@mendpoint/ops";
              process.stdout.write(serializePilotTransformerGateConfig({
                tenantId: process.env.MENDPOINT_REGAUGE_TENANT_ID,
                environment: "production",
                boundaries: ["api_control_plane", "worker_action", "delivery"],
                acceptanceEvidenceRefs: [process.env.REGAUGE_RUN_EVIDENCE],
                productionDeliveryApprovalRefs: [process.env.REGAUGE_RUN_APPROVAL],
              }));
            '
          )"
          policy_envelope="$(jq -cn --arg tenant "$MENDPOINT_REGAUGE_TENANT_ID" '{
            policyEnvelopeId: "regauge-deepseek-v4-flash-advisory-20260824",
            tenantId: $tenant,
            version: 1,
            repositoryScope: [],
            branchScope: [],
            forbiddenZones: [],
            allowedTools: ["deepseek-verifier"],
            allowedModelClasses: ["rented_specialist"],
            externalProcessingAllowed: true,
            residency: "cn",
            riskCeiling: "high",
            reviewRequired: true,
            deploymentAllowed: false,
            trainingDataAllowed: false,
            retentionDays: 90,
            createdAt: "2026-08-24T00:00:00.000Z"
          }')"
          {
            echo "MENDPOINT_REGAUGE_PRODUCTION_APPROVAL_REF=$approval_ref"
            echo "MENDPOINT_REGAUGE_EVIDENCE_REFS=$approval_ref,$evidence_ref"
            echo "MENDPOINT_REGAUGE_GATE=$gate"
            echo "MENDPOINT_REGAUGE_ACTIVATION_EXPIRES_AT=$activation_expires_at"
            echo "MENDPOINT_REGAUGE_VERIFIER_POLICY_ENVELOPE_JSON=$policy_envelope"
            echo "MENDPOINT_REGAUGE_VERIFIER_CONSENT_EFFECTIVE_AT=2026-08-24T00:00:00.000Z"
            echo "MENDPOINT_REGAUGE_VERIFIER_CONSENT_EXPIRES_AT=2026-11-20T23:59:59.000Z"
          } >> "$GITHUB_ENV"
      - name: Validate exact authority before mutation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          LIVE_EVAL_REPETITIONS: ${{ inputs.live_eval_repetitions }}
          READINESS_SOAK_SECONDS: ${{ inputs.readiness_soak_seconds }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "REGAUGE_DRAFT_ONLY"
          test "$LIVE_EVAL_REPETITIONS" -ge 3
          test "$LIVE_EVAL_REPETITIONS" -le 10
          test "$READINESS_SOAK_SECONDS" -ge 60
          test "$READINESS_SOAK_SECONDS" -le 1800
          required=(
            FLY_API_TOKEN FLY_ORG MENDPOINT_REGAUGE_TENANT_ID MENDPOINT_REGAUGE_CAMPAIGN_ID
            MENDPOINT_REGAUGE_CANARY_OWNER MENDPOINT_REGAUGE_CANARY_REPOSITORY
            MENDPOINT_REGAUGE_CANARY_REPOSITORY_ID MENDPOINT_REGAUGE_CANARY_DEFAULT_BRANCH
            MENDPOINT_REGAUGE_CANARY_BRANCH MENDPOINT_REGAUGE_CANARY_REVISION
            MENDPOINT_REGAUGE_GITHUB_INSTALLATION_ID MENDPOINT_REGAUGE_REVIEWER_ISSUER
            MENDPOINT_REGAUGE_REVIEWER_SUBJECT MENDPOINT_REGAUGE_REVIEWER_DISPLAY_NAME
            MENDPOINT_REGAUGE_PRODUCTION_APPROVAL_REF
            MENDPOINT_REGAUGE_GATE MENDPOINT_REGAUGE_COORDINATOR_TOKEN MENDPOINT_REGAUGE_CHECKPOINT_KEY
            MENDPOINT_REGAUGE_OPERATION_SECRET
            MENDPOINT_APPLICATION_DATA_KEY
            MENDPOINT_REGAUGE_EVIDENCE_REFS MENDPOINT_REGAUGE_ACTIVATION_EXPIRES_AT
            GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY GITHUB_WEBHOOK_SECRET
            GITHUB_APP_ACCOUNT_TENANT_BINDINGS OPENAI_API_KEY LLM_AGENT_URL LLM_AGENT_MODEL
            MENDPOINT_REGAUGE_ADAPTIVE_MODEL_PROVIDER MENDPOINT_REGAUGE_ADAPTIVE_MODEL_DEPLOYMENT
            MENDPOINT_REGAUGE_ADAPTIVE_EXECUTION_REGION MENDPOINT_REGAUGE_ADAPTIVE_MAX_DATA_CLASSIFICATION
            MENDPOINT_REGAUGE_LIVE_EVAL_MAX_USD
            DEEPSEEK_API_KEY MENDPOINT_AGENT_VERIFIER_GOVERNANCE_JSON
            MENDPOINT_AGENT_VERIFIER_PRICING_JSON MENDPOINT_REGAUGE_VERIFIER_POLICY_ENVELOPE_JSON
            MENDPOINT_REGAUGE_VERIFIER_CONSENT_EFFECTIVE_AT MENDPOINT_REGAUGE_VERIFIER_CONSENT_EXPIRES_AT
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "Missing required Regauge production authority: $name"; exit 1; }
          done
          jq -e --arg tenant "$MENDPOINT_REGAUGE_TENANT_ID" '
            .schemaVersion == "2026-08-17.v1"
            and ([.entries[] | select(.tenantId == $tenant and (.products | index("regauge")))] | length) == 1
            and ([.entries[] | select(.tenantId == $tenant and (.products | index("regauge")))][0]
              | .externalModelAllowed == true and .mayLeaveTenantBoundary == true and .consentActive == true)
          ' <<<"$MENDPOINT_AGENT_VERIFIER_GOVERNANCE_JSON" >/dev/null \
            || { echo "regauge_deepseek_governance_not_authorized"; exit 1; }
          mkdir -p test-results/regauge-production
      - name: Verify dedicated app and coordinator volume
        shell: bash
        run: |
          set -euo pipefail
          flyctl status --app mendpoint-regauge-production >/dev/null 2>&1 \
            || { echo "regauge_fly_app_bootstrap_required"; exit 1; }
          volume_json="$(flyctl volumes list --app mendpoint-regauge-production --json \
            | jq -ce '[.[] | select(
                .name == "mendpoint_regauge_production_data"
                and .state == "created"
                and .size_gb == 20
                and .region == "sjc"
                and .zone == "b376"
                and .encrypted == true
                and .snapshot_retention == 14
                and .auto_backup_enabled == true
                and .host_status == "ok"
              )] | if length == 1 then .[0] else error("regauge_fly_volume_authority_invalid") end')" \
            || { echo "regauge_fly_volume_authority_invalid"; exit 1; }
          printf '%s\n' "$volume_json" > test-results/regauge-production/coordinator-volume.json
          attached_machine_id="$(jq -r '.attached_machine_id // empty' <<<"$volume_json")"
          if [[ -n "$attached_machine_id" ]]; then
            flyctl machines list --app mendpoint-regauge-production --json \
              | jq -e --arg machine_id "$attached_machine_id" \
                '[.[] | select(
                  .id == $machine_id
                  and .config.metadata.fly_process_group == "coordinator"
                )] | if length == 1 then .[0] else error("regauge_fly_volume_attachment_invalid") end' \
              > test-results/regauge-production/coordinator-volume-machine.json \
              || { echo "regauge_fly_volume_attachment_invalid"; exit 1; }
          else
            printf '{"attached":false}\n' > test-results/regauge-production/coordinator-volume-machine.json
          fi
      - name: Verify private checkpoint storage
        shell: bash
        run: |
          set -euo pipefail
          storage_secrets="$(flyctl secrets list --app mendpoint-regauge-production --json)"
          for name in AWS_ENDPOINT_URL_S3 AWS_REGION BUCKET_NAME AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            jq -e --arg name "$name" \
              '.[] | select(.name == $name and (.status == "Staged" or .status == "Deployed"))' \
              <<<"$storage_secrets" >/dev/null \
              || { echo "regauge_storage_bootstrap_required:$name"; exit 1; }
          done
      - name: Stage production secrets
        shell: bash
        run: |
          set -euo pipefail
          executor_digest="sha256:$(printf '%s' "$GITHUB_SHA" | sha256sum | cut -d' ' -f1)"
          flyctl secrets set --stage --app mendpoint-regauge-production \
            MENDPOINT_REGAUGE_TENANT_ID="$MENDPOINT_REGAUGE_TENANT_ID" \
            MENDPOINT_REGAUGE_CAMPAIGN_ID="$MENDPOINT_REGAUGE_CAMPAIGN_ID" \
            MENDPOINT_REGAUGE_ENVIRONMENT=production \
            MENDPOINT_REGAUGE_GATE="$MENDPOINT_REGAUGE_GATE" \
            MENDPOINT_REGAUGE_COORDINATOR_TOKEN="$MENDPOINT_REGAUGE_COORDINATOR_TOKEN" \
            MENDPOINT_REGAUGE_CHECKPOINT_KEY="$MENDPOINT_REGAUGE_CHECKPOINT_KEY" \
            MENDPOINT_REGAUGE_OPERATION_SECRET="$MENDPOINT_REGAUGE_OPERATION_SECRET" \
            MENDPOINT_APPLICATION_DATA_KEY="$MENDPOINT_APPLICATION_DATA_KEY" \
            MENDPOINT_REGAUGE_S3_PREFIX="regauge/$MENDPOINT_REGAUGE_TENANT_ID/$MENDPOINT_REGAUGE_CAMPAIGN_ID" \
            MENDPOINT_REGAUGE_EXECUTOR_DIGEST="$executor_digest" \
            MENDPOINT_REGAUGE_EVIDENCE_REFS="$MENDPOINT_REGAUGE_EVIDENCE_REFS" \
            MENDPOINT_REGAUGE_CANARY_OWNER="$MENDPOINT_REGAUGE_CANARY_OWNER" \
            MENDPOINT_REGAUGE_CANARY_REPOSITORY="$MENDPOINT_REGAUGE_CANARY_REPOSITORY" \
            MENDPOINT_REGAUGE_CANARY_REPOSITORY_ID="$MENDPOINT_REGAUGE_CANARY_REPOSITORY_ID" \
            MENDPOINT_REGAUGE_CANARY_DEFAULT_BRANCH="$MENDPOINT_REGAUGE_CANARY_DEFAULT_BRANCH" \
            MENDPOINT_REGAUGE_CANARY_BRANCH="$MENDPOINT_REGAUGE_CANARY_BRANCH" \
            MENDPOINT_REGAUGE_CANARY_REVISION="$MENDPOINT_REGAUGE_CANARY_REVISION" \
            MENDPOINT_REGAUGE_GITHUB_INSTALLATION_ID="$MENDPOINT_REGAUGE_GITHUB_INSTALLATION_ID" \
            MENDPOINT_REGAUGE_REVIEWER_ISSUER="$MENDPOINT_REGAUGE_REVIEWER_ISSUER" \
            MENDPOINT_REGAUGE_REVIEWER_SUBJECT="$MENDPOINT_REGAUGE_REVIEWER_SUBJECT" \
            MENDPOINT_REGAUGE_REVIEWER_DISPLAY_NAME="$MENDPOINT_REGAUGE_REVIEWER_DISPLAY_NAME" \
            MENDPOINT_REGAUGE_PRODUCTION_APPROVAL_REF="$MENDPOINT_REGAUGE_PRODUCTION_APPROVAL_REF" \
            MENDPOINT_REGAUGE_ACTIVATION_EXPIRES_AT="$MENDPOINT_REGAUGE_ACTIVATION_EXPIRES_AT" \
            MENDPOINT_REGAUGE_ADAPTIVE_MODEL_SOURCE_ENABLED=1 \
            MENDPOINT_REGAUGE_ADAPTIVE_MODEL_SOURCE_TENANTS="$MENDPOINT_REGAUGE_TENANT_ID" \
            MENDPOINT_REGAUGE_ADAPTIVE_MODEL_PROVIDER="$MENDPOINT_REGAUGE_ADAPTIVE_MODEL_PROVIDER" \
            MENDPOINT_REGAUGE_ADAPTIVE_MODEL_DEPLOYMENT="$MENDPOINT_REGAUGE_ADAPTIVE_MODEL_DEPLOYMENT" \
            MENDPOINT_REGAUGE_ADAPTIVE_EXTERNAL_PROCESSING_APPROVED=1 \
            MENDPOINT_REGAUGE_ADAPTIVE_EXECUTION_REGION="$MENDPOINT_REGAUGE_ADAPTIVE_EXECUTION_REGION" \
            MENDPOINT_REGAUGE_ADAPTIVE_MAX_DATA_CLASSIFICATION="$MENDPOINT_REGAUGE_ADAPTIVE_MAX_DATA_CLASSIFICATION" \
            LLM_AGENT_URL="$LLM_AGENT_URL" \
            LLM_AGENT_MODEL="$LLM_AGENT_MODEL" \
            OPENAI_API_KEY="$OPENAI_API_KEY" \
            DEEPSEEK_VERIFIER_ENABLED=true \
            DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" \
            MENDPOINT_AGENT_VERIFIER_ROLLOUT_MODE=advisory \
            MENDPOINT_AGENT_VERIFIER_SCORING_MODE=nonthinking_logprobs \
            MENDPOINT_AGENT_VERIFIER_EVALUATIONS=1 \
            MENDPOINT_AGENT_VERIFIER_PIVOTS=1 \
            MENDPOINT_AGENT_VERIFIER_MAXIMUM_CANDIDATES=1 \
            MENDPOINT_AGENT_VERIFIER_MAXIMUM_COST_USD=0.05 \
            MENDPOINT_AGENT_VERIFIER_TIMEOUT_MS=8000 \
            MENDPOINT_AGENT_VERIFIER_MAXIMUM_RETRIES=0 \
            MENDPOINT_AGENT_VERIFIER_GOVERNANCE_JSON="$MENDPOINT_AGENT_VERIFIER_GOVERNANCE_JSON" \
            MENDPOINT_AGENT_VERIFIER_PRICING_JSON="$MENDPOINT_AGENT_VERIFIER_PRICING_JSON" \
            MENDPOINT_REGAUGE_VERIFIER_POLICY_ENVELOPE_JSON="$MENDPOINT_REGAUGE_VERIFIER_POLICY_ENVELOPE_JSON" \
            MENDPOINT_REGAUGE_VERIFIER_CONSENT_EFFECTIVE_AT="$MENDPOINT_REGAUGE_VERIFIER_CONSENT_EFFECTIVE_AT" \
            MENDPOINT_REGAUGE_VERIFIER_CONSENT_EXPIRES_AT="$MENDPOINT_REGAUGE_VERIFIER_CONSENT_EXPIRES_AT" \
            GITHUB_APP_ID="$GITHUB_APP_ID" \
            GITHUB_APP_PRIVATE_KEY="$GITHUB_APP_PRIVATE_KEY" \
            GITHUB_WEBHOOK_SECRET="$GITHUB_WEBHOOK_SECRET" \
            GITHUB_APP_ACCOUNT_TENANT_BINDINGS="$GITHUB_APP_ACCOUNT_TENANT_BINDINGS"
      - name: Deploy coordinator
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if output="$(flyctl deploy --remote-only --ha=false --app mendpoint-regauge-production \
              --config fly.regauge.toml --env MENDPOINT_RELEASE_REVISION=${{ github.sha }} \
              --process-groups coordinator 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            fi
            printf '%s\n' "$output" >&2
            grep -q "insufficient resources to create new machine with existing volume" <<<"$output" \
              || exit 1
            test "$attempt" -lt 3
            sleep 15
          done
      - name: Verify coordinator revision and health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            revision="$(curl --fail --silent --max-time 10 https://mendpoint-regauge-production.fly.dev/version | jq -r '.revision')" || true
            ready="$(curl --fail --silent --max-time 10 https://mendpoint-regauge-production.fly.dev/ready | jq -r '.status')" || true
            if test "$revision" = "$GITHUB_SHA" && test "$ready" = "ok"; then exit 0; fi
            test "$attempt" -lt 60
            sleep 2
          done
      - name: Deploy worker
        run: >-
          flyctl deploy --remote-only --ha=false --app mendpoint-regauge-production
          --config fly.regauge.toml --env MENDPOINT_RELEASE_REVISION=${{ github.sha }}
          --process-groups worker
      - name: Verify exact deployed revision and process health
        shell: bash
        run: |
          set -euo pipefail
          flyctl status --app mendpoint-regauge-production --json | tee test-results/regauge-production/fly-status.json
          flyctl scale count coordinator=1 worker=1 --app mendpoint-regauge-production --yes
          for attempt in {1..60}; do
            revision="$(curl --fail --silent --max-time 10 https://mendpoint-regauge-production.fly.dev/version | jq -r '.revision')" || true
            ready="$(curl --fail --silent --max-time 10 https://mendpoint-regauge-production.fly.dev/ready | jq -r '.status')" || true
            if test "$revision" = "$GITHUB_SHA" && test "$ready" = "ok"; then break; fi
            test "$attempt" -lt 60
            sleep 2
          done
          flyctl checks list --app mendpoint-regauge-production | tee test-results/regauge-production/fly-checks.txt
      - name: Run budget bounded live Regauge evaluation
        env:
          MENDPOINT_EVAL_LIVE_REGAUGE: "1"
          MENDPOINT_REGAUGE_LIVE_EVAL_TENANT: ${{ secrets.MENDPOINT_REGAUGE_TENANT_ID }}
          MENDPOINT_REGAUGE_ADAPTIVE_MODEL_SOURCE_ENABLED: "1"
          MENDPOINT_REGAUGE_ADAPTIVE_MODEL_SOURCE_TENANTS: ${{ secrets.MENDPOINT_REGAUGE_TENANT_ID }}
          MENDPOINT_REGAUGE_ADAPTIVE_EXTERNAL_PROCESSING_APPROVED: "1"
        run: >-
          npm run eval:agents:live -- --product=transformer
          --repetitions=${{ inputs.live_eval_repetitions }}
          --output=test-results/regauge-production/live-model.json
      - name: Wait for exact real draft canary
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if npm run regauge:production:proof -- \
              --mode=draft-canary \
              --output=test-results/regauge-production/draft-canary.json; then
              exit 0
            fi
            rm -f test-results/regauge-production/draft-canary.json
            test "$attempt" -lt 60
            sleep 10
          done
      - name: Wait for durable DeepSeek advisory evidence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if npm run regauge:production:proof -- \
              --mode=verifier-evidence \
              --output=test-results/regauge-production/verifier-evidence.json; then
              exit 0
            fi
            rm -f test-results/regauge-production/verifier-evidence.json
            test "$attempt" -lt 60
            sleep 10
          done
      - name: Run read only production readiness soak
        run: >-
          npm run regauge:production:proof -- --mode=readiness-soak
          --duration-seconds=${{ inputs.readiness_soak_seconds }} --interval-seconds=10
          --output=test-results/regauge-production/readiness-soak.json
      - name: Preserve continuous production after activation
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/regauge-production
          flyctl scale count coordinator=1 worker=1 --app mendpoint-regauge-production --yes
          machines="$(flyctl machines list --app mendpoint-regauge-production --json)"
          continuous="$(jq -e '
            ([.[] | select(.config.metadata.fly_process_group == "coordinator" and .state == "started")] | length) == 1
            and ([.[] | select(.config.metadata.fly_process_group == "worker" and .state == "started")] | length) == 1
          ' <<<"$machines")"
          jq -n \
            --argjson continuousProduction "$continuous" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg revision "$GITHUB_SHA" \
            '{continuousProduction: $continuousProduction, runId: $runId, runAttempt: $runAttempt, revision: $revision}' \
            > test-results/regauge-production/continuous-production.json
      - name: Upload Regauge production evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: regauge-production-evidence-${{ github.sha }}
          path: test-results/regauge-production/
          if-no-files-found: error
          retention-days: 90
