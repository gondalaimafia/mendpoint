            fi
            test "$attempt" -lt 60
            sleep 2
          done
          coordinator_id="$(jq -er '.coordinator.machineId' test-results/regauge-production/runtime-identity.json)"
          established_worker_id="$(jq -er '.worker.machineId' test-results/regauge-production/runtime-identity.json)"
          test "$established_worker_id" = "$worker_id"
          printf '%s\n' "$coordinator_id" > test-results/regauge-production/coordinator-id.txt
          for attempt in {1..60}; do
            version_json="$(curl --fail --silent --max-time 10 https://mendpoint-regauge-production.fly.dev/version)" || true
            ready_json="$(curl --fail --silent --max-time 10 https://mendpoint-regauge-production.fly.dev/ready)" || true
            if jq -e --arg revision "$GITHUB_SHA" '.revision == $revision and .product == "Regauge"' \
                <<<"$version_json" >/dev/null \
              && jq -e '.status == "ok" and .release.product == "Regauge"' \
                <<<"$ready_json" >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 2
          done
          flyctl checks list --app mendpoint-regauge-production | tee test-results/regauge-production/fly-checks.txt
      - name: Run budget bounded live Regauge evaluation
        env:
          MENDPOINT_EVAL_LIVE_REGAUGE: "1"
          MENDPOINT_REGAUGE_LIVE_EVAL_TENANT: ${{ secrets.MENDPOINT_REGAUGE_TENANT_ID }}
          MENDPOINT_REGAUGE_ADAPTIVE_MODEL_SOURCE_ENABLED: "1"
          MENDPOINT_REGAUGE_ADAPTIVE_MODEL_SOURCE_TENANTS: ${{ secrets.MENDPOINT_REGAUGE_TENANT_ID }}
          MENDPOINT_REGAUGE_ADAPTIVE_EXTERNAL_PROCESSING_APPROVED: "1"
        shell: bash
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          remaining_seconds="$((MENDPOINT_REGAUGE_ACTIVATION_DEADLINE_EPOCH - now_epoch))"
          required_seconds="$((1200 + 150 + 150 + ${{ inputs.readiness_soak_seconds }} + 300))"
          test "$remaining_seconds" -ge "$required_seconds" \
            || { echo "regauge_activation_budget_insufficient"; exit 1; }
          timeout --kill-after=30s 1200s npm run eval:agents:live -- --product=transformer \
            --repetitions=${{ inputs.live_eval_repetitions }} \
            --output=test-results/regauge-production/live-model.json
      - name: Wait for exact real draft canary
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if npm run regauge:production:proof -- \
              --mode=draft-canary \
              --output=test-results/regauge-production/draft-canary.json; then
              exit 0
            fi
            rm -f test-results/regauge-production/draft-canary.json
            test "$attempt" -lt 30
            sleep 5
          done
      - name: Wait for durable DeepSeek advisory evidence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if npm run regauge:production:proof -- \
              --mode=verifier-evidence \
              --output=test-results/regauge-production/verifier-evidence.json; then
              exit 0
            fi
            rm -f test-results/regauge-production/verifier-evidence.json
            test "$attempt" -lt 30
            sleep 5
          done
      - name: Run read only production readiness soak
        shell: bash
        run: |
          set -euo pipefail
          duration_seconds="${{ inputs.readiness_soak_seconds }}"
          test "$(date -u +%s)" -lt "$MENDPOINT_REGAUGE_ACTIVATION_DEADLINE_EPOCH"
          test "$((MENDPOINT_REGAUGE_ACTIVATION_DEADLINE_EPOCH - $(date -u +%s)))" \
            -ge "$((duration_seconds + 300))"
          interval_seconds=10
          volume_id="$(jq -r '.id' test-results/regauge-production/coordinator-volume.json)"
          coordinator_id="$(cat test-results/regauge-production/coordinator-id.txt)"
          worker_id="$(cat test-results/regauge-production/worker-id.txt)"
          test -n "$volume_id"
          test -n "$coordinator_id"
          test -n "$worker_id"
          mkdir -p test-results/regauge-production/runtime-soak-samples

          runtime_soak() {
            local started_epoch deadline_epoch sample failures now_epoch remaining_seconds sleep_seconds sample_path validated_path
            started_epoch="$(date +%s)"
            deadline_epoch="$((started_epoch + duration_seconds))"
            sample=0
            failures=0
            while [[ "$(date +%s)" -lt "$deadline_epoch" ]]; do
              sample="$((sample + 1))"
              sample_path="test-results/regauge-production/runtime-soak-samples/${sample}.json"
              validated_path="test-results/regauge-production/runtime-soak-samples/${sample}-validated.json"
              if ! timeout --kill-after=2s 15s flyctl machines list \
                --app mendpoint-regauge-production --json > "$sample_path"; then
                failures="$((failures + 1))"
                break
              fi
              if ! npm run regauge:production:proof -- \
                --mode=machine-continuity \
                --input="$sample_path" \
                --expected=test-results/regauge-production/runtime-identity.json \
                --output="$validated_path"; then
                failures="$((failures + 1))"
                break
              fi
              now_epoch="$(date +%s)"
              remaining_seconds="$((deadline_epoch - now_epoch))"
              if [[ "$remaining_seconds" -gt 0 ]]; then
                sleep_seconds="$interval_seconds"
                if [[ "$remaining_seconds" -lt "$sleep_seconds" ]]; then
                  sleep_seconds="$remaining_seconds"
                fi
                sleep "$sleep_seconds"
              fi
            done
            jq -n --argjson samples "$sample" --argjson failures "$failures" \
              --arg coordinatorId "$coordinator_id" --arg workerId "$worker_id" \
              --arg volumeId "$volume_id" --arg revision "$GITHUB_SHA" \
              '{passed: ($failures == 0 and $samples > 0), samples: $samples, failures: $failures,
                coordinatorId: $coordinatorId, workerId: $workerId, volumeId: $volumeId,
                revision: $revision, workerCheck: "passing"}' \
              > test-results/regauge-production/runtime-soak.json
            test "$failures" -eq 0
            test "$sample" -gt 0
          }

          runtime_soak &
          runtime_soak_pid="$!"
          set +e
          npm run regauge:production:proof -- --mode=readiness-soak \
            --duration-seconds="$duration_seconds" --interval-seconds="$interval_seconds" \
            --output=test-results/regauge-production/readiness-soak.json
          coordinator_soak_status="$?"
          wait "$runtime_soak_pid"
          runtime_soak_status="$?"
          set -e
          test "$coordinator_soak_status" -eq 0
          test "$runtime_soak_status" -eq 0
      - name: Preserve continuous internal production activation
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/regauge-production
          volume_id="$(jq -r '.id' test-results/regauge-production/coordinator-volume.json)"
          coordinator_id="$(cat test-results/regauge-production/coordinator-id.txt)"
          worker_id="$(cat test-results/regauge-production/worker-id.txt)"
          timeout --kill-after=2s 15s flyctl machines list --app mendpoint-regauge-production --json \
            > test-results/regauge-production/continuous-production-machines.json
          npm run regauge:production:proof -- \
            --mode=machine-continuity \
            --input=test-results/regauge-production/continuous-production-machines.json \
            --expected=test-results/regauge-production/runtime-identity.json \
            --output=test-results/regauge-production/continuous-machine-proof.json
          version_json="$(curl --fail --silent --max-time 10 https://mendpoint-regauge-production.fly.dev/version)"
          ready_json="$(curl --fail --silent --max-time 10 https://mendpoint-regauge-production.fly.dev/ready)"
          jq -e --arg revision "$GITHUB_SHA" '
            .revision == $revision
            and .product == "Regauge"
            and .channel == "internal"
            and ([.features[] | select(.id == "transformer_bsg_campaigns" and .tier == "experimental" and .enabled == true)] | length) == 1
          ' <<<"$version_json" >/dev/null
          jq -e '
            .status == "ok"
            and .release.product == "Regauge"
            and .release.channel == "internal"
            and ([.features[] | select(.id == "transformer_bsg_campaigns" and .tier == "experimental" and .enabled == true)] | length) == 1
          ' <<<"$ready_json" >/dev/null
          runtime_soak_samples="$(jq -r '.samples' test-results/regauge-production/runtime-soak.json)"
          jq -n \
            --argjson runtimeSoakSamples "$runtime_soak_samples" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg revision "$GITHUB_SHA" \
            --arg coordinatorId "$coordinator_id" \
            --arg workerId "$worker_id" \
            --arg volumeId "$volume_id" \
            '{continuousInternalActivation: true, availability: "internal", featureTier: "experimental",
              runId: $runId, runAttempt: $runAttempt,
              revision: $revision, coordinatorId: $coordinatorId, workerId: $workerId,
              volumeId: $volumeId, workerCheck: "passing", runtimeSoakSamples: $runtimeSoakSamples}' \
            > test-results/regauge-production/continuous-internal-activation.json
      - name: Capture worker failure diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
