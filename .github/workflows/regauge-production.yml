              | select(
                  .config.metadata.fly_process_group == "worker"
                  and .config.env.MENDPOINT_RELEASE_REVISION == env.GITHUB_SHA
                )
              | .id]
            | unique
            | .[0:4][]
          ' test-results/regauge-production/worker-failure-machines.json)
          for machine_id in "${worker_ids[@]}"; do
            (timeout --kill-after=2s 10s flyctl logs --app mendpoint-regauge-production \
              --machine "$machine_id" --no-tail \
              > "test-results/regauge-production/worker-${machine_id}.log" 2>&1 || true) &
          done
          wait || true
      - name: Contain target after activation failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/regauge-production
          machines="$(flyctl machines list --app mendpoint-regauge-production --json)"
          mutation_markers="$(jq --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '[.[] | select(
            (.config.metadata.fly_process_group == "coordinator"
              and .config.env.MENDPOINT_REGAUGE_COORDINATOR_ACTIVATION_RUN_ID == $run
              and .config.env.MENDPOINT_REGAUGE_COORDINATOR_ACTIVATION_RUN_ATTEMPT == $attempt)
            or (.config.metadata.fly_process_group == "worker"
              and ((.config.env.MENDPOINT_REGAUGE_QUIESCE_RUN_ID == $run
                and .config.env.MENDPOINT_REGAUGE_QUIESCE_RUN_ATTEMPT == $attempt)
                or (.config.env.MENDPOINT_REGAUGE_ACTIVATION_RUN_ID == $run
                  and .config.env.MENDPOINT_REGAUGE_ACTIVATION_RUN_ATTEMPT == $attempt)))
          )] | length' <<<"$machines")"
          stop_failures=0
          containment_verified=false
          workers_found=0
          if [[ "$mutation_markers" == "0" ]]; then
            containment_verified=true
          else
            for attempt in {1..30}; do
              machines="$(flyctl machines list --app mendpoint-regauge-production --json)"
              mapfile -t unsafe_worker_ids < <(jq -r '.[] | select(
                .config.metadata.fly_process_group == "worker"
                and .state != "stopped" and .state != "destroyed"
              ) | .id' <<<"$machines")
              workers_found="$((workers_found + ${#unsafe_worker_ids[@]}))"
              if [[ "${#unsafe_worker_ids[@]}" == "0" ]]; then
                containment_verified=true
                break
              fi
              for machine_id in "${unsafe_worker_ids[@]}"; do
                if ! timeout --kill-after=5s 60s flyctl machine stop "$machine_id" \
                  --app mendpoint-regauge-production; then
                  stop_failures="$((stop_failures + 1))"
                fi
              done
              test "$attempt" -lt 30
              sleep 2
            done
          fi
          test "$containment_verified" = true
          remaining_unsafe_workers="$(flyctl machines list --app mendpoint-regauge-production --json \
            | jq '[.[] | select(.config.metadata.fly_process_group == "worker"
              and .state != "stopped" and .state != "destroyed")] | length')"
          if [[ "$mutation_markers" != "0" ]]; then test "$remaining_unsafe_workers" = "0"; fi
          jq -n \
            --argjson mutationMarkers "$mutation_markers" \
            --argjson workersFound "$workers_found" \
            --argjson stopFailures "$stop_failures" \
            --argjson remainingUnsafeWorkers "$remaining_unsafe_workers" \
            '{contained: ($mutationMarkers > 0), noOwnedMutation: ($mutationMarkers == 0),
              mutationMarkers: $mutationMarkers, workersFound: $workersFound,
              stopFailures: $stopFailures, remainingUnsafeWorkers: $remainingUnsafeWorkers}' \
            > test-results/regauge-production/failure-containment.json
      - name: Upload Regauge production evidence
        id: evidence_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: regauge-production-evidence-${{ github.sha }}
          path: test-results/regauge-production/
          if-no-files-found: error
          retention-days: 90
      - name: Contain target after evidence publication failure
        if: ${{ steps.evidence_upload.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          containment_verified=false
          for attempt in {1..30}; do
            machines="$(flyctl machines list --app mendpoint-regauge-production --json)"
            mapfile -t unsafe_worker_ids < <(jq -r '.[] | select(
              .config.metadata.fly_process_group == "worker"
              and .state != "stopped" and .state != "destroyed"
            ) | .id' <<<"$machines")
            if [[ "${#unsafe_worker_ids[@]}" == "0" ]]; then
              containment_verified=true
              break
            fi
            for machine_id in "${unsafe_worker_ids[@]}"; do
              if ! timeout --kill-after=5s 60s flyctl machine stop "$machine_id" \
                --app mendpoint-regauge-production; then
                printf 'worker stop retry required: %s\n' "$machine_id" >&2
              fi
            done
            test "$attempt" -lt 30
            sleep 2
          done
          test "$containment_verified" = true
          remaining_unsafe_workers="$(flyctl machines list --app mendpoint-regauge-production --json \
            | jq '[.[] | select(.config.metadata.fly_process_group == "worker"
              and .state != "stopped" and .state != "destroyed")] | length')"
          test "$remaining_unsafe_workers" = "0"
      - name: Enforce production evidence publication
        if: ${{ steps.evidence_upload.outcome == 'failure' }}
        run: exit 1

  cleanup:
    needs: [preflight, deploy]
    if: ${{ always() && needs.deploy.result != 'success' && needs.deploy.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: "0.4.79"
      - name: Download pre-mutation topology
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: regauge-fly-preflight-${{ github.sha }}
          path: test-results/regauge-production/preflight/
      - name: Restore or contain the exact activation worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/regauge-cleanup
          snapshot="test-results/regauge-production/preflight/pre-mutation-machines.json"
          test -s "$snapshot"
          live="test-results/regauge-cleanup/live-machines.json"
          flyctl machines list --app mendpoint-regauge-production --json > "$live"
          prior_coordinator="$(jq -cS '
            .[] | select(.config.metadata.fly_process_group == "coordinator")
            | {id, config, image: (.image_ref | "\(.registry)/\(.repository)@\(.digest)")}
          ' "$snapshot")"
          live_coordinator="$(jq -cS '
            .[] | select(.config.metadata.fly_process_group == "coordinator")
            | {id, config, image: (.image_ref | "\(.registry)/\(.repository)@\(.digest)")}
          ' "$live")"
          worker_id="$(jq -er '.[] | select(.config.metadata.fly_process_group == "worker") | .id' "$snapshot")"
          prior_state="$(jq -er '.[] | select(.config.metadata.fly_process_group == "worker") | .state' "$snapshot")"
          quiesce_markers="$(jq --arg id "$worker_id" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" '[.[] | select(
              .id == $id
              and .config.metadata.fly_process_group == "worker"
              and .config.env.MENDPOINT_REGAUGE_QUIESCE_RUN_ID == $run
              and .config.env.MENDPOINT_REGAUGE_QUIESCE_RUN_ATTEMPT == $attempt
            )] | length' "$live")"
          if [[ "$live_coordinator" == "$prior_coordinator" ]]; then
            if [[ "$quiesce_markers" == "1" ]]; then
              jq -c --arg id "$worker_id" '
                .[] | select(.id == $id)
                | (.image_ref | "\(.registry)/\(.repository)@\(.digest)") as $image
                | (.config + {image: $image})
              ' "$snapshot" > test-results/regauge-cleanup/prior-worker-config.json
              flyctl machine update "$worker_id" --app mendpoint-regauge-production \
                --machine-config test-results/regauge-cleanup/prior-worker-config.json \
                --skip-health-checks --yes
              restored_state="$(flyctl machines list --app mendpoint-regauge-production --json \
                | jq -er --arg id "$worker_id" '.[] | select(.id == $id) | .state')"
              if [[ "$prior_state" == "started" && "$restored_state" != "started" ]]; then
                flyctl machine start "$worker_id" --app mendpoint-regauge-production
              elif [[ "$prior_state" == "stopped" && "$restored_state" != "stopped" ]]; then
                flyctl machine stop "$worker_id" --app mendpoint-regauge-production
              fi
              action="restored_prior_worker"
            elif [[ "$quiesce_markers" == "0" ]]; then
              action="no_owned_mutation"
            else
              echo "regauge_cleanup_quiesce_marker_ambiguous" >&2
              exit 1
            fi
          else
            action="contained_all_workers_after_coordinator_commit"
          fi
          prior_worker="$(jq -cS --arg id "$worker_id" '
            .[] | select(.id == $id)
            | {id, state, config, image: (.image_ref | "\(.registry)/\(.repository)@\(.digest)")}
          ' "$snapshot")"
          cleanup_verified=false
          stop_failures=0
          for attempt in {1..30}; do
            after="$(flyctl machines list --app mendpoint-regauge-production --json)"
            printf '%s\n' "$after" > test-results/regauge-cleanup/after-machines.json
            if [[ "$action" == "restored_prior_worker" ]]; then
              after_coordinator="$(jq -cS '
                .[] | select(.config.metadata.fly_process_group == "coordinator")
                | {id, config, image: (.image_ref | "\(.registry)/\(.repository)@\(.digest)")}
              ' <<<"$after")"
              after_worker="$(jq -cS --arg id "$worker_id" '
                .[] | select(.id == $id)
                | {id, state, config, image: (.image_ref | "\(.registry)/\(.repository)@\(.digest)")}
              ' <<<"$after")"
              if [[ "$after_coordinator" == "$prior_coordinator" && "$after_worker" == "$prior_worker" ]]; then
                cleanup_verified=true
                break
              fi
            elif [[ "$action" == "no_owned_mutation" ]]; then
              if jq -e --slurpfile expected "$snapshot" '
                ([.[] | {id, instance_id, state, config, image_ref}] | sort_by(.id))
                == ([$expected[0][] | {id, instance_id, state, config, image_ref}] | sort_by(.id))
              ' <<<"$after" >/dev/null; then
                cleanup_verified=true
                break
              fi
            else
              mapfile -t unsafe_worker_ids < <(jq -r '.[] | select(
                .config.metadata.fly_process_group == "worker"
                and .state != "stopped" and .state != "destroyed"
              ) | .id' <<<"$after")
              if [[ "${#unsafe_worker_ids[@]}" == "0" ]]; then
                cleanup_verified=true
                break
              fi
              for unsafe_worker_id in "${unsafe_worker_ids[@]}"; do
                if ! timeout --kill-after=5s 60s flyctl machine stop "$unsafe_worker_id" \
                  --app mendpoint-regauge-production; then
                  stop_failures="$((stop_failures + 1))"
                fi
              done
            fi
            test "$attempt" -lt 30
            sleep 2
          done
          jq -n --arg action "$action" --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" --argjson verified "$cleanup_verified" \
            --argjson stopFailures "$stop_failures" \
            '{action: $action, runId: $runId, runAttempt: $runAttempt,
              verified: $verified, stopFailures: $stopFailures}' \
            > test-results/regauge-cleanup/result.json
          test "$cleanup_verified" = true
      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: regauge-cleanup-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/regauge-cleanup/
          if-no-files-found: error
          retention-days: 90
