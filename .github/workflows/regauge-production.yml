          if ! timeout --kill-after=2s 15s flyctl machines list --app mendpoint-regauge-production --json \
            > test-results/regauge-production/worker-failure-machines.json; then
            printf '[]\n' > test-results/regauge-production/worker-failure-machines.json
          fi
          timeout --kill-after=2s 10s flyctl checks list --app mendpoint-regauge-production \
            > test-results/regauge-production/worker-failure-checks.txt 2>&1 || true
          mapfile -t worker_ids < <(jq -r '
