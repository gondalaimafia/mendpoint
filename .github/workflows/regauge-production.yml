      - name: Deploy coordinator
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if output="$(flyctl deploy --remote-only --ha=false --app mendpoint-regauge-production \
              --config fly.regauge.toml --env MENDPOINT_RELEASE_REVISION=${{ github.sha }} \
              --env MENDPOINT_REGAUGE_COORDINATOR_ACTIVATION_RUN_ID="$GITHUB_RUN_ID" \
              --env MENDPOINT_REGAUGE_COORDINATOR_ACTIVATION_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              --process-groups coordinator 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            fi
            printf '%s\n' "$output" >&2
            grep -q "insufficient resources to create new machine with existing volume" <<<"$output" \
              || exit 1
            test "$attempt" -lt 3
            sleep 15
          done
      - name: Verify coordinator revision and health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            version_json="$(curl --fail --silent --max-time 10 https://mendpoint-regauge-production.fly.dev/version)" || true
            ready_json="$(curl --fail --silent --max-time 10 https://mendpoint-regauge-production.fly.dev/ready)" || true
            if jq -e --arg revision "$GITHUB_SHA" '
                .revision == $revision
                and .product == "Regauge"
                and .channel == "internal"
                and ([.features[] | select(.id == "transformer_bsg_campaigns" and .tier == "experimental" and .enabled == true)] | length) == 1
              ' <<<"$version_json" >/dev/null \
              && jq -e '
                .status == "ok"
                and .release.product == "Regauge"
                and .release.channel == "internal"
                and ([.features[] | select(.id == "transformer_bsg_campaigns" and .tier == "experimental" and .enabled == true)] | length) == 1
              ' <<<"$ready_json" >/dev/null; then exit 0; fi
            test "$attempt" -lt 60
            sleep 2
          done
      - name: Deploy worker
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy --remote-only --ha=false --app mendpoint-regauge-production \
            --config fly.regauge.toml --env MENDPOINT_RELEASE_REVISION=${{ github.sha }} \
            --env MENDPOINT_REGAUGE_ACTIVATION_RUN_ID="$GITHUB_RUN_ID" \
            --env MENDPOINT_REGAUGE_ACTIVATION_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            --process-groups worker
          machines_json="$(flyctl machines list --app mendpoint-regauge-production --json)"
          volume_id="$(jq -er '.id' test-results/regauge-production/coordinator-volume.json)"
          printf '%s\n' "$machines_json" > test-results/regauge-production/prestart-machines.json
          npm run regauge:production:proof -- \
            --mode=worker-start-plan \
            --input=test-results/regauge-production/prestart-machines.json \
            --volume-id="$volume_id" \
            --output=test-results/regauge-production/worker-start-plan.json
          worker_id="$(jq -er '.workerId' test-results/regauge-production/worker-start-plan.json)"
          worker_action="$(jq -er '.action' test-results/regauge-production/worker-start-plan.json)"
          case "$worker_action" in
            observe|wait)
              ;;
            start)
              timeout --kill-after=5s 60s flyctl machine start "$worker_id" \
                --app mendpoint-regauge-production
              ;;
            *)
              printf 'unsupported exact worker action: %s\n' "$worker_action" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$worker_id" > test-results/regauge-production/worker-id.txt
      - name: Verify exact deployed revision and process health
        shell: bash
        run: |
          set -euo pipefail
          flyctl status --app mendpoint-regauge-production --json | tee test-results/regauge-production/fly-status.json
          volume_id="$(jq -r '.id' test-results/regauge-production/coordinator-volume.json)"
          worker_id="$(cat test-results/regauge-production/worker-id.txt)"
          test -n "$volume_id"
          test -n "$worker_id"
          machines_json=""
          for attempt in {1..60}; do
            machines_json="$(flyctl machines list --app mendpoint-regauge-production --json)"
            printf '%s\n' "$machines_json" > test-results/regauge-production/machine-topology.json
            rm -f test-results/regauge-production/runtime-identity.json
            if npm run regauge:production:proof -- \
              --mode=machine-establish \
              --input=test-results/regauge-production/machine-topology.json \
              --volume-id="$volume_id" \
              --output=test-results/regauge-production/runtime-identity.json; then
