name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual dispatch exists so the customer-production deploy below can be
  # exercised deliberately on main after merge, rather than first proving itself
  # on an unrelated push. The mendpoint-talal deploy job stays push-only, so
  # dispatching this workflow re-runs the gates and can ship only the customer
  # app -- never mendpoint-talal.
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # revert-obligation-check (in npm test and ga:check) needs full
          # history to see reverts and their re-lands; a shallow clone
          # correctly fails closed. See scripts/revert-obligation-check.ts.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Fettler and Regauge agent eval gate
        run: npm run eval:agents -- --repetitions=3 --output=test-results/agent-evals/report.json
      - name: Upload agent eval evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agent-eval-evidence
          path: test-results/agent-evals/report.json
          if-no-files-found: error
          retention-days: 30
      # Synthetic adversarial suite (evals/). Per-PR this runs the GENERATED
      # families only — deterministic, seeded, self-contained, needs no external
      # corpus. It typechecks and unit-tests evals/, then runs the suite, which
      # writes the readiness verdict + scorecard. The 21 hand-authored corpus
      # scenarios (incl. the 30k-file scale case and the language-support cases
      # that drive the honest recall failure) require MENDPOINT_CORPUS_ROOT and
      # run locally / on a self-hosted nightly runner that has the corpus; on a
      # GitHub-hosted runner they are absent and are cleanly skipped, not failed.
      # The readiness gate is an instrument: it reports PASS/FAIL and does not
      # block CI (a corpus built to make the product fail cannot gate CI green).
      - name: Synthetic eval suite (evals/)
        run: |
          npm run eval:synthetic:check
          npm run eval:synthetic
      - name: Upload synthetic eval evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: synthetic-eval-evidence
          path: |
            evals/reports/latest.md
            evals/reports/readiness-scorecard.md
            evals/reports/latest-runs.json
            evals/FAILURES.md
          if-no-files-found: error
          retention-days: 30
      - name: GA preflight
        shell: bash
        run: |
          mkdir -p "$MENDPOINT_DATA_DIR" "$MENDPOINT_REPOS_DIR"
          npm run ga:check
        env:
          NODE_ENV: production
          MENDPOINT_DEPLOYMENT_PROFILE: demo
          API_AUTH: required
          GITHUB_MODE: mock
          MENDPOINT_SANDBOX_KIND: local
          MENDPOINT_DATA_DIR: ${{ runner.temp }}/mendpoint-ga
          MENDPOINT_REPOS_DIR: ${{ runner.temp }}/mendpoint-repos
      - name: Demo smoke (offline)
        run: npm run demo
        env:
          GITHUB_MODE: mock

  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: API startup smoke
        shell: bash
        run: |
          set -euo pipefail
          export NODE_ENV=production
          export MENDPOINT_DEPLOYMENT_PROFILE=demo
          export API_AUTH=required
          export GITHUB_MODE=mock
          export MENDPOINT_SANDBOX_KIND=local
          export MENDPOINT_APPLICATION_DATA_KEY="$(printf 'b%.0s' {1..64})"
          export MENDPOINT_DATA_DIR="$RUNNER_TEMP/mendpoint-smoke"
          export MENDPOINT_REPOS_DIR="$RUNNER_TEMP/mendpoint-repos"
          mkdir -p "$MENDPOINT_REPOS_DIR"
          bootstrap_output="$(npm run --silent auth:bootstrap)"
          api_key="$(printf '%s\n' "$bootstrap_output" | sed -n 's/^token=//p')"
          test -n "$api_key"
          npm run start:api >"$RUNNER_TEMP/api-smoke.log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            cat "$RUNNER_TEMP/api-smoke.log"
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ready >/dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent \
            -H "Authorization: Bearer $api_key" \
            http://127.0.0.1:3001/keys >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Authorization: Bearer invalid' \
            -H 'X-Role: owner' \
            -H 'X-Tenant-Id: tenant_default' \
            http://127.0.0.1:3001/keys)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: installation' \
            -H 'X-GitHub-Delivery: ci-smoke' \
            --data '{"action":"deleted","installation":{"id":1}}' \
            http://127.0.0.1:3001/webhooks/github)" = "401"

  container-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build API image
        run: docker build --target api -t mendpoint-api:ci .
      - name: Build web image
        run: docker build --target web -t mendpoint-web:ci .
      - name: Build worker image
        run: docker build --target worker -t mendpoint-worker:ci .
      - name: Build Regauge image
        run: docker build --target transformer -t mendpoint-transformer:ci .
      - name: Build Fly image
        run: docker build --target fly -t mendpoint-fly:ci .
      - name: Start production images
        shell: bash
        run: |
          set -euo pipefail
          docker network create mendpoint-ci
          docker volume create mendpoint-ci-data
          cleanup() {
            docker logs mendpoint-fly-ci 2>/dev/null || true
            docker logs mendpoint-web-ci 2>/dev/null || true
            docker logs mendpoint-api-ci 2>/dev/null || true
            docker rm --force mendpoint-fly-ci mendpoint-web-ci mendpoint-api-ci 2>/dev/null || true
            docker volume rm mendpoint-fly-ci-data mendpoint-ci-data 2>/dev/null || true
            docker network rm mendpoint-ci 2>/dev/null || true
          }
          trap cleanup EXIT
          bootstrap_output="$(docker run --rm \
            -e MENDPOINT_DEPLOYMENT_PROFILE=demo \
            -v mendpoint-ci-data:/app/data \
            mendpoint-api:ci npm run --silent auth:bootstrap)"
          api_key="$(printf '%s\n' "$bootstrap_output" | sed -n 's/^token=//p')"
          test -n "$api_key"
          docker run --detach \
            --name mendpoint-api-ci \
            --network mendpoint-ci \
            --publish 127.0.0.1:3001:3001 \
            -e MENDPOINT_DEPLOYMENT_PROFILE=demo \
            -e GITHUB_MODE=mock \
            -e MENDPOINT_SANDBOX_KIND=local \
            -e MENDPOINT_APPLICATION_DATA_KEY="$(printf 'b%.0s' {1..64})" \
            -e MENDPOINT_REPOS_DIR=/workspace/repos \
            -v mendpoint-ci-data:/app/data \
            mendpoint-api:ci
          for attempt in {1..30}; do
            ready_status="$(curl --silent \
              --output "$RUNNER_TEMP/mendpoint-api-ready.json" \
              --write-out '%{http_code}' \
              http://127.0.0.1:3001/ready || true)"
            if test "$ready_status" = "200"; then
              break
            fi
            if test "$attempt" -eq 30; then
              echo "API readiness failed with HTTP $ready_status"
              cat "$RUNNER_TEMP/mendpoint-api-ready.json" 2>/dev/null || true
              docker inspect mendpoint-api-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent \
            -H "Authorization: Bearer $api_key" \
            http://127.0.0.1:3001/keys >/dev/null
          web_access_token=ci-web-access-token
          docker run --detach \
            --name mendpoint-web-ci \
            --network mendpoint-ci \
            --publish 127.0.0.1:3000:3000 \
            -e MENDPOINT_API_URL=http://mendpoint-api-ci:3001 \
            -e MENDPOINT_API_KEY="$api_key" \
            -e MENDPOINT_WEB_ACCESS_TOKEN="$web_access_token" \
            -e MENDPOINT_WEB_ALLOWED_ORIGINS=http://127.0.0.1:3000 \
            mendpoint-web:ci
          for attempt in {1..30}; do
            if test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:3000/access)" = "200"; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3000/status)" = "307"
          curl --fail --silent \
            --cookie-jar "$RUNNER_TEMP/mendpoint-web.cookies" \
            -H "Origin: http://127.0.0.1:3000" \
            -H "Content-Type: application/json" \
            --data "{\"operatorId\":\"container-ci\",\"token\":\"$web_access_token\"}" \
            http://127.0.0.1:3000/api/session >/dev/null
          curl --fail --silent \
            --cookie "$RUNNER_TEMP/mendpoint-web.cookies" \
            http://127.0.0.1:3000/status >/dev/null
          curl --fail --silent \
            --cookie "$RUNNER_TEMP/mendpoint-web.cookies" \
            http://127.0.0.1:3000/api/status >/dev/null
          docker run --rm \
            --network mendpoint-ci \
            -e MENDPOINT_DEPLOYMENT_PROFILE=demo \
            -e GITHUB_MODE=mock \
            -e MENDPOINT_SANDBOX_KIND=local \
            -e MENDPOINT_TENANT_ID=tenant_default \
            -v mendpoint-ci-data:/app/data \
            mendpoint-worker:ci \
            node --import tsx apps/worker/src/cli.ts process-jobs
          docker volume create mendpoint-fly-ci-data
          fly_api_key="me_$(printf 'a%.0s' {1..40})"
          docker run --detach \
            --name mendpoint-fly-ci \
            --publish 127.0.0.1:3002:3000 \
            -e MENDPOINT_DEPLOYMENT_PROFILE=demo \
            -e GITHUB_MODE=mock \
            -e MENDPOINT_SANDBOX_KIND=local \
            -e MENDPOINT_APPLICATION_DATA_KEY="$(printf 'b%.0s' {1..64})" \
            -e MENDPOINT_API_KEY="$fly_api_key" \
            -e MENDPOINT_WEB_ACCESS_TOKEN=ci-fly-web-access-token \
            -e MENDPOINT_WEB_ALLOWED_ORIGINS=http://127.0.0.1:3002 \
            -e WEB_URL=http://127.0.0.1:3002 \
            -e CORS_ORIGINS=http://127.0.0.1:3002 \
            -e MENDPOINT_PILOT_SEED=1 \
            -e POLL_LOCAL_ONLY=1 \
            -e MENDPOINT_FEED_POLLING_ENABLED=0 \
            -v mendpoint-fly-ci-data:/data \
            mendpoint-fly:ci
          for attempt in {1..60}; do
            fly_status="$(curl --silent --output "$RUNNER_TEMP/mendpoint-fly-health.json" \
              --write-out '%{http_code}' http://127.0.0.1:3002/healthz || true)"
            if test "$fly_status" = "200"; then
              break
            fi
            if test "$attempt" -eq 60; then
              cat "$RUNNER_TEMP/mendpoint-fly-health.json" 2>/dev/null || true
              docker inspect mendpoint-fly-ci
              exit 1
            fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3002/status)" = "307"

  deployment-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install browser
        run: npx playwright install chromium
      - name: Build production image
        run: docker build --target fly -t mendpoint-fly:e2e .
      - name: Production journey and crash recovery
        run: npm run e2e:deployment
      - name: Upload browser and runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deployment-e2e-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, release-gates, container-builds, deployment-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: mendpoint-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Re-assert, at the front of the deploy, that this run still ships the
      # current tip of main. A deploy job that waited in the mendpoint-production
      # concurrency queue can start after newer commits have merged; shipping a
      # superseded commit and reporting success would silently overwrite newer
      # main with older code. When superseded, skip honestly -- the newer
      # commit's own run deploys it -- so this shows as a visible SKIP, distinct
      # from a successful deploy and from a failed one. Fail-safe: if the current
      # head cannot be determined, proceed with the deploy rather than skip,
      # because "main is not deployed" is the exact state we are eliminating.
      - name: Re-assert this run deploys current main head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          head_sha="$(git ls-remote origin refs/heads/main 2>/dev/null | awk 'NR==1 {print $1}' || true)"
          if [ -z "$head_sha" ]; then
            echo "::notice::Could not determine current main head; proceeding with deploy (fail-safe)."
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          elif [ "$head_sha" != "$expected" ]; then
            echo "::notice::Deploy skipped: commit ${expected} was superseded by newer main head ${head_sha}. The newer commit's deploy run is responsible for shipping it."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "This run deploys the current main head ${expected}."
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        if: steps.head.outputs.superseded != 'true'
        with:
          version: "0.4.79"
      # MENDPOINT_RELEASE_REVISION stamps the immutable git sha onto the running
      # app so /version can report exactly what is deployed. Without it,
      # /version.revision is null and a revision check would compare null to null
      # and pass -- the verify step below treats an absent revision as a FAILURE,
      # never a match, which is the whole point of the third state.
      - name: Deploy verified revision
        if: steps.head.outputs.superseded != 'true'
        run: flyctl deploy --remote-only --app mendpoint-talal --env MENDPOINT_RELEASE_REVISION=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Bounded health verification. Every curl carries --max-time, so a hung or
      # unresponsive endpoint fails fast and loud instead of blocking until the
      # job's 25-minute timeout (which GitHub records, misleadingly, as
      # "cancelled"). The whole retry loop is bounded by an explicit deadline so
      # the step can never approach that timeout. It asserts BOTH that the
      # revision the app is serving equals this commit AND that the app is
      # actually up, and on failure prints the HTTP code, bytes received, and
      # deployed-vs-expected revision so the state is diagnosable without opening
      # Fly.
      - name: Verify deployed revision and production health
        if: steps.head.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          revision=""
          ver_code=000
          ver_bytes=0
          live_code=000
          live_bytes=0
          health_code=000
          health_bytes=0
          deadline=$(( $(date +%s) + 300 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            ver_code="$(curl -sS -o version.json -w '%{http_code}' --max-time 10 https://mendpoint-talal.fly.dev/version || echo 000)"
            ver_bytes="$(wc -c <version.json 2>/dev/null || echo 0)"
            live_code="$(curl -sS -o livez.json -w '%{http_code}' --max-time 10 https://mendpoint-talal.fly.dev/livez || echo 000)"
            live_bytes="$(wc -c <livez.json 2>/dev/null || echo 0)"
            health_code="$(curl -sS -o healthz.json -w '%{http_code}' --max-time 10 https://mendpoint-talal.fly.dev/healthz || echo 000)"
            health_bytes="$(wc -c <healthz.json 2>/dev/null || echo 0)"
            revision=""
            if [ "$ver_code" = "200" ]; then
              revision="$(jq -r '.revision // empty' version.json 2>/dev/null || true)"
            fi
            if [ "$revision" = "$expected" ] && [ "$live_code" = "200" ] && [ "$health_code" = "200" ]; then
              echo "Production is live and serving the expected revision ${expected}."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production verification failed for revision ${expected} (deployed, but not confirmed live on current main)."
          echo "  /version -> http ${ver_code}, ${ver_bytes} bytes, revision=$([ -n "${revision}" ] && echo "${revision}" || echo "<absent>")"
          echo "  /livez   -> http ${live_code}, ${live_bytes} bytes"
          echo "  /healthz -> http ${health_code}, ${health_bytes} bytes"
          if [ -z "${revision}" ]; then
            echo "  Deployed revision could not be determined (absent). This is a FAILURE, not a match."
          elif [ "${revision}" != "${expected}" ]; then
            echo "  Deployed revision ${revision} does not match expected ${expected}."
          else
            echo "  Revision matched but the app never reported healthy (/livez and /healthz must both be 200)."
          fi
          exit 1

  # mendpoint-fettler-production is the customer-profile app. Until this job it
  # had NO deploy automation of any kind: the only flyctl deploy invocations in
  # this repo target mendpoint-talal (above) and mendpoint-regauge-production.
  # The app was therefore deployed by hand and drifted -- it still serves an
  # image built for mendpoint-talal whose error strings no longer exist in
  # source, which is why the customer backup cron fails every run. This job
  # gives that app the same gated push-to-main deploy path mendpoint-talal has.
  #
  # It is deliberately NOT gated on /readyz. Customer readiness depends on
  # backup evidence this deploy cannot itself produce, so asserting it here
  # would make the job permanently red for a reason outside a deploy's control.
  # The job proves the right code is running and the process is alive; readiness
  # remains the backup workflow's business.
  deploy-customer-production:
    # Runs on merges to main and on deliberate dispatch, never on pull_request:
    # a PR that deployed would ship unreviewed code to a customer app. The
    # workflow_dispatch arm exists so this path can be exercised once on purpose
    # after merge instead of waiting for the next push to prove itself.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    needs: [test, release-gates, container-builds, deployment-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Its own group, not mendpoint-production: this is a different app and must
    # not serialise behind (or cancel) the mendpoint-talal deploy.
    concurrency:
      group: customer-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Same supersession guard as the deploy job above: a run that waited in the
      # concurrency queue can start after newer commits merged, and shipping a
      # superseded commit would silently overwrite newer main with older code.
      #
      # Three outcomes, three behaviours -- "could not determine" is NOT folded
      # into "current". When supersession cannot be established we skip, because
      # the two failure modes are not symmetric: skipping means this run does not
      # deploy, which the next merge to main fixes on its own and a dispatch run
      # fixes immediately -- self-healing, bounded, and visible in the log.
      # Deploying blind means an older commit can silently overwrite newer main
      # in production, which is not self-healing and stays invisible until
      # someone notices /version going backwards.
      - name: Re-assert this run deploys current main head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          head_sha="$(git ls-remote origin refs/heads/main 2>/dev/null | awk 'NR==1 {print $1}' || true)"
          if [ -z "$head_sha" ]; then
            echo "::warning::Deploy skipped: could not determine the current main head, so it is unknown whether commit ${expected} is still current. Refusing to deploy on an unestablished check rather than risk overwriting newer main with older code. The next merge to main will deploy; to ship this commit now, re-run this workflow via workflow_dispatch on main once the repository is reachable."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          elif [ "$head_sha" != "$expected" ]; then
            echo "::notice::Deploy skipped: commit ${expected} was superseded by newer main head ${head_sha}. The newer commit's deploy run is responsible for shipping it."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "This run deploys the current main head ${expected}."
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        if: steps.head.outputs.superseded != 'true'
        with:
          version: "0.4.79"
      # Prove this credential actually has authority over the customer app
      # BEFORE mutating anything. FLY_API_TOKEN_CUSTOMER is a deploy token scoped
      # to mendpoint-fettler-production alone -- deliberately NOT the repo-wide
      # FLY_API_TOKEN that deploys mendpoint-talal above, which this preflight
      # proved has no authority over this app. Its scope is asserted here rather
      # than assumed. Read-only: `status` mutates nothing. The token is never
      # echoed -- only its presence is tested.
      - name: Prove deploy authority over the customer app
        if: steps.head.outputs.superseded != 'true'
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_CUSTOMER }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "::error::FLY_API_TOKEN_CUSTOMER is empty; cannot deploy the customer app."; exit 1; }
          if ! flyctl status --app mendpoint-fettler-production >/dev/null 2>&1; then
            echo "::error::FLY_API_TOKEN_CUSTOMER cannot read mendpoint-fettler-production. Re-scope the FLY_API_TOKEN_CUSTOMER repository secret to that app; do not widen this job to the repository-wide FLY_API_TOKEN."
            exit 1
          fi
          echo "Deploy credential has authority over mendpoint-fettler-production."
      # --config is required because fly.customer-warden.toml is the ONLY fly
      # config in this repo with no `app =` line (it is a reusable customer
      # profile), so the app name must be passed explicitly with --app.
      # --ha=false is load-bearing, not cosmetic: the profile is bounded to
      # exactly one machine (MENDPOINT_CUSTOMER_MAX_MACHINES=1) and the app pins
      # itself to an approved machine id, so letting Fly add a second machine
      # would boot a node that fails closed.
      # MENDPOINT_RELEASE_REVISION stamps the immutable git sha onto the running
      # app so /version reports exactly what is deployed; without it the revision
      # is null and the drift this job exists to fix stays invisible.
      - name: Deploy customer production
        if: steps.head.outputs.superseded != 'true'
        run: >-
          flyctl deploy --remote-only --ha=false --app mendpoint-fettler-production
          --config fly.customer-warden.toml
          --env MENDPOINT_RELEASE_REVISION=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_CUSTOMER }}
      # Bounded verification, mirroring the mendpoint-talal deploy: every curl
      # carries --max-time and the loop has an explicit deadline, so an
      # unresponsive app fails fast rather than burning the job timeout. An
      # absent revision is treated as a FAILURE, never a match.
      - name: Verify deployed revision and customer production health
        if: steps.head.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          base="https://mendpoint-fettler-production.fly.dev"
          revision=""
          ver_code=000
          ver_bytes=0
          live_code=000
          live_bytes=0
          health_code=000
          health_bytes=0
          deadline=$(( $(date +%s) + 300 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            ver_code="$(curl -sS -o version.json -w '%{http_code}' --max-time 10 "$base/version" || echo 000)"
            ver_bytes="$(wc -c <version.json 2>/dev/null || echo 0)"
            live_code="$(curl -sS -o livez.json -w '%{http_code}' --max-time 10 "$base/livez" || echo 000)"
            live_bytes="$(wc -c <livez.json 2>/dev/null || echo 0)"
            health_code="$(curl -sS -o healthz.json -w '%{http_code}' --max-time 10 "$base/healthz" || echo 000)"
            health_bytes="$(wc -c <healthz.json 2>/dev/null || echo 0)"
            revision=""
            if [ "$ver_code" = "200" ]; then
              revision="$(jq -r '.revision // empty' version.json 2>/dev/null || true)"
            fi
            if [ "$revision" = "$expected" ] && [ "$live_code" = "200" ] && [ "$health_code" = "200" ]; then
              echo "Customer production is live and serving the expected revision ${expected}."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Customer production verification failed for revision ${expected} (deployed, but not confirmed live on current main)."
          echo "  /version -> http ${ver_code}, ${ver_bytes} bytes, revision=$([ -n "${revision}" ] && echo "${revision}" || echo "<absent>")"
          echo "  /livez   -> http ${live_code}, ${live_bytes} bytes"
          echo "  /healthz -> http ${health_code}, ${health_bytes} bytes"
          if [ -z "${revision}" ]; then
            echo "  Deployed revision could not be determined (absent). This is a FAILURE, not a match."
          elif [ "${revision}" != "${expected}" ]; then
            echo "  Deployed revision ${revision} does not match expected ${expected}."
          else
            echo "  Revision matched but the app never reported healthy (/livez and /healthz must both be 200)."
          fi
          exit 1
