name: Sandbox egress acceptance

# Reusable engine: proves default-deny egress inside a real sandbox Machine,
# signs the acceptance receipt only if that probe passes, and rotates the receipt
# onto every consuming app. It is invoked from sandbox-egress-renewal.yml by two
# paths that differ ONLY in which environment gates the mint:
#   - manual (workflow_dispatch): environment `sandbox-production` with its
#     required reviewer and a human-typed confirmation string.
#   - scheduled (cron): a deployment-branch-restricted environment whose rule is
#     the default branch. GitHub runs scheduled workflows only from the default
#     branch, so the reviewed probe steps on that branch are guaranteed to run
#     and gate the mint. That trusted-ref guarantee is the machine-checkable
#     substitute for the human-typed string; the probe itself is never skipped.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment whose protection gates this mint.
        required: true
        type: string
      require_confirmation:
        description: When true, require the human-typed confirmation string (manual path).
        required: false
        default: false
        type: boolean
      confirmation:
        description: Confirmation string, checked only when require_confirmation is true.
        required: false
        default: ""
        type: string

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    # The renewal-failure alarm is a GitHub issue opened in this repo (see the
    # "Alert on renewal failure" step), so this job needs issues:write on top of
    # the read-only default. Scoped to this job only; the workflow-level default
    # (contents: read) is left unchanged.
    permissions:
      contents: read
      issues: write
    concurrency:
      group: sandbox-egress-production
      cancel-in-progress: false
    env:
      SANDBOX_FLY_API_TOKEN: ${{ secrets.SANDBOX_FLY_API_TOKEN }}
      # Org-scoped token used to enumerate apps and rotate the receipt onto every
      # consuming app (a per-app verifying token cannot reach the others).
      ROTATION_FLY_API_TOKEN: ${{ secrets.ROTATION_FLY_API_TOKEN }}
      MENDPOINT_SANDBOX_EGRESS_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.MENDPOINT_SANDBOX_EGRESS_SIGNING_KEY_PKCS8_BASE64 }}
      MENDPOINT_SANDBOX_EGRESS_APP: ${{ vars.SANDBOX_FLY_APP }}
      MENDPOINT_SANDBOX_EGRESS_IMAGE: ${{ vars.SANDBOX_IMAGE_DIGEST }}
      MENDPOINT_SANDBOX_EGRESS_POLICY_DIGEST: ${{ vars.SANDBOX_EGRESS_POLICY_DIGEST }}
      MENDPOINT_SANDBOX_EGRESS_KEY_ID: ${{ vars.SANDBOX_EGRESS_KEY_ID }}
      SANDBOX_IMAGE_TAG: ${{ vars.SANDBOX_IMAGE_TAG }}
      SANDBOX_VERIFYING_APP: ${{ vars.SANDBOX_VERIFYING_APP }}
      # Rotation targets are enumerated from configuration, not a hardcoded list:
      # the operator naming convention (prefixes) and optional org filter select
      # apps from the live Fly inventory.
      SANDBOX_EGRESS_ROTATION_APP_PREFIXES: ${{ vars.SANDBOX_EGRESS_ROTATION_APP_PREFIXES }}
      FLY_ORG: ${{ vars.FLY_ORG }}
      # Failure visibility: a failed or skipped renewal must be loud BEFORE the
      # receipt lapses. The sink is a GitHub issue opened by the "Alert on
      # renewal failure" step below (no external paging secret required); the
      # pre-mint assertion guarantees that alert path exists and is not skipped.
      MENDPOINT_SANDBOX_EGRESS_ALERT_LEAD_MS: ${{ vars.SANDBOX_EGRESS_ALERT_LEAD_MS }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Prepare renewal diagnostics and runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/sandbox-egress
          printf 'run_url=%s\nrun_attempt=%s\nrevision=%s\nref=%s\nenvironment=%s\n' \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$GITHUB_RUN_ATTEMPT" \
            "$GITHUB_SHA" \
            "$GITHUB_REF" \
            "${{ inputs.environment }}" \
            >test-results/sandbox-egress/renewal-context.txt
          npm ci
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: "0.4.79"
      - name: Validate protected authority
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUIRE_CONFIRMATION: ${{ inputs.require_confirmation }}
        run: |
          set -euo pipefail
          if [ "$REQUIRE_CONFIRMATION" = "true" ]; then
            # Manual path: a human authorizes this mint with the exact confirmation
            # string, on top of the environment's required reviewer.
            test "$CONFIRMATION" = "SANDBOX_EGRESS_ACCEPTED"
          else
            # Automated renewal path: no human types a string. The mint is
            # authorized by a machine-checkable guarantee that the probe below runs
            # on a TRUSTED REF -- this job runs only under an environment whose
            # deployment-branch rule is the default branch, and GitHub runs
            # scheduled workflows only from that branch. Assert the trusted ref
            # here as defense in depth on top of that environment rule. The probe
            # is NEVER skipped: whichever path mints, the steps below must pass.
            test -n "$DEFAULT_BRANCH"
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          fi
          # A failed or skipped renewal must be loud BEFORE the receipt lapses.
          # The alarm is a GitHub issue opened by the failure-guarded "Alert on
          # renewal failure" step, which needs issues:write. Guarantee -- against
          # this checked-out workflow -- that the alert path still exists and
          # cannot silently no-op BEFORE minting: the accept job must hold
          # issues:write and the failure-guarded alert step must be present.
          # Remove either and this refuses, so no receipt is minted unmonitored.
          engine=".github/workflows/sandbox-egress-acceptance.yml"
          grep -q "issues: write" "$engine"
          grep -qE '^      - name: Alert on renewal failure$' "$engine"
          grep -A1 -E '^      - name: Alert on renewal failure$' "$engine" | grep -qE 'failure\(\)'
          required=(
            SANDBOX_FLY_API_TOKEN ROTATION_FLY_API_TOKEN
            MENDPOINT_SANDBOX_EGRESS_SIGNING_KEY_PKCS8_BASE64
            MENDPOINT_SANDBOX_EGRESS_APP MENDPOINT_SANDBOX_EGRESS_IMAGE
            MENDPOINT_SANDBOX_EGRESS_POLICY_DIGEST MENDPOINT_SANDBOX_EGRESS_KEY_ID
            SANDBOX_IMAGE_TAG SANDBOX_VERIFYING_APP
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "Missing sandbox production authority: $name"; exit 1; }
          done
          [[ "$MENDPOINT_SANDBOX_EGRESS_IMAGE" =~ ^registry\.fly\.io/mendpoint-sandbox@sha256:[a-f0-9]{64}$ ]]
          [[ "$SANDBOX_IMAGE_TAG" =~ ^registry\.fly\.io/mendpoint-sandbox:[A-Za-z0-9._-]+$ ]]
          [[ "$MENDPOINT_SANDBOX_EGRESS_POLICY_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          actual_policy_digest="sha256:$(sha256sum scripts/start-sandbox-entrypoint.sh | cut -d' ' -f1)"
          test "$actual_policy_digest" = "$MENDPOINT_SANDBOX_EGRESS_POLICY_DIGEST"
      - name: Prove default deny and local execution
        id: acceptance
        shell: bash
        env:
          FLY_API_TOKEN: ${{ env.SANDBOX_FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          machine_name="egress-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          machine_id=""
          cleanup() {
            cleanup_id="$machine_id"
            if test -z "$cleanup_id"; then
              cleanup_id="$(flyctl machine list --app "$MENDPOINT_SANDBOX_EGRESS_APP" --json \
                | jq -r --arg name "$machine_name" '.[] | select(.name == $name) | .id' | head -n 1)"
            fi
            if test -z "$cleanup_id"; then
              return 0
            fi
            if ! flyctl machine destroy --force --app "$MENDPOINT_SANDBOX_EGRESS_APP" "$cleanup_id"; then
              echo "sandbox_machine_not_destroyed: $cleanup_id"
              return 1
            fi
            if ! flyctl machine list --app "$MENDPOINT_SANDBOX_EGRESS_APP" --json \
              | jq -e --arg id "$cleanup_id" 'all(.[]; .id != $id)' >/dev/null; then
              echo "sandbox_machine_not_destroyed: $cleanup_id"
              return 1
            fi
            machine_id=""
          }
          trap 'cleanup || true' EXIT
          launch_output="$(flyctl machine run "$SANDBOX_IMAGE_TAG" \
            --app "$MENDPOINT_SANDBOX_EGRESS_APP" \
            --region iad \
            --name "$machine_name" \
            --detach \
            --restart no \
            --vm-cpu-kind shared \
            --vm-cpus 1 \
            --vm-memory 512 \
            --autostop=off)"
          machine_id="$(printf '%s\n' "$launch_output" | awk '/Machine ID:/ {print $3; exit}')"
          test -n "$machine_id"
          flyctl machine status "$machine_id" \
            --app "$MENDPOINT_SANDBOX_EGRESS_APP" \
            --display-config \
            >test-results/sandbox-egress/machine-config.json
          expected_digest="${MENDPOINT_SANDBOX_EGRESS_IMAGE#*@}"
          jq -e --arg digest "$expected_digest" \
            '.image | endswith("@" + $digest)' \
            test-results/sandbox-egress/machine-config.json >/dev/null
          flyctl machine exec "$machine_id" \
            --app "$MENDPOINT_SANDBOX_EGRESS_APP" \
            --json "/bin/sh -lc 'iptables -S OUTPUT && echo mendpoint-exec-ok'" \
            >test-results/sandbox-egress/ipv4-policy.json
          flyctl machine exec "$machine_id" \
            --app "$MENDPOINT_SANDBOX_EGRESS_APP" \
            --json "/bin/sh -lc 'ip6tables -S OUTPUT && echo mendpoint-exec-ok'" \
            >test-results/sandbox-egress/ipv6-policy.json
          jq -e '.stdout == "-P OUTPUT DROP\n-A OUTPUT -o lo -j ACCEPT\n-A OUTPUT -j REJECT --reject-with icmp-admin-prohibited\nmendpoint-exec-ok\n" and ( .stderr // "" ) == "" and ((has("exit_code") | not) or (.exit_code == 0))' \
            test-results/sandbox-egress/ipv4-policy.json >/dev/null
          jq -e '.stdout == "-P OUTPUT DROP\n-A OUTPUT -o lo -j ACCEPT\n-A OUTPUT -j REJECT --reject-with icmp6-adm-prohibited\nmendpoint-exec-ok\n" and ( .stderr // "" ) == "" and ((has("exit_code") | not) or (.exit_code == 0))' \
            test-results/sandbox-egress/ipv6-policy.json >/dev/null
          probes="$(node --import tsx --input-type=module -e '
            import {
              SANDBOX_EGRESS_ALLOWED_PROBE_COMMAND,
              SANDBOX_EGRESS_FORBIDDEN_PROBE_COMMAND,
            } from "@mendpoint/platform";
            process.stdout.write(JSON.stringify({
              allowed: SANDBOX_EGRESS_ALLOWED_PROBE_COMMAND,
              forbidden: SANDBOX_EGRESS_FORBIDDEN_PROBE_COMMAND,
            }));
          ')"
          allowed_probe="$(jq -r '.allowed' <<<"$probes")"
          forbidden_probe="$(jq -r '.forbidden' <<<"$probes")"
          printf '%s' "$allowed_probe" >test-results/sandbox-egress/allowed-command.txt
          printf '%s' "$forbidden_probe" >test-results/sandbox-egress/forbidden-command.txt
          flyctl machine exec "$machine_id" \
            --app "$MENDPOINT_SANDBOX_EGRESS_APP" \
            --json "runuser -u node -- $allowed_probe" \
            >test-results/sandbox-egress/allowed-local.json
          jq -e '.stdout == "mendpoint-egress-allowed\n" and ( .stderr // "" ) == "" and ((has("exit_code") | not) or (.exit_code == 0))' \
            test-results/sandbox-egress/allowed-local.json >/dev/null
          flyctl machine exec "$machine_id" \
            --app "$MENDPOINT_SANDBOX_EGRESS_APP" \
            --json "runuser -u node -- $forbidden_probe" \
            >test-results/sandbox-egress/forbidden-outbound.json
          jq -e '.stdout == "mendpoint-egress-blocked\n" and ( .stderr // "" ) == "" and ((has("exit_code") | not) or (.exit_code == 0))' \
            test-results/sandbox-egress/forbidden-outbound.json >/dev/null
          tested_at="$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')"
          expires_at="$(date -u -d '+23 hours' '+%Y-%m-%dT%H:%M:%S.000Z')"
          {
            echo "machine_id=$machine_id"
            echo "MENDPOINT_SANDBOX_EGRESS_TESTED_AT=$tested_at"
            echo "MENDPOINT_SANDBOX_EGRESS_EXPIRES_AT=$expires_at"
            echo "MENDPOINT_SANDBOX_EGRESS_EVIDENCE_REFS=evidence://github/actions/run/${GITHUB_RUN_ID}/attempt/${GITHUB_RUN_ATTEMPT},evidence://fly/app/${MENDPOINT_SANDBOX_EGRESS_APP}/machine/${machine_id}"
          } >>"$GITHUB_OUTPUT"
          {
            echo "MENDPOINT_SANDBOX_EGRESS_TESTED_AT=$tested_at"
            echo "MENDPOINT_SANDBOX_EGRESS_EXPIRES_AT=$expires_at"
            echo "MENDPOINT_SANDBOX_EGRESS_EVIDENCE_REFS=evidence://github/actions/run/${GITHUB_RUN_ID}/attempt/${GITHUB_RUN_ATTEMPT},evidence://fly/app/${MENDPOINT_SANDBOX_EGRESS_APP}/machine/${machine_id}"
          } >>"$GITHUB_ENV"
          cleanup
          trap - EXIT
      - name: Sign and verify the acceptance receipt
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/create-sandbox-egress-attestation.ts \
            >test-results/sandbox-egress/receipt.json
          node --import tsx --input-type=module -e '
            import { readFileSync } from "node:fs";
            import {
              verifySandboxEgressAttestation,
              SANDBOX_EGRESS_ATTESTATION_MIN_SCHEMA_FLOOR,
            } from "@mendpoint/platform";
            const receipt = JSON.parse(readFileSync("test-results/sandbox-egress/receipt.json", "utf8"));
            // Every expected value must come from a source INDEPENDENT of the receipt, or
            // the check is a tautology that cannot fail. The trusted key id and policy
            // digest come from the configured production authority (validated non-empty,
            // and the policy digest matched to the entrypoint hash, in "Validate protected
            // authority" above); the schema floor comes from platform code. The receipt
            // only supplies its own envelope and public key, which the signature is
            // checked against. An unset configured value refuses (fails closed) rather
            // than passing.
            verifySandboxEgressAttestation({
              attestationBase64: receipt.attestationBase64,
              publicKeySpkiBase64: receipt.publicKeySpkiBase64,
              expectedKeyId: process.env.MENDPOINT_SANDBOX_EGRESS_KEY_ID,
              expectedPolicyDigest: process.env.MENDPOINT_SANDBOX_EGRESS_POLICY_DIGEST,
              expectedApp: process.env.MENDPOINT_SANDBOX_EGRESS_APP,
              expectedImage: process.env.MENDPOINT_SANDBOX_EGRESS_IMAGE,
              observedAt: new Date().toISOString(),
              minimumSchemaVersion: SANDBOX_EGRESS_ATTESTATION_MIN_SCHEMA_FLOOR,
            });
          '
      - name: Rotate the egress authority to every consuming app
        shell: bash
        env:
          FLY_API_TOKEN: ${{ env.ROTATION_FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          attestation="$(jq -r '.attestationBase64' test-results/sandbox-egress/receipt.json)"
          public_key="$(jq -r '.publicKeySpkiBase64' test-results/sandbox-egress/receipt.json)"
          key_id="$(jq -r '.keyId' test-results/sandbox-egress/receipt.json)"
          policy_digest="$(jq -r '.policyDigest' test-results/sandbox-egress/receipt.json)"
          schema="$(jq -r '.payload.schemaVersion' test-results/sandbox-egress/receipt.json)"
          # Enumerate the apps that consume the receipt FROM CONFIGURATION -- the
          # live Fly inventory filtered by the operator naming convention -- never
          # a hardcoded list (a hardcoded list is how this rotation reached only
          # one app). A newly provisioned customer app matching the convention is
          # covered without editing anything here. The sandbox image app is
          # excluded: it IS the isolation boundary and must never carry a receipt.
          apps_json="$(flyctl apps list --json)"
          targets="$(APPS_JSON="$apps_json" node --import tsx --input-type=module -e '
            import { parseFlyAppListing, resolveSandboxEgressRotationTargets } from "@mendpoint/ops";
            const apps = parseFlyAppListing(process.env.APPS_JSON ?? "");
            const prefixes = (process.env.SANDBOX_EGRESS_ROTATION_APP_PREFIXES ?? "")
              .split(",").map((value) => value.trim()).filter(Boolean);
            const targets = resolveSandboxEgressRotationTargets(apps, {
              verifyingApp: process.env.SANDBOX_VERIFYING_APP ?? "",
              includePrefixes: prefixes,
              org: process.env.FLY_ORG?.trim() || undefined,
              excludeApps: [process.env.MENDPOINT_SANDBOX_EGRESS_APP ?? ""],
            });
            process.stdout.write(targets.join("\n"));
          ')"
          test -n "$targets"
          printf '%s\n' "$targets" > test-results/sandbox-egress/rotation-targets.txt
          while IFS= read -r app; do
            test -n "$app" || continue
            # A direct Machines-API app with a volume is unsafe to rotate through
            # Launch because it can infer new capacity while the only volume is
            # attached. Require an existing Launch process group before rotating
            # anything, preserve that group while updating the exact Machines,
            # and prove Launch v2 ownership before deploying the vault generation.
            machines_json="$(flyctl machine list --app "$app" --json)"
            jq -e 'length > 0 and all(.[];
              .state == "started"
              and (.image_ref.registry | type == "string" and length > 0)
              and (.image_ref.repository | type == "string" and length > 0)
              and (.image_ref.digest | type == "string" and test("^sha256:[a-f0-9]{64}$"))
              and (.config.metadata.fly_process_group | type == "string" and length > 0)
            )' \
              <<<"$machines_json" >/dev/null
            launch_groups_before="$(jq -cS '[.[] | {
              id,
              processGroup: .config.metadata.fly_process_group
            }] | sort_by(.id)' <<<"$machines_json")"
            # image_refs_before derives from image_ref on BOTH sides of the
            # post-update comparison, so it stays as-is: it is symmetric and
            # was never the defect.
            image_refs_before="$(jq -cS '[.[] | {
              id,
              image: (.image_ref | "\(.registry)/\(.repository)@\(.digest)")
            }] | sort_by(.id)' <<<"$machines_json")"
            # expected_machine_configs WAS the defect: it overrode .image with
            # a synthesised "registry/repository@digest" and compared that to
            # the machine's real .config, whose .image is tag-form
            # ("registry.fly.io/<app>:deployment-<id>", verified live). The two
            # sides could never be equal, so a SUCCESSFUL rollback was still
            # scored rollback_failed, which is what drove containment to stop
            # the production machine. Compare the config Fly actually reports,
            # and normalise the image's digest suffix on both sides because
            # flyctl pins "repo:tag" to "repo:tag@sha256:..." when it applies
            # an update.
            expected_machine_configs="$(jq -cS '[.[]
              | {id, state, config: (.config | .image |= split("@sha256:")[0])}
            ] | sort_by(.id)' <<<"$machines_json")"
            machine_backup_dir="test-results/sandbox-egress/machine-config-${app}"
            mkdir -p "$machine_backup_dir"
            while IFS= read -r machine_id; do
              [[ "$machine_id" =~ ^[a-f0-9]+$ ]]
              # Back up the config exactly as Fly reported it. Overriding
              # .image with a synthesised digest-form string made the restore
              # payload disagree with the machine's real image.
              jq -c --arg id "$machine_id" \
                '.[] | select(.id == $id) | .config' \
                <<<"$machines_json" >"${machine_backup_dir}/${machine_id}.json"
            done < <(jq -r '.[].id' <<<"$machines_json")

            contain_current_machines() {
              local reason="$1"
              printf 'contain\t%s\n' "$reason" \
                >>"test-results/sandbox-egress/rotation-recovery-${app}.txt"
              if ! containment_before_json="$(flyctl machine list --app "$app" --json)"; then
                printf '[]\n' \
                  >"test-results/sandbox-egress/containment-before-${app}.json"
                printf 'containment_unproven\t%s\n' "$reason" \
                  >>"test-results/sandbox-egress/rotation-recovery-${app}.txt"
                return 1
              fi
              printf '%s\n' "$containment_before_json" \
                >"test-results/sandbox-egress/containment-before-${app}.json"
              if ! jq -e --argjson original "$machines_json" '
                  ([.[].id] | sort) == ([$original[].id] | sort)
                ' <<<"$containment_before_json" >/dev/null; then
                printf 'containment_id_drift\t%s\n' "$reason" \
                  >>"test-results/sandbox-egress/rotation-recovery-${app}.txt"
              fi
              for containment_attempt in 1 2 3; do
                if ! containment_pass_json="$(flyctl machine list --app "$app" --json)"; then
                  break
                fi
                printf '%s\n' "$containment_pass_json" \
                  >"test-results/sandbox-egress/containment-pass-${containment_attempt}-${app}.json"
                if jq -e 'all(.[]; .state == "stopped")' \
                    <<<"$containment_pass_json" >/dev/null; then
                  break
                fi
                while IFS= read -r current_machine_id; do
                  flyctl machine stop "$current_machine_id" --app "$app" || true
                done < <(jq -r '.[] | select(.state != "stopped") | .id' \
                  <<<"$containment_pass_json")
              done
              if ! contained_machines_json="$(flyctl machine list --app "$app" --json)"; then
                printf '[]\n' \
                  >"test-results/sandbox-egress/contained-machines-${app}.json"
                printf 'containment_unproven\t%s\n' "$reason" \
                  >>"test-results/sandbox-egress/rotation-recovery-${app}.txt"
                return 1
              fi
              printf '%s\n' "$contained_machines_json" \
                >"test-results/sandbox-egress/contained-machines-${app}.json"
              if ! jq -e 'all(.[]; .state == "stopped")' \
                  <<<"$contained_machines_json" >/dev/null; then
                printf 'containment_unproven\t%s\n' "$reason" \
                  >>"test-results/sandbox-egress/rotation-recovery-${app}.txt"
                return 1
              fi
              printf 'containment_proven\t%s\n' "$reason" \
                >>"test-results/sandbox-egress/rotation-recovery-${app}.txt"
            }

            attempted_machine_ids=()
            # Rollback stays, but it is NOT the safety net. In run 33288965039
            # the restore itself SUCCEEDED ("Machine 84e696a22eee68 updated
            # successfully!") and containment stopped the production machine
            # anyway, because the verification baseline below could never
            # match. The baseline being correct is what matters here; a
            # malformed image must be caught before the mutation, not undone
            # after it.
            rollback_attempted_machines() {
              local reason="$1"
              local rollback_failed=false
              printf 'rollback\t%s\n' "$reason" \
                >>"test-results/sandbox-egress/rotation-recovery-${app}.txt"
              for attempted_machine_id in "${attempted_machine_ids[@]}"; do
                if ! flyctl machine update "$attempted_machine_id" --app "$app" \
                    --machine-config "${machine_backup_dir}/${attempted_machine_id}.json" \
                    --skip-health-checks --yes; then
                  rollback_failed=true
                fi
              done
              if [ "$rollback_failed" = false ]; then
                restored_machines_json="$(flyctl machine list --app "$app" --json)"
                if ! jq -e --argjson expected "$expected_machine_configs" '
                    ([.[]
                      | {id, state, config: (.config | .image |= split("@sha256:")[0])}
                    ] | sort_by(.id)) == $expected
                  ' <<<"$restored_machines_json" >/dev/null; then
                  rollback_failed=true
                fi
              fi
              if [ "$rollback_failed" = true ]; then
                contain_current_machines "rollback_failed:${reason}"
              fi
              return 1
            }

            # Pre-mutation image guard. flyctl APPENDS the resolved digest to
            # whatever string --image is given, so a digest-form argument
            # becomes "repo@sha256:X@sha256:X" and the Machines API rejects it
            # with "config.image: invalid image identifier". That is exactly
            # what broke production in run 33288965039: the workflow passed a
            # single well-formed digest ref and flyctl doubled it. Tag-form is
            # safe because "repo:tag@sha256:X" is a legal reference. Do NOT
            # "simplify" this back to
            # "\(.registry)/\(.repository)@\(.digest)" over image_ref.
            assert_mutable_image() {
              local guard_machine_id="$1"
              local candidate="$2"
              local canonical
              canonical="$(jq -r --arg id "$guard_machine_id" \
                '.[] | select(.id == $id) | .config.image' <<<"$machines_json")"
              if [ -z "$canonical" ] || [ "$canonical" = "null" ]; then
                printf 'image_guard_no_canonical\t%s\n' "$guard_machine_id" \
                  >>"test-results/sandbox-egress/rotation-recovery-${app}.txt"
                return 1
              fi
              if [ "$candidate" != "$canonical" ]; then
                printf 'image_guard_not_canonical\t%s\t%s\n' \
                  "$guard_machine_id" "$candidate" \
                  >>"test-results/sandbox-egress/rotation-recovery-${app}.txt"
                return 1
              fi
              case "$candidate" in
                *@sha256:*)
                  printf 'image_guard_digest_form\t%s\t%s\n' \
                    "$guard_machine_id" "$candidate" \
                    >>"test-results/sandbox-egress/rotation-recovery-${app}.txt"
                  return 1
                  ;;
              esac
              if ! [[ "$candidate" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+(:[a-zA-Z0-9._-]+)?$ ]]; then
                printf 'image_guard_malformed\t%s\t%s\n' \
                  "$guard_machine_id" "$candidate" \
                  >>"test-results/sandbox-egress/rotation-recovery-${app}.txt"
                return 1
              fi
            }

            while IFS=$'\t' read -r machine_id machine_image machine_process_group; do
              test -n "$machine_id"
              test -n "$machine_image"
              test -n "$machine_process_group"
              # Guard BEFORE the machine is recorded as attempted and before
              # any mutating call, so a rejected image never reaches Fly and
              # never needs rollback.
              if ! assert_mutable_image "$machine_id" "$machine_image"; then
                exit 1
              fi
              attempted_machine_ids+=("$machine_id")
              if ! flyctl machine update "$machine_id" --app "$app" \
                  --image "$machine_image" \
                  --env "MENDPOINT_SANDBOX_FLY_IMAGE=$MENDPOINT_SANDBOX_EGRESS_IMAGE" \
                  --metadata fly_platform_version=v2 \
                  --metadata "fly_process_group=$machine_process_group" \
                  --skip-health-checks --yes; then
                rollback_attempted_machines "machine_update_failed:${machine_id}" || true
                exit 1
              fi
            done < <(jq -r '.[] | [
              .id,
              .config.image,
              .config.metadata.fly_process_group
            ] | @tsv' <<<"$machines_json")
            updated_machines_json="$(flyctl machine list --app "$app" --json)"
            if ! jq -e --argjson expected "$launch_groups_before" \
                --argjson expected_images "$image_refs_before" '
                ([.[] | {
                  id,
                  processGroup: .config.metadata.fly_process_group
                }] | sort_by(.id)) == $expected
                and ([.[] | {
                  id,
                  image: (.image_ref | "\(.registry)/\(.repository)@\(.digest)")
                }] | sort_by(.id)) == $expected_images
                and all(.[]; .config.metadata.fly_platform_version == "v2")
              ' <<<"$updated_machines_json" >/dev/null; then
              rollback_attempted_machines "post_update_invariant_failed" || true
              exit 1
            fi
            if ! flyctl secrets set --app "$app" \
                MENDPOINT_SANDBOX_FLY_IMAGE="$MENDPOINT_SANDBOX_EGRESS_IMAGE" \
                MENDPOINT_SANDBOX_EGRESS_ATTESTATION_BASE64="$attestation" \
                MENDPOINT_SANDBOX_EGRESS_ATTESTATION_PUBLIC_KEY_SPKI_BASE64="$public_key" \
                MENDPOINT_SANDBOX_EGRESS_ATTESTATION_KEY_ID="$key_id" \
                MENDPOINT_SANDBOX_EGRESS_POLICY_DIGEST="$policy_digest" \
                MENDPOINT_SANDBOX_EGRESS_ATTESTATION_MIN_SCHEMA="$schema"; then
              contain_current_machines "secret_deploy_outcome_unknown"
              exit 1
            fi
            if ! flyctl secrets list --app "$app" --json \
                | jq -e 'length > 0 and all(.[]; .status == "Deployed")' >/dev/null; then
              contain_current_machines "secret_generation_not_deployed"
              exit 1
            fi
            post_secret_machines_json="$(flyctl machine list --app "$app" --json)"
            if ! jq -e --argjson expected "$launch_groups_before" \
                --argjson expected_images "$image_refs_before" \
                --arg expected_sandbox_image "$MENDPOINT_SANDBOX_EGRESS_IMAGE" '
                ([.[] | {
                  id,
                  processGroup: .config.metadata.fly_process_group
                }] | sort_by(.id)) == $expected
                and ([.[] | {
                  id,
                  image: (.image_ref | "\(.registry)/\(.repository)@\(.digest)")
                }] | sort_by(.id)) == $expected_images
                and all(.[];
                  .config.metadata.fly_platform_version == "v2"
                  and .config.env.MENDPOINT_SANDBOX_FLY_IMAGE == $expected_sandbox_image
                )
              ' <<<"$post_secret_machines_json" >/dev/null; then
              contain_current_machines "post_secret_invariant_failed"
              exit 1
            fi
            # This job rotates egress attestation. The only thing it is
            # entitled to assert afterwards is that the app it just mutated is
            # still alive and serving, which is /livez. It must NOT gate on
            # /healthz: apps/web/app/readyz/route.ts re-exports the /healthz
            # handler, so the two are the SAME handler, and it reports
            # last_verified_backup. Backup freshness has nothing to do with
            # egress, and gating on it means an unrelated subsystem going stale
            # makes this job call contain_current_machines, which runs
            # "flyctl machine stop" against customer production on a 6-hourly
            # schedule. fly.customer-warden.toml already points Fly's own
            # machine check at /livez, and ci.yml's customer deploy gate was
            # changed the same way for the same reason (PR #555).
            # /healthz is still probed and printed below, as diagnostic output
            # only -- never gating.
            healthy=false
            for attempt in $(seq 1 24); do
              if curl --silent --show-error --fail --max-time 10 \
                  "https://${app}.fly.dev/livez" \
                  >"test-results/sandbox-egress/livez-${app}.json"; then
                healthy=true
                break
              fi
              sleep 5
            done
            # Diagnostic only. A red /healthz here is worth seeing precisely
            # because we now know it used to have a destructive consequence.
            health_code="$(curl --silent --output "test-results/sandbox-egress/healthz-${app}.json" \
              --write-out '%{http_code}' --max-time 10 \
              "https://${app}.fly.dev/healthz" || true)"
            echo "  /healthz -> http ${health_code} (diagnostic only -- rotation does NOT gate on this; see the note above)"
            if [ "$healthy" != true ]; then
              contain_current_machines "post_rotation_health_failed"
              echo "The app $app did not become healthy after receipt rotation"
              exit 1
            fi
          done <<< "$targets"
      - name: Confirm the renewed receipt has healthy margin
        shell: bash
        run: |
          set -euo pipefail
          # Fail loudly (and page) if the freshly minted receipt is somehow
          # already inside the alert lead window -- a misconfigured lifetime would
          # otherwise ship a receipt that lapses before the next renewal.
          node --import tsx scripts/check-sandbox-egress-freshness.ts
      - name: Upload sandbox acceptance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sandbox-egress-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/sandbox-egress/
          if-no-files-found: error
          retention-days: 90
      - name: Alert on renewal failure
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A failed renewal is surfaced immediately -- hours before the receipt
          # lapses -- as a GitHub issue in this repo, not discovered when workers
          # start crash-looping. No external paging secret: the repo's own issues
          # are the sink. Idempotent -- one open alert is reused (a comment is
          # appended) instead of duplicated -- and auto-closed by the success path
          # below once a renewal run passes.
          label="sandbox-egress-renewal-failure"
          gh label create "$label" --repo "$GH_REPO" --color b60205 \
            --description "Automated: sandbox egress receipt renewal failed" >/dev/null 2>&1 || true
          existing="$(gh issue list --repo "$GH_REPO" --state open --label "$label" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" \
              --body "Renewal failed again. Failed run: $RUN_URL"
          else
            body="$(printf '%s\n' \
              "The sandbox egress receipt renewal run failed. The receipt will lapse without a fresh mint; once it does, sandbox verification is unavailable and workers crash-loop." \
              "" \
              "Failed run: $RUN_URL" \
              "Runbook: docs/CUSTOMER_INCIDENT_RUNBOOK.md" \
              "" \
              "Opened automatically on failure; closed automatically once a renewal succeeds.")"
            gh issue create --repo "$GH_REPO" --label "$label" \
              --title "Sandbox egress receipt renewal FAILED" --body "$body"
          fi
      - name: Resolve the renewal-failure alert on success
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Auto-close any open renewal-failure alert once a renewal succeeds, so
          # the alert reflects live state instead of lingering after recovery.
          label="sandbox-egress-renewal-failure"
          for number in $(gh issue list --repo "$GH_REPO" --state open --label "$label" \
            --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GH_REPO" --reason completed \
              --comment "Renewal succeeded: $RUN_URL. Closing automatically."
          done
