app = "mendpoint-talal"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"
  target = "fly"

[env]
  NODE_ENV = "production"
  API_AUTH = "required"
  API_HOST = "127.0.0.1"
  API_PORT = "3001"
  MENDPOINT_DEPLOYMENT_PROFILE = "demo"
  HOSTNAME = "0.0.0.0"
  PORT = "3000"
  GITHUB_MODE = "mock"
  MENDPOINT_DATA_DIR = "/data/db"
  MENDPOINT_REPOS_DIR = "/data/repos"
  MENDPOINT_WORKER_HEARTBEAT_PATH = "/data/state/worker-heartbeat.json"
  MENDPOINT_WORKER_HEARTBEAT_MAX_AGE_MS = "30000"
  GRAPH_LEARN_DB = "/data/db/graph-learn.sqlite"
  MENDPOINT_ALERTS_PATH = "/data/state/alerts.jsonl"
  MENDPOINT_API_URL = "http://127.0.0.1:3001"
  MENDPOINT_PILOT_SEED = "1"
  MENDPOINT_VERIFY_FIRST = "1"
  MENDPOINT_APPROVED_VERIFIER_SHA256S = "644da6b3198cc32ca95595c7a3af09c9a8444cedd27917a03c3d3bcc775a4a7d"
  # Route verification through an ephemeral Fly Machine instead of host execFile
  # in the worker container. Fail-closed: if the sandbox app or its token is not
  # provisioned, verification FAILS (it never degrades to host execution). The
  # credential is a secret and lives in `fly secrets`, never here:
  #   fly secrets set MENDPOINT_SANDBOX_FLY_TOKEN=... --app mendpoint-talal
  # See docs/SANDBOX_VERIFIER.md for the operator checklist and egress policy.
  MENDPOINT_SANDBOX_KIND = "fly_machines"
  MENDPOINT_SANDBOX_FLY_APP = "mendpoint-sandbox"
  # The sandbox image IS the isolation boundary, so it MUST be pinned to an
  # immutable digest, never a floating `:latest` tag (which can change with no
  # review or reproducibility). An unpinned or empty value FAILS CLOSED:
  # packages/platform/src/fly-sandbox.ts refuses to run and never falls back to
  # the host (sandbox_image_unresolved / sandbox_image_not_pinned).
  # Pinned 2026-08-19 to the hardened reject-plus-default-drop image digest,
  # reviewed here so a change to the isolation boundary is diffable. Rotate by
  # pushing a new image, capturing its digest, and editing the line below.
  # NOTE: a MENDPOINT_SANDBOX_FLY_IMAGE Fly secret, if set, overrides this value
  # and is invisible to review -- prefer the reviewed config here.
  # See docs/SANDBOX_IMAGE.md ("Pin production to an immutable reference").
  MENDPOINT_SANDBOX_FLY_IMAGE = "registry.fly.io/mendpoint-sandbox@sha256:3aadc8555de5bc2fc4b03f0c135c4b4a845d5a21de9fffd3a0056b98f062f15a"
  AGENTIC_REPAIR = "1"
  MENDPOINT_MODEL_PROVIDER = "muse-spark"
  LLM_AGENT_MODEL = "muse-spark-1.2-contributor"
  LLM_CONFIRM_MODEL = "muse-spark-1.2-contributor"
  MENDPOINT_LIVE_APPROVED_MODEL = "muse-spark-1.2-contributor"
  MENDPOINT_CHANGE_GRAPH_BENCHMARK_APPROVED_MODEL = "muse-spark-1.2-contributor"
  POLL_LOCAL_ONLY = "1"
  MENDPOINT_FEED_POLLING_ENABLED = "0"
  POLL_INTERVAL_MS = "5000"
  JOB_LEASE_MS = "30000"
  MENDPOINT_JOB_CONCURRENCY = "2"
  RATE_LIMIT_MAX = "120"
  RATE_LIMIT_WINDOW_MS = "60000"
  TRUST_PROXY = "1"
  WEB_URL = "https://mendpoint-talal.fly.dev"
  CORS_ORIGINS = "https://mendpoint-talal.fly.dev"
  MENDPOINT_WEB_ALLOWED_ORIGINS = "https://mendpoint-talal.fly.dev"

[[mounts]]
  source = "mendpoint_data"
  destination = "/data"
  initial_size = "20gb"
  snapshot_retention = 14

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "45s"
    interval = "15s"
    method = "GET"
    path = "/livez"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
