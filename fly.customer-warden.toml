# Apply this profile to a dedicated customer app with exactly one Machine.
# Customer-specific values are injected as Fly secrets and are never stored here.
# Required names are enumerated in scripts/customer-warden-profile.ts.
# Encrypted bundles are published directly to Tigris through rclone. The
# application data volume remains the only Fly Volume attached to the Machine.

kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"
  target = "fly"

[env]
  NODE_ENV = "production"
  API_AUTH = "required"
  API_HOST = "127.0.0.1"
  API_PORT = "3001"
  HOSTNAME = "0.0.0.0"
  PORT = "3000"
  MENDPOINT_DEPLOYMENT_PROFILE = "customer"
  MENDPOINT_DEPLOYMENT_CLASS = "customer"
  # Readiness is declared per deployment, never inherited as a shared constant.
  # Each customer app sets MENDPOINT_CUSTOMER_READY as a Fly env/secret at
  # provisioning time: "1" declares the deployment ready (boots ready only when
  # every precondition in scripts/customer-warden-profile.ts is met), "0"
  # declares an honest not-ready hold (boots but the /readyz probe reports not
  # ready). It is intentionally absent here: an unset or unrecognized value is
  # indeterminate and fails closed at boot rather than reading as ready.
  #   fly secrets set MENDPOINT_CUSTOMER_READY=1 --app <customer-app>
  MENDPOINT_CUSTOMER_TOPOLOGY = "single_node"
  MENDPOINT_CUSTOMER_MAX_MACHINES = "1"
  GITHUB_MODE = "real"
  MENDPOINT_DATA_DIR = "/data/db"
  MENDPOINT_REPOS_DIR = "/data/repos"
  MENDPOINT_WORKER_HEARTBEAT_PATH = "/data/state/worker-heartbeat.json"
  MENDPOINT_WORKER_HEARTBEAT_MAX_AGE_MS = "30000"
  GRAPH_LEARN_DB = "/data/db/graph-learn.sqlite"
  MENDPOINT_ALERTS_PATH = "/data/state/alerts.jsonl"
  MENDPOINT_API_URL = "http://127.0.0.1:3001"
  MENDPOINT_PILOT_SEED = "0"
  MENDPOINT_VERIFY_FIRST = "1"
  # Verification runs inside an ephemeral Fly Machine, never via host execFile in
  # the customer worker container. Fail-closed: without the sandbox app and its
  # token, verification FAILS rather than falling back to host execution. The
  # token is a per-customer Fly secret (see scripts/customer-warden-profile.ts),
  # injected at provisioning, never stored here:
  #   fly secrets set MENDPOINT_SANDBOX_FLY_TOKEN=... --app <customer-app>
  # See docs/SANDBOX_VERIFIER.md for the operator checklist and egress policy.
  MENDPOINT_SANDBOX_KIND = "fly_machines"
  MENDPOINT_SANDBOX_FLY_APP = "mendpoint-sandbox"
  # The sandbox image IS the isolation boundary, so it MUST be pinned to an
  # immutable digest, never a floating `:latest` tag (which can change with no
  # review or reproducibility). An unpinned or empty value FAILS CLOSED:
  # packages/platform/src/fly-sandbox.ts refuses to run and never falls back to
  # the host (sandbox_image_unresolved / sandbox_image_not_pinned).
  # Pinned 2026-08-18 to the digest the sandbox image push printed, reviewed
  # here in config so a change to the isolation boundary is diffable. Rotate by
  # pushing a new image, capturing its digest, and editing the line below.
  # NOTE: a MENDPOINT_SANDBOX_FLY_IMAGE Fly secret, if set, overrides this value
  # and is invisible to review -- prefer the reviewed config here.
  # See docs/SANDBOX_IMAGE.md ("Pin production to an immutable reference").
  MENDPOINT_SANDBOX_FLY_IMAGE = "registry.fly.io/mendpoint-sandbox@sha256:58a68f6680467330d10a4f76308a0bd12356d219a027fc4a4e482166c44e6684"
  AGENTIC_REPAIR = "1"
  POLL_LOCAL_ONLY = "0"
  MENDPOINT_FEED_POLLING_ENABLED = "1"
  MENDPOINT_WARDEN_MODEL_SOURCE_ENABLED = "1"
  MENDPOINT_WARDEN_EXTERNAL_PROCESSING_ALLOWED = "1"
  MENDPOINT_BACKUP_TRANSPORT = "rclone_s3"
  MENDPOINT_BACKUP_OUTPUT_ROOT = "/tmp/mendpoint-backup-staging"
  MENDPOINT_BACKUP_STAGING_ROOT = "/tmp/mendpoint-backup-staging"
  MENDPOINT_BACKUP_OBJECT_PREFIX = "backups"
  MENDPOINT_BACKUP_OPERATION_TIMEOUT_MS = "14400000"
  MENDPOINT_BACKUP_STORAGE_CLASS = "object_store_publish"
  AWS_REGION = "auto"
  MENDPOINT_TRANSFORMER_ENABLED = "0"
  MENDPOINT_TRANSFORMER_ADAPTIVE_MODEL_SOURCE_ENABLED = "0"
  POLL_INTERVAL_MS = "5000"
  JOB_LEASE_MS = "30000"
  MENDPOINT_JOB_CONCURRENCY = "2"
  RATE_LIMIT_MAX = "120"
  RATE_LIMIT_WINDOW_MS = "60000"
  TRUST_PROXY = "1"

[[mounts]]
  source = "mendpoint_data"
  destination = "/data"
  initial_size = "20gb"
  snapshot_retention = 14

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "45s"
    interval = "15s"
    method = "GET"
    path = "/livez"
    timeout = "5s"

[[vm]]
  size = "performance-4x"
  memory = "8gb"
